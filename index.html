<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2F5">
<title>Diamond Painting Colors</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<!-- iOS ignores SVG here and would fall back to a screenshot-ish tile; the home
     screen icon has to be a real PNG, opaque and square — iOS rounds it itself -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DP Colors">
<style>html,body{margin:0;background:#F3F2F5;}</style>
<script src="version.js"></script>
<script>
/* The chosen theme and text size live in the app's database, which loads a moment
   after the page appears — so a dark page used to flash light on every start, and
   a page set to 140% would appear small and then jump. These hints are written on
   every change and read here, before first paint. */
try{
  if(localStorage.getItem('dpTheme')==='dark'){
    var _st=document.createElement('style'); _st.id='themeBoot';
    _st.textContent='html,body,.dp-app{background:#16141B !important;}';
    document.head.appendChild(_st);
    var _mt=document.querySelector('meta[name="theme-color"]');
    if(_mt)_mt.setAttribute('content','#16141B');
  }
  var _sz=parseInt(localStorage.getItem('dpSize')||'',10);
  if(_sz>=80&&_sz<=220&&_sz!==100){
    var _zs=document.createElement('style'); _zs.id='sizeBoot';
    _zs.textContent='.dp-app{zoom:'+(_sz/100)+';}';
    document.head.appendChild(_zs);
  }
}catch(e){}
</script>
</head>
<body>
<style>
  :root{
    --bg:#F3F2F5; --panel:#FFFFFF; --ink:#26222E; --muted:#7A7486;
    --line:#E4E1EA; --accent:#5B3FA8; --accent-soft:#EFEAFB;
    --sq:#2E6FBF; --sq-soft:#E7F0FB;
    --rd:#2F9E63; --rd-soft:#E6F6EE;
    --od:#B0398F; --od-soft:#F9E9F4;
    --unk:#8A8494; --unk-soft:#EEEDF1;
    --star:#B98A2F; --star-soft:#F8EFDC;
    --bad:#A8324B; --bad-soft:#F8E6EA;
  }
  .dp-app.dark{
    --bg:#16141B; --panel:#221F2A; --ink:#ECE9F2; --muted:#9E98AC;
    --line:#332F3D; --accent:#B49BF2; --accent-soft:#2E2646;
    --sq:#6FA8E6; --sq-soft:#1E2A3A;
    --rd:#5FC98C; --rd-soft:#16301F;
    --od:#E084C4; --od-soft:#33172B;
    --unk:#A79FB4; --unk-soft:#2A2733;
    --star:#E0B65F; --star-soft:#332A16;
    --bad:#E58AA0; --bad-soft:#3A1E26;
  }
  .dp-app.dark img.ovthumb,.dp-app.dark .photo-grid img{filter:brightness(.94);}
  .dp-app{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg); min-height:100vh; padding:14px 12px 60px;
    position:relative; z-index:1;}
  .dp-app *{box-sizing:border-box;}
  /* keyboard focus must be visible on everything tappable — the cards and
     fold-away headings are divs, so the browser's default outline never came */
  .dp-app button:focus-visible,.dp-app [role="button"]:focus-visible,
  .dp-app input:focus-visible,.dp-app textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;}
  .wrap{max-width:900px;margin:0 auto;}
  .dp-title{font-size:20px;font-weight:800;letter-spacing:.2px;margin:2px 2px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .dp-title .gem{width:16px;height:16px;background:linear-gradient(135deg,#8f6fe0 0%,#5B3FA8 55%,#3c2a75 100%);
    transform:rotate(45deg);border-radius:4px;
    box-shadow:inset -2px -2px 0 rgba(0,0,0,.18), inset 2px 2px 0 rgba(255,255,255,.35);}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;}
  .tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
    padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .tab .cnt{color:var(--muted);font-weight:600;margin-left:6px;font-size:12px;}
  .tab.active{border-color:var(--accent);background:var(--accent);color:#fff;}
  .tab.active .cnt{color:#E4DBFA;}
  .tab.add{border-style:dashed;color:var(--accent);background:transparent;font-weight:700;}
  .tab.home,.tab.find,.tab.paints{font-weight:700;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .search{flex:1 1 200px;display:flex;align-items:center;background:var(--panel);border:1.5px solid var(--line);
    border-radius:12px;padding:9px 12px;gap:8px;}
  .search input{border:none;outline:none;font-size:15px;flex:1;background:transparent;color:var(--ink);}
  .chipbtn{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;
    font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);}
  .chipbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .chipbtn.danger{color:#A8324B;}
  .chipbtn.confirm{background:#A8324B !important;border-color:#A8324B !important;color:#fff !important;}
  .renamer{display:none;gap:8px;align-items:center;margin-bottom:10px;}
  .renamer.show{display:flex;}
  .renamer input{flex:1;border:1.5px solid var(--accent);border-radius:12px;padding:9px 12px;font-size:15px;outline:none;min-width:0;}
  .typerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  .typerow .lbl{font-size:13px;color:var(--muted);font-weight:600;}
  .tbtn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;
    font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .tbtn.sq.on{background:var(--sq);border-color:var(--sq);color:#fff;}
  .tbtn.rd.on{background:var(--rd);border-color:var(--rd);color:#fff;}
  .tbtn.od.on{background:var(--od);border-color:var(--od);color:#fff;}
  .tbtn.any.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .fbtn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;
    font-size:13px;font-weight:700;cursor:pointer;}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;}
  .badge.sq{background:var(--sq-soft);color:var(--sq);}
  .badge.rd{background:var(--rd-soft);color:var(--rd);}
  .badge.od{background:var(--od-soft);color:var(--od);}
  .badge.unk{background:var(--unk-soft);color:var(--unk);}
  .badge.star{background:var(--star-soft);color:var(--star);}
  .fin-tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;margin-right:4px;}
  .meta{color:var(--muted);font-size:13px;padding:0 2px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px;}
  .card{display:flex;align-items:center;gap:9px;background:var(--panel);border:1.5px solid var(--line);
    border-radius:12px;padding:8px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;position:relative;}
  .card:active{transform:scale(.985);}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset;background:var(--accent-soft);}
  .card.open{border-color:var(--ink);}
  .drill{width:34px;height:34px;border-radius:8px;flex:0 0 auto;border:1px solid rgba(0,0,0,.14);
    background-image:linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 45%,rgba(0,0,0,.12) 100%);pointer-events:none;}
  .drill.spec{display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.35);}
  .ctext{min-width:0;pointer-events:none;}
  .code{font-weight:800;font-size:14px;line-height:1.1;}
  .cname{font-size:11.5px;color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .tick{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--accent);
    color:#fff;font-size:12px;line-height:18px;text-align:center;display:none;pointer-events:none;}
  .card.sel .tick{display:block;}
  .pcount{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:var(--accent);
    color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;padding:0 5px;pointer-events:none;}
  .pcount.zero{background:var(--unk-soft);color:var(--unk);}
  .delx{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#A8324B;color:#fff;
    border:2px solid var(--panel);font-size:12px;font-weight:800;line-height:18px;text-align:center;cursor:pointer;z-index:3;}
  .photo-grid .delx{width:24px;height:24px;line-height:20px;top:-8px;right:-8px;}
  .expander{grid-column:1/-1;background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;padding:10px;}
  .exp-head{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;}
  .exp-list{display:flex;flex-direction:column;gap:6px;}
  .exp-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;}
  .exp-item:active{transform:scale(.99);}
  .exp-name{font-weight:800;font-size:14px;margin-right:auto;}
  .empty{margin:30px auto;text-align:center;color:var(--muted);font-size:15px;max-width:420px;}
  .toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:6px 14px;border-radius:999px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;z-index:50;}
  .toast.show{opacity:.92;}
  .ovlist{display:flex;flex-direction:column;gap:8px;}
  /* the status stripe is drawn as this card's own edge; without a positioned card
     it had been measuring itself against the whole page and drawing one long line
     down the side of the list instead */
  .ovcard{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px;
    cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;}
  .ovcard:active{transform:scale(.99);}
  .ovtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ovname{font-weight:800;font-size:16px;margin-right:auto;}
  .ovsub{color:var(--muted);font-size:13px;margin-top:3px;}
  .ovfins{margin-top:6px;}
  .ovswatches{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap;align-items:center;}
  .ovthumb{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--line);}
  .ovtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .ovtag{background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;}
  .ovbody{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px;}
  .ovinfo{flex:1 1 150px;min-width:0;}
  .ovphotos{display:flex;gap:7px;flex-wrap:wrap;flex:0 0 auto;}
  .ovphoto{position:relative;flex:0 0 auto;}
  .ovphoto img{display:block;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--unk-soft);width:128px;height:96px;}
  .ovphotos.frame-portrait .ovphoto img{width:96px;height:124px;}
  .ovphotos.frame-square .ovphoto img{width:108px;height:108px;}
  .ovphotos.frame-round .ovphoto img{width:108px;height:108px;border-radius:50%;}
  .ovphoto-lbl{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:800;letter-spacing:.3px;padding:2px 8px;border-radius:999px;}
  .ovcard.stripe{padding-left:16px;}
  .ovcard.stripe::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:14px 0 0 14px;background:var(--stripe,transparent);}
  /* progress as a badge, not a banner: a short bar with the number beside it */
  .ovpct{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--rd);
    background:var(--rd-soft);border-radius:999px;padding:3px 9px 3px 7px;flex:0 0 auto;}
  .ovpct-bar{width:42px;height:5px;border-radius:999px;background:rgba(0,0,0,.10);overflow:hidden;}
  .dp-app.dark .ovpct-bar{background:rgba(255,255,255,.16);}
  .ovpct-bar>i{display:block;height:100%;border-radius:999px;background:var(--rd);}
  .ovprogrow{margin-top:8px;}
  /* ---- card style: roomy ---- */
  .ovcard.st-roomy .ovswatches .mini{width:20px;height:20px;border-radius:6px;}
  .ovcard.st-roomy .ovswatches .mini.more{width:auto;line-height:20px;font-size:10px;}
  .ovcard.st-roomy .ovphoto img{width:150px;height:112px;}
  .ovcard.st-roomy .ovphotos.frame-portrait .ovphoto img{width:112px;height:150px;}
  .ovcard.st-roomy .ovphotos.frame-square .ovphoto img,
  .ovcard.st-roomy .ovphotos.frame-round .ovphoto img{width:130px;height:130px;}
  /* ---- card style: tiles ---- */
  .ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-items:start;}
  .ovcard.st-tile{padding:0;overflow:hidden;display:flex;flex-direction:column;}
  .ovcard.st-tile.stripe{padding-left:0;}
  .ovcard.st-tile.stripe::before{width:100%;height:5px;bottom:auto;border-radius:0;}
  .tile-pic{position:relative;width:100%;aspect-ratio:4/3;background:var(--unk-soft);}
  .tile-pic img{width:100%;height:100%;display:block;}
  .tile-pic.empty{display:flex;align-items:center;justify-content:center;}
  .tile-none{font-size:12px;color:var(--muted);font-weight:700;}
  .tile-sel{position:absolute;top:8px;left:8px;}
  .tile-body{padding:9px 10px 11px;}
  .tile-body .ovname{font-size:15px;line-height:1.25;overflow-wrap:anywhere;}
  .tile-badges{margin-top:6px;gap:5px;}
  .tile-body .ovsub{margin-top:5px;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .tile-body .ovname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  /* the background layer: fixed so it doesn't scroll away, and behind everything */
  #bgArt{position:fixed;inset:0;z-index:0;pointer-events:none;background-repeat:repeat;background-position:center;}
  #bgArt.bg-wash{opacity:.16;}
  #bgArt.bg-photo{opacity:.30;filter:blur(9px) saturate(.85);transform:scale(1.08);}
  .bgswatch{width:52px;height:34px;border-radius:9px;border:2px solid var(--line);cursor:pointer;padding:0;
    background-size:cover;background-position:center;}
  .bgswatch.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent);}
  .acc-sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;}
  .acc-sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink);}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;z-index:100;padding:18px;cursor:zoom-out;outline:none;}
  .lightbox img{max-width:100%;max-height:100%;min-height:0;border-radius:10px;object-fit:contain;}
  .lb-cap{color:#fff;font-size:13px;font-weight:700;text-align:center;max-width:90%;flex:0 0 auto;}
  /* a caption sits on its gallery tile without stealing the tap */
  .vw-gitem{position:relative;display:block;}
  .vw-gcap{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;}
  /* ---- two pictures at once ----
     Lives outside the app's own box like the single-photo view, so its colours
     are written out rather than taken from the theme. */
  .cmp{flex-direction:column;gap:8px;padding:10px;cursor:default;}
  .cmp-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:0 0 auto;}
  .cmp-btn{border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.10);color:#fff;
    border-radius:11px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;}
  .cmp-body{flex:1 1 auto;display:flex;gap:10px;min-height:0;width:100%;}
  .cmp-body.stack{flex-direction:column;}
  .cmp-fig{flex:1 1 0;min-width:0;min-height:0;margin:0;display:flex;flex-direction:column;gap:6px;cursor:zoom-in;}
  .cmp-fig img{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;}
  .cmp-body.has-solo .cmp-fig{display:none;}
  .cmp-body.has-solo .cmp-fig.solo{display:flex;cursor:zoom-out;}
  .cmp-lbl{color:#fff;font-size:12px;font-weight:800;letter-spacing:.3px;text-align:center;flex:0 0 auto;}
  .cmp-hint{color:rgba(255,255,255,.65);font-size:11.5px;font-weight:700;text-align:center;flex:0 0 auto;}
  .undobar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;display:flex;gap:12px;align-items:center;z-index:90;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:92%;}
  .undobar button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:800;cursor:pointer;font-size:13px;}
  .paint-sticky{position:sticky;top:0;z-index:50;background:var(--bg);padding-bottom:6px;box-shadow:0 6px 10px -8px rgba(0,0,0,.35);}
  /* wraps only when there isn't room, which at big text sizes there isn't —
     a row that can't wrap pushes the whole page sideways */
  .paint-head{padding:6px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .photo-tools{border-top:1px solid var(--line);padding-top:6px;}
  .pt-row{display:flex;gap:10px;align-items:flex-start;}
  .pt-btns{flex:1 1 auto;min-width:0;}
  .photo-tools .photo-preview{max-width:104px;margin-top:0;flex:0 0 auto;}
  .photo-tools .photo-btns{margin-top:4px;}
  .pins{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 6px;}
  .pin{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;padding:2px 8px 2px 3px;font-size:11.5px;font-weight:800;cursor:pointer;background:var(--panel);}
  .pin .dot{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}
  .selbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;}
  .selbox.on{background:var(--accent);border-color:var(--accent);}
  .ovcard.picked{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset;}
  /* ---- arrange mode ---- */
  .arr-layer{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:30;}
  /* sent behind the page: under the cards and the words, above the page itself.
     Cards have a solid colour of their own, so a photo back here shows in the
     margins and the gaps — fade it and it reads as a watermark. */
  .arr-layer.behind{z-index:0;}
  .arr-layer.behind .arr-img{box-shadow:none;pointer-events:none;cursor:default;}
  .arr-img{position:absolute;display:block;cursor:grab;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.25);
    user-select:none;-webkit-user-drag:none;pointer-events:auto;touch-action:none;}
  .arr-img.sel{outline:3px solid var(--accent);outline-offset:2px;}
  .arr-img.locked{cursor:pointer;}
  .arr-handle{position:absolute;width:26px;height:26px;border-radius:7px;background:var(--accent);border:2.5px solid #fff;
    box-shadow:0 2px 7px rgba(0,0,0,.45);z-index:40;touch-action:none;pointer-events:auto;cursor:nwse-resize;}
  .arr-handle.rot{background:var(--star);border-radius:50%;cursor:grab;}
  .arr-hint{font-size:11px;color:var(--muted);margin-top:5px;}
  .arr-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-top:1.5px solid var(--line);
    padding:8px 12px 10px;box-shadow:0 -4px 18px rgba(0,0,0,.22);max-height:44vh;overflow:auto;}
  .arr-bar .arr-hint{margin-top:6px;}
  .arr-on{outline:2px dashed var(--accent);outline-offset:4px;border-radius:12px;}
  .cropbox{position:absolute;border:2px dashed #fff;background:rgba(91,63,168,.25);pointer-events:none;}
  .cropwrap{position:relative;display:inline-block;max-width:100%;touch-action:none;}
  .cropwrap img{max-width:100%;max-height:56vh;display:block;border-radius:8px;}
  .mini{width:16px;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.14);
    background-image:linear-gradient(135deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 50%,rgba(0,0,0,.1) 100%);}
  .mini.more{background:var(--unk-soft);color:var(--unk);font-size:9px;font-weight:800;width:auto;padding:0 5px;

  /* ---------- back-button navigation ----------
     Each view change adds a browser history entry, so the phone's back gesture
     and the PC's back button step back through the app (painting -> Paintings ->
     Overview) instead of closing it. NOTE: `history` is this file's own undo
     array, so the browser API must always be written as window.history. */
  function navState(extra){
    var s={dpView:state.view,dpActive:state.active};
    if(extra)s.dpOverlay=extra;
    return s;
  }
  function pushNav(extra){try{window.history.pushState(navState(extra),'');}catch(e){}}
  function replaceNav(){try{window.history.replaceState(navState(),'');}catch(e){}}
  /* Opening a project only swaps what is inside the page — the window keeps the
     distance it was scrolled to. So tapping a project near the bottom of a long
     list opened it already scrolled most of the way down, and the further down
     the list it was, the further down the project you landed. Every move now
     starts at the top of the new page, and coming back to the list puts you
     where you left it rather than at the top of a hundred projects. */
  var listScroll=0;
  function scrollNow(){try{return window.pageYOffset||document.documentElement.scrollTop||0;}catch(e){return 0;}}
  function scrollTo(y){
    try{window.scrollTo(0,y);}catch(e){}
    /* a second go on the next frame: the list's true height isn't known until it
       has been laid out, and until then a large y is clamped to a short page */
    try{requestAnimationFrame(function(){window.scrollTo(0,y);});}catch(e){}
  }
  function restoreScroll(){
    if(state.view==='paintings'){scrollTo(listScroll);return;}
    scrollTo(0);
  }
  function navTo(view,activeId){
    if(state.view==='paintings')listScroll=scrollNow();
    if(activeId)state.active=activeId;
    state.view=view; resetTransient();
    render(); save(); pushNav();
    restoreScroll();
  }
  function enterArrange(){

  /* Overlays (full-screen photo, arrange mode) deliberately add NO history entry.
     Back closes them and immediately re-pushes the entry it consumed, so the stack
     depth is unchanged. Pushing an entry per overlay meant that closing one by any
     other route (mode toggle, reset layout, navigation) left an orphan entry behind,
     which swallowed the next Back press — the "have to press back twice" bug. */
  window.addEventListener('popstate',function(e){
    var lb=document.querySelector('.lightbox');
    if(lb){if(lb._destroy)lb._destroy();else lb.remove();pushNav();return;}
    if(arrangeMode){arrangeMode=false;arrSel=-1;renderPainting();pushNav();return;}
    var st=e.state||{};
    if(!st.dpView)return;
    if(st.dpActive&&state.paintings.some(function(p){return p.id===st.dpActive;}))state.active=st.dpActive;
    if(state.view==='paintings')listScroll=scrollNow();
    state.view=(st.dpView==='paint'&&!state.paintings.some(function(p){return p.id===state.active;}))?'paintings':st.dpView;
    resetTransient(); render(); save(); restoreScroll();
  });

      inp.accept='.json,application/json,text/plain';

          $('bkText').value=String(rd.result||'');

        };

    $('bkRestore').addEventListener('click',function(){
      var v=$('bkText').value.trim();
      if(!v){$('bkNote').textContent='Paste a backup code into the box first.';return;}

        return;

      if(!twoTap('bkrestore',$('bkRestore'),'Tap again to replace current data'))return;
      /* escape hatch: snapshot what's here now, so even a wrong restore can be undone */
      saveBackup(true,function(){applyRestored(s);},'safety');
    });

  var BKINDEX='dpBackupsV1';

  /* auto: true for the daily/weekly timer, 'safety' for the automatic snapshot

  function saveBackup(withPhotos,cb,auto){
    var st=bkStore(); if(!st){if(!auto)toast('Backups are not available here',1800);cb&&cb();return;}
    var data=JSON.stringify(withPhotos?state:strippedState());
    var id=uid('bk'), ts=nowTs();
    var entry={id:id,ts:ts,photos:!!withPhotos,size:data.length,count:state.paintings.length,auto:auto===true,safety:auto==='safety'};
    listBackups(function(arr){
      arr.unshift(entry);
      var removed=arr.slice(20); arr=arr.slice(0,20);
      st.set('dpBk_'+id,data).then(function(){
        try{localStorage.setItem('dpLastBkTs',String(ts));}catch(_){}
        st.set(BKINDEX,JSON.stringify(arr)).then(function(){
          removed.forEach(function(e){try{st.del('dpBk_'+e.id);}catch(_){}});
          if(!auto)toast('Backup saved ✓',1200); cb&&cb();
        },function(){if(!auto)toast('Could not save backup',1800);cb&&cb();});
      },function(){if(!auto)toast('Could not save backup — storage may be full',2200);cb&&cb();});
    });
  }
  function maybeAutoBackup(cb){
    if(!state.autoBackup||state.autoBackup==='off'){cb&&cb();return;}
    var interval=state.autoBackup==='weekly'?7*86400000:86400000;
    var last=0; try{last=parseInt(localStorage.getItem('dpAutoBkTs')||'0',10)||0;}catch(e){}
    var now=nowTs();
    if(now-last<interval){cb&&cb();return;}
    try{localStorage.setItem('dpAutoBkTs',String(now));}catch(e){}
    saveBackup(false,function(){cb&&cb();},true);
  }
  /* A quiet reminder, not an alarm. Auto-backup is off by default and the cloud
     is optional, so a collection can grow for months with nothing protecting it
     and the app never saying a word. Once a fortnight without any backup (and
     at most once a week), it says one sentence about where the button is. */
  function maybeBackupNudge(){
    if(cloudOn())return;
    var worth=state.paintings.length>1||state.paintings.some(function(p){
      return (p.photos&&p.photos.length)||Object.keys(p.colors||{}).length>0;
    });
    if(!worth)return;
    var now=nowTs(),last=0,nagged=0,day=86400000;
    try{last=parseInt(localStorage.getItem('dpLastBkTs')||'0',10)||0;}catch(e){}
    try{nagged=parseInt(localStorage.getItem('dpBkNudgeTs')||'0',10)||0;}catch(e){}
    if(now-last<14*day)return;
    if(now-nagged<7*day)return;
    try{localStorage.setItem('dpBkNudgeTs',String(now));}catch(e){}
    toast(last
      ? 'It’s been a while since your last backup — “Save a backup now” is on the ⌂ Overview page'
      : 'No backup yet — “Save a backup now” on the ⌂ Overview page keeps your collection safe',5600);
  }
  function deleteBackup(id,cb){
    var st=bkStore(); if(!st){cb&&cb();return;}
    listBackups(function(arr){
      arr=arr.filter(function(e){return e.id!==id;});
      st.set(BKINDEX,JSON.stringify(arr)).then(function(){try{st.del('dpBk_'+id);}catch(_){}cb&&cb();},function(){cb&&cb();});
    });
  }
  /* replace all data with a restored backup: clean up photo keys of paintings
     that no longer exist, re-read stored photos for "no photos" backups, and
     reset the undo history so Ctrl+Z can't mix old and new data */
  function applyRestored(s){
    var oldIds=state.paintings.map(function(p){return p.id;});
    state=normalize(s);
    var keep={}; state.paintings.forEach(function(p){keep[p.id]=1;});
    oldIds.forEach(function(id){if(!keep[id]){deletePhotosKey(id);deletePaintKey(id);}});
    trash=[]; selectedIds={}; resetTransient();
    render(); save();
    state.paintings.forEach(function(p){if(p.photos&&p.photos.length)savePhotos(p.id);});
    reloadMissingPhotos(function(changed){if(changed)render();historyInit();});
    toast('Restored ✓ — '+state.paintings.length+' project'+(state.paintings.length===1?'':'s'),1600);
  }
  function restoreBackup(id,cb){
    var st=bkStore(); if(!st){cb&&cb();return;}
    st.get('dpBk_'+id).then(function(r){
      try{
        var s=JSON.parse(r.value);
        if(!s||!s.paintings||!s.paintings.length)throw new Error('bad');
        s.view='paintings';
        /* escape hatch: snapshot what's here now, so even a wrong restore can be undone */
        saveBackup(true,function(){applyRestored(s);cb&&cb();},'safety');
        return;
      }catch(e){toast('That backup could not be read',2000);}
      cb&&cb();
    },function(){toast('That backup could not be read',2000);cb&&cb();});
  }
  function statsHtml(){

      var rr=ratingOf(p);
      if(rr!==null&&!isNaN(rr)){rsum+=rr;rn++;}
      colors+=Object.keys(p.colors||{}).length;
      /* a price on a wishlist kit is money you might spend, not money you have —

      var pr=parsePrice(p.price);
      if(!isNaN(pr)){if(p.status==='wishlist'){wish+=pr;wishN++;}else{spend+=pr;spendN++;}}

    return '<div class="backup">'+

      '<div class="bk-note" style="margin-top:8px;">'+
        KINDS.map(function(k){return k.sym+' '+k.label+' '+byKind[k.id];}).join(' · ')+
      '</div>'+
      '<div class="bk-note" style="margin-top:4px;">Avg rating '+avg+' · diamond types: ■ '+byType.square+'  ● '+byType.round+'  ✦ '+byType.odd+' · '+colors+' colours selected in total'+(spendN?(' · total spend '+spendStr):'')+(wishN?(' · wishlist would cost '+wish.toFixed(2)):'')+'</div>'+
      '<div class="bk-btns" style="margin-top:10px;"><button class="chipbtn" id="csvExport" type="button" title="One row per project — opens in Excel or Google Sheets">⬇ Export list as CSV (Excel)</button></div>'+
      '</div>';
  }
  /* one row per project, semicolon-separated with a UTF-8 marker, which is what
     Excel in European locales opens straight into columns */
  function csvField(v){
    v=String(v==null?'':v);
    if(/[;"\r\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  function exportCsv(){
    var head=['Name','Kind','Status','Progress %','Rating','Price','Size (cm)','Seller','Kit code','Diamond type','Started','Finished','Tags','Media','Colours','Colour numbers','Notes'];
    var lines=[head.join(';')];
    state.paintings.forEach(function(p){
      var codes=Object.keys(p.colors||{});
      lines.push([
        p.name||'', KINDMAP[kindOf(p)].label,
        (p.status&&STATUSMAP[p.status])?STATUSMAP[p.status].label:'',
        p.progress||0,
        (function(){var r=ratingOf(p);return (r===null||isNaN(r))?'':r;})(),
        p.price||'', p.size||'', p.seller||'', p.code||'',
        (p.type&&TYPES[p.type])?TYPES[p.type].label:'',
        p.started||'', p.finished||'',
        Object.keys(p.tags||{}).join(', '),
        Object.keys(p.media||{}).join(', '),
        codes.length, codes.join(' '),
        p.notes||''
      ].map(csvField).join(';'));
    });
    var bom=String.fromCharCode(0xFEFF);   /* UTF-8 marker so Excel reads accents correctly */
    var blob=new Blob([bom+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='diamond-painting-projects-'+(todayStr()||'today')+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    toast('CSV saved ✓ — opens in Excel or Google Sheets',1800);
  }

  /* ---------- paintings gallery ---------- */
  function photoStyle(photo){
    var fit=photo.fit||'cover';
    var px=(photo.posX==null?50:photo.posX);
    var py=(photo.posY==null?50:photo.posY);
    return 'object-fit:'+fit+';object-position:'+px+'% '+py+'%;'+(photo.flip?'transform:scaleX(-1);':'');
  }
  /* ---------- how a project looks in the list ----------
     Four shapes of the same card. They exist side by side so the choice can be
     made by looking at a real collection rather than by imagining one. */
  var CARD_STYLES=[
    {id:'roomy', label:'Roomy', hint:'Big covers on the right, and the kit’s own colours filling the middle'},
    {id:'tile',  label:'Tiles', hint:'A grid of picture tiles — most projects on screen at once'}
  ];
  function cardStyle(){
    var s=state.cardStyle;
    return CARD_STYLES.some(function(c){return c.id===s;})?s:'roomy';
  }
  /* the colours the kit uses — for a colour tracker this is the project's real
     content, and it is what the wide empty band in the middle was missing */
  function swatchStrip(p,max){
    var hexes=[];
    if(isDiamond(p))Object.keys(p.colors||{}).forEach(function(c){var r=DMCMAP[c];if(r)hexes.push([r[2],c+' '+r[1]]);});
    else if(kindOf(p)==='pbn')(p.palette||[]).forEach(function(en){if(en&&en.color)hexes.push([en.color,en.label||'']);});
    if(!hexes.length)return '';
    var show=hexes.slice(0,max);
    var h=show.map(function(x){return '<span class="mini" style="background-color:'+esc(x[0])+'" title="'+esc(x[1])+'"></span>';}).join('');
    if(hexes.length>show.length)h+='<span class="mini more">+'+(hexes.length-show.length)+'</span>';
    return '<div class="ovswatches">'+h+'</div>';
  }
  /* A bar the width of the whole card, announcing 100% on a project with nothing
     in it, was the loudest thing on the page and said the least. It now appears
     only while a project is genuinely part-done, and takes a badge's worth of room. */
  function progHtml(p){
    var pct=Math.max(0,Math.min(100,p.progress||0));
    var worth=(p.status==='progress')||(pct>0&&pct<100&&p.status!=='done');
    if(!worth)return '';
    return '<span class="ovpct"><span class="ovpct-bar"><i style="width:'+pct+'%"></i></span>'+pct+'%</span>';
  }
  function cardSub(p,short){
    var kd=kindOf(p), sub;
    if(kd==='diamond'){var n=Object.keys(p.colors).length;sub=n+' colour'+(n===1?'':'s');}
    else if(kd==='pbn')sub=(p.palette&&p.palette.length)?(p.palette.length+' colour'+(p.palette.length===1?'':'s')+' picked'):'paint by number';
    else sub=p.photos.length+' photo'+(p.photos.length===1?'':'s');
    var med=Object.keys(p.media||{});
    if(usesMedia(p)&&med.length)sub+=' · '+esc(med.slice(0,3).join(', '))+(med.length>3?(' +'+(med.length-3)):'');
    if(p.size)sub+=' · '+esc(p.size);
    /* a tile is narrow — it gets the two facts that identify a project and stops,
       rather than pushing its own picture off the top of the screen */
    if(short)return sub+(p.finished?(' · ✓ '+esc(p.finished)):'');
    if(p.seller)sub+=' · '+esc(p.seller);
    if(p.code)sub+=' · '+esc(p.code);
    if(p.price)sub+=' · '+esc(p.price);
    if(p.started)sub+=' · ▶ '+esc(p.started);
    if(p.finished)sub+=' · ✓ '+esc(p.finished);
    if(state.ovSort==='edited'&&p.updatedAt)sub+=' · 🕒 '+fmtDate(p.updatedAt);
    return sub;
  }
  /* A card is one target: tapping anywhere on it — the covers included — opens the
     project. Blowing a cover up full-screen from here only ever got in the way of
     the thing you were reaching for, and the project's own page still does it. */
  function cardPhotos(p,n){
    if(!p.photos||!p.photos.length)return '';
    var labels=coverLabels(p);
    var h='<div class="ovphotos frame-'+(p.frame||'landscape')+'">';
    p.photos.slice(0,n).forEach(function(ph,i){
      h+='<div class="ovphoto"><img src="'+thumbSrc(ph)+'" alt="'+esc(p.name)+(labels[i]?(' — '+labels[i]):'')+'" style="'+photoStyle(ph)+'">'+
        (labels[i]?'<span class="ovphoto-lbl">'+labels[i]+'</span>':'')+'</div>';
    });
    return h+'</div>';
  }
  function paintingCardHtml(p){
    var style=cardStyle();
    var fins=finTagsHtml(p);
    var tagKeys=Object.keys(p.tags||{});
    var tagHtml=tagKeys.length?('<div class="ovtags">'+tagKeys.map(function(t){return '<span class="ovtag'+(tagSign(t)===1?' tg-pos':(tagSign(t)===-1?' tg-neg':''))+'">'+esc(t)+'</span>';}).join('')+'</div>'):'';
    var sub=cardSub(p,style==='tile'), prog=progHtml(p);
    var st=p.status&&STATUSMAP[p.status];
    var open='<div class="ovcard st-'+style+(st?' stripe':'')+(selectedIds[p.id]?' picked':'')+'" data-id="'+p.id+'"'+
      ' role="button" tabindex="0" aria-label="'+esc(p.name)+(selectMode?(selectedIds[p.id]?' — ticked':' — not ticked'):'')+'"'+
      (st?' style="--stripe:'+st.fg+'"':'')+'>';
    var selBox=selectMode?('<span class="selbox'+(selectedIds[p.id]?' on':'')+'">'+(selectedIds[p.id]?'✓':'')+'</span>'):'';
    var badges=statusBadge(p)+ratingBadge(p)+(isDiamond(p)?badgeHtml(p.type):kindBadge(p));

    if(style==='tile'){
      return open+
        /* the picture IS the tile, so tapping it opens the project rather than
           blowing the photo up full-screen the way it does on a wide card */
        (p.photos&&p.photos.length?'<div class="tile-pic"><img src="'+thumbSrc(p.photos[0])+'" alt="'+esc(p.name)+'" style="'+photoStyle(p.photos[0])+'">'+
          (selBox?'<span class="tile-sel">'+selBox+'</span>':'')+'</div>'
         :'<div class="tile-pic empty">'+(selBox?'<span class="tile-sel">'+selBox+'</span>':'')+'<span class="tile-none">no photo yet</span></div>')+
        '<div class="tile-body">'+
          '<div class="ovname">'+esc(p.name)+'</div>'+
          '<div class="ovtop tile-badges">'+badges+prog+'</div>'+
          '<div class="ovsub">'+sub+'</div>'+
          swatchStrip(p,10)+
        '</div></div>';
    }
    /* roomy */
    return open+
      '<div class="ovtop">'+selBox+'<span class="ovname">'+esc(p.name)+'</span>'+badges+'</div>'+
      '<div class="ovbody">'+
        '<div class="ovinfo">'+
          '<div class="ovsub">'+sub+'</div>'+
          (fins?'<div class="ovfins">'+fins+'</div>':'')+
          tagHtml+
          (prog?'<div class="ovprogrow">'+prog+'</div>':'')+
          swatchStrip(p,30)+
        '</div>'+
        cardPhotos(p,2)+
      '</div>'+
      '</div>';
  }
  function filteredPaintings(){
    var q=(pQuery||'').trim().toLowerCase();
    var f=state.pSearchField||'all';
    var list=state.paintings.slice();
    if(state.pKind&&state.pKind!=='all')list=list.filter(function(p){return kindOf(p)===state.pKind;});
    if(q){
      list=list.filter(function(p){
        if(f==='name')   return (p.name||'').toLowerCase().indexOf(q)!==-1;
        if(f==='diamond')return Object.keys(p.colors||{}).some(function(c){return c.toLowerCase().indexOf(q)!==-1;});
        if(f==='seller') return (p.seller||'').toLowerCase().indexOf(q)!==-1;
        if(f==='code')   return (p.code||'').toLowerCase().indexOf(q)!==-1;
        if(f==='tag')    return Object.keys(p.tags||{}).some(function(t){return t.toLowerCase().indexOf(q)!==-1;});
        if(f==='media')  return Object.keys(p.media||{}).some(function(t){return t.toLowerCase().indexOf(q)!==-1;});
        var st=(p.status&&STATUSMAP[p.status])?STATUSMAP[p.status].label:'';
        var hay=(p.name||'')+' '+(p.seller||'')+' '+(p.code||'')+' '+(p.size||'')+' '+st+' '+KINDMAP[kindOf(p)].label+' '+
          Object.keys(p.tags||{}).join(' ')+' '+Object.keys(p.media||{}).join(' ')+' '+Object.keys(p.colors||{}).join(' ');
        return hay.toLowerCase().indexOf(q)!==-1;
      });
    }
    if(state.ovSort==='rating'){
      list.sort(function(a,b){
        var ra=ratingOf(a); ra=(ra===null||isNaN(ra))?-1:ra;
        var rb=ratingOf(b); rb=(rb===null||isNaN(rb))?-1:rb;
        return rb-ra;
      });
    } else if(state.ovSort==='edited'){
      list.sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0);});
    } else if(state.ovSort==='name'){
      list.sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
    } else if(state.ovSort==='price'){
      var pn=function(p){var n=parsePrice(p.price);return isNaN(n)?-1:n;};
      list.sort(function(a,b){return pn(b)-pn(a);});
    }
    return list;
  }
  /* tiles need a grid to sit in; the other three stack down the page */
  function listClass(){return cardStyle()==='tile'?'ovgrid':'ovlist';}
  function groupChip(id,label){return '<button class="chipbtn'+(state.pGroup===id?' on':'')+'" data-g="'+id+'" type="button">'+label+'</button>';}
  function groupedHtml(list){
    var groups=[];
    if(state.pGroup==='kind'){
      KINDS.forEach(function(k){
        var items=list.filter(function(p){return kindOf(p)===k.id;});
        if(items.length)groups.push({label:k.sym+' '+k.label,items:items});
      });
    } else if(state.pGroup==='type'){
      [['square','■ Square'],['round','● Round'],['odd','✦ Odd'],[null,'Type not set']].forEach(function(t){
        var items=list.filter(function(p){return (p.type||null)===t[0];});
        if(items.length)groups.push({label:t[1],items:items});
      });
    } else if(state.pGroup==='size'){
      var seen={};
      state.sizes.forEach(function(sz){
        var items=list.filter(function(p){return p.size===sz;});
        if(items.length){groups.push({label:esc(sz),items:items});seen[sz]=1;}
      });
      var extras={};
      list.forEach(function(p){if(p.size&&!seen[p.size])extras[p.size]=1;});
      Object.keys(extras).forEach(function(sz){
        groups.push({label:esc(sz),items:list.filter(function(p){return p.size===sz;})});
      });
      var noSize=list.filter(function(p){return !p.size;});
      if(noSize.length)groups.push({label:'No size set',items:noSize});
    } else if(state.pGroup==='seller'){
      var seenS={};
      state.sellers.forEach(function(s){
        var items=list.filter(function(p){return p.seller===s;});
        if(items.length){groups.push({label:esc(s),items:items});seenS[s]=1;}
      });
      var extraS={};
      list.forEach(function(p){if(p.seller&&!seenS[p.seller])extraS[p.seller]=1;});
      Object.keys(extraS).forEach(function(s){groups.push({label:esc(s),items:list.filter(function(p){return p.seller===s;})});});
      var noSel=list.filter(function(p){return !p.seller;});
      if(noSel.length)groups.push({label:'No seller',items:noSel});
    } else if(state.pGroup==='status'){
      STATUSES.forEach(function(s){
        var items=list.filter(function(p){return p.status===s.id;});
        if(items.length)groups.push({label:s.label,items:items});
      });
      var noSt=list.filter(function(p){return !p.status;});
      if(noSt.length)groups.push({label:'No status',items:noSt});
    } else if(state.pGroup==='finish'){
      FINISHES.forEach(function(f){
        var items=list.filter(function(p){return p.finishes&&p.finishes[f.id];});
        if(items.length)groups.push({label:esc(f.label),items:items});
      });
      var noFin=list.filter(function(p){return !p.finishes||!Object.keys(p.finishes).length;});
      if(noFin.length)groups.push({label:'No special diamonds',items:noFin});
    }
    var out='';
    groups.forEach(function(g){
      var collapsed=!!collapsedGroups[g.label];
      out+='<div class="section-lbl grp-hd" data-grp="'+encodeURIComponent(g.label)+'" role="button" tabindex="0" aria-expanded="'+(collapsed?'false':'true')+'" style="cursor:pointer;user-select:none;">'+(collapsed?'▸':'▾')+' '+g.label+' <span style="color:var(--muted);font-weight:700;">'+g.items.length+'</span></div>';
      if(!collapsed)out+='<div class="'+listClass()+'">'+g.items.map(paintingCardHtml).join('')+'</div>';
    });
    return out;
  }
  function paintingsListHtml(){

  /* ---------- share a project as one picture ----------
     The groups this hobby lives in (Facebook, Reddit, family chats) take
     pictures, not app screens. This draws the project — its covers, name,
     badges and the kit's own colours — onto one canvas sized for a feed, then
     hands it to the phone's share sheet, or saves it where sharing files isn't
     a thing. Always drawn in the light palette: a share lands on strangers'
     screens, not in your theme. */
  var SHARE_W=1080, SH_PAD=48, SH_FONT='-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  function rrPath(ctx,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  /* cover-crop like the cards do, honouring the photo's own pan and flip */
  function drawCover(ctx,img,dx,dy,dw,dh,ph){
    var iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
    if(!iw||!ih)return;
    var k=Math.max(dw/iw,dh/ih);
    var sw=dw/k, sh=dh/k;
    var px=(ph.posX==null?50:ph.posX)/100, py=(ph.posY==null?50:ph.posY)/100;
    var sx=(iw-sw)*px, sy=(ih-sh)*py;
    ctx.save();
    rrPath(ctx,dx,dy,dw,dh,20); ctx.clip();
    if(ph.flip){ctx.translate(dx+dw,dy);ctx.scale(-1,1);ctx.drawImage(img,sx,sy,sw,sh,0,0,dw,dh);}
    else ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);
    ctx.restore();
  }
  function drawPill(ctx,x,y,text,bg,fg,font){
    ctx.font=font;
    var w=Math.ceil(ctx.measureText(text).width)+36, h=48;
    rrPath(ctx,x,y,w,h,24);
    ctx.fillStyle=bg; ctx.fill();
    ctx.fillStyle=fg; ctx.textBaseline='middle';
    ctx.fillText(text,x+18,y+h/2+2);
    return w;
  }
  function buildShareCard(p,cb){
    var photos=(p.photos||[]).slice(0,2);
    var imgs=new Array(photos.length);
    var pend=photos.length;
    function done(){
      var cv=null;
      try{cv=drawShareCard(p,photos,imgs);}catch(e){cv=null;}
      cb(cv);
    }
    if(!pend){done();return;}
    photos.forEach(function(ph,i){
      loadImg(ph.d,function(img){imgs[i]=img;if(--pend===0)done();});
    });
  }
  function drawShareCard(p,photos,imgs){
    var lbls=coverLabels(p);
    var acc=(ACCENTMAP[state.accent]||ACCENTMAP.violet).accent;
    /* measure the name first — the canvas can't be sized until the lines are known */
    var mc=document.createElement('canvas').getContext('2d');
    var nameFont='800 60px '+SH_FONT;
    mc.font=nameFont;
    var maxW=SHARE_W-2*SH_PAD;
    var words=String(p.name||'Project').split(/\s+/), lines=[], cur='';
    words.forEach(function(w){
      var t=cur?cur+' '+w:w;
      if(mc.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}
      else cur=t;
    });
    if(cur)lines.push(cur);
    if(lines.length>2){lines=lines.slice(0,2);lines[1]+='…';}
    var n=imgs.filter(Boolean).length, single=(n===1);
    var photoH=n?(single?738:480):0;
    var yName=SH_PAD+(n?photoH+44:12);
    var yBadge=yName+lines.length*72+16;
    var hexes=[];
    if(isDiamond(p))Object.keys(p.colors||{}).forEach(function(c){var r=DMCMAP[c];if(r)hexes.push(r[2]);});
    else if(kindOf(p)==='pbn')(p.palette||[]).forEach(function(en){if(en&&en.color&&!/["'<>()\\\s]/.test(en.color))hexes.push(en.color);});
    var ySw=yBadge+48+(hexes.length?26:0);
    var yFoot=ySw+(hexes.length?34:0)+34;
    var cv=document.createElement('canvas');
    cv.width=SHARE_W; cv.height=Math.round(yFoot+34+SH_PAD/2);
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#F6F4FA'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle=acc; ctx.fillRect(0,0,cv.width,10);
    var drawn=0;
    photos.forEach(function(ph,i){
      var img=imgs[i]; if(!img)return;
      var w=single?(SHARE_W-2*SH_PAD):480;
      var h=photoH;
      var x=SH_PAD+(single?0:drawn*(480+24));
      drawCover(ctx,img,x,SH_PAD+14,w,h,ph);
      if(lbls[i]&&n>1){
        ctx.font='800 26px '+SH_FONT;
        var tw=ctx.measureText(lbls[i]).width;
        rrPath(ctx,x+16,SH_PAD+30,tw+28,42,21);
        ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fill();
        ctx.fillStyle='#fff'; ctx.textBaseline='middle';
        ctx.fillText(lbls[i],x+30,SH_PAD+30+23);
      }
      drawn++;
    });
    ctx.fillStyle='#26222E'; ctx.font=nameFont; ctx.textBaseline='alphabetic';
    lines.forEach(function(ln,i){ctx.fillText(ln,SH_PAD,yName+58+i*72);});
    var bx=SH_PAD, bfont='700 30px '+SH_FONT;
    function pill(text,bg,fg){
      ctx.font=bfont;
      var w=Math.ceil(ctx.measureText(text).width)+36;
      if(bx+w>SHARE_W-SH_PAD)return;   /* a pill that doesn't fit is left off, not squeezed */
      drawPill(ctx,bx,yBadge,text,bg,fg,bfont); bx+=w+14;
    }
    var st=p.status&&STATUSMAP[p.status];
    if(st)pill(st.label,st.fg,'#fff');
    var r=ratingOf(p);
    if(r!==null&&!isNaN(r))pill('★ '+Number(r).toFixed(1),'#F8EFDC','#8a6a1f');
    if(isDiamond(p)){
      if(p.type&&TYPES[p.type])pill(TYPES[p.type].sym+' '+TYPES[p.type].label,'#EEEDF1','#26222E');
      var nc=Object.keys(p.colors||{}).length;
      if(nc)pill(nc+' colour'+(nc===1?'':'s'),'#EFEAFB',acc);
    } else pill(KINDMAP[kindOf(p)].label,'#EEEDF1','#26222E');
    if(p.size)pill(p.size+' cm','#EEEDF1','#26222E');
    var pct=Math.max(0,Math.min(100,p.progress||0));
    if(pct>0&&pct<100&&p.status!=='done')pill(pct+'% done','#E6F6EE','#20714a');
    if(hexes.length){
      var shown=hexes.slice(0,26);
      shown.forEach(function(hx,i){
        rrPath(ctx,SH_PAD+i*38,ySw,32,32,8);
        ctx.fillStyle=hx; ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.lineWidth=1; ctx.stroke();
      });
      if(hexes.length>shown.length){
        ctx.fillStyle='#7A7486'; ctx.font='700 24px '+SH_FONT; ctx.textBaseline='middle';
        ctx.fillText('+'+(hexes.length-shown.length),SH_PAD+shown.length*38+6,ySw+17);
      }
    }
    ctx.fillStyle='#7A7486'; ctx.font='600 24px '+SH_FONT; ctx.textBaseline='alphabetic';
    var foot=p.finished?('Finished '+p.finished):(p.started?('Started '+p.started):'');
    ctx.fillText((foot?foot+'  ·  ':'')+'Diamond Painting Colors',SH_PAD,yFoot+24);
    return cv;
  }
  function shareFileName(p){
    return (String(p.name||'project').replace(/[^\wÀ-ɏ-]+/g,'-').replace(/^-+|-+$/g,'')||'project')+'.jpg';
  }
  function openShareCard(p){
    buildShareCard(p,function(cv){
      if(!cv){toast('Could not draw the picture on this device',2400);return;}
      var d;

      var canShare=false;

      }catch(e){canShare=false;}
      var ov=document.createElement('div'); ov.className='lightbox';
      ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');

      var wasFocused=document.activeElement;

      note.textContent=canShare

      var bar=document.createElement('div'); bar.className='bk-btns'; bar.style.marginTop='10px';
      function mkBtn(label,primary){

        if(primary)b.style.cssText='background:var(--accent);border-color:var(--accent);color:#fff;';
        bar.appendChild(b); return b;

      var shareB=canShare?mkBtn('📤 Share',true):null;

      panel.appendChild(im); panel.appendChild(note); panel.appendChild(bar);
      ov.appendChild(panel);
      function destroy(){
        ov.remove();document.removeEventListener('keydown',onKey);document.body.style.overflow='';
        try{if(wasFocused&&wasFocused.focus)wasFocused.focus();}catch(e){}
      }
      function onKey(e){if(e.key==='Escape')destroy();}
      ov._destroy=destroy;
      ov.addEventListener('click',function(e){if(e.target===ov)destroy();});
      closeB.addEventListener('click',destroy);
      if(shareB)shareB.addEventListener('click',function(){
        /* a cancelled share sheet rejects — that's a choice, not an error */
        navigator.share({files:[file],title:p.name||'My project'}).catch(function(){});
      });
      saveB.addEventListener('click',function(){
        var a=document.createElement('a');
        a.href=d; a.download=shareFileName(p);
        document.body.appendChild(a); a.click(); a.remove();
        toast('Picture saved — check your Downloads ✓',1800);
      });
      document.addEventListener('keydown',onKey);
      document.body.style.overflow='hidden';
      document.body.appendChild(ov);
      try{ov.focus();}catch(e){}
    });
  }

  /* Side by side, full screen. Tapping a picture has always blown up ONE of them,
     which is no use for the question these two pictures exist to answer: does
     mine look like the one the seller photographed. Whole pictures, not the
     cropped-to-card versions — only a mirrored photo keeps its flip. */
  function openCompare(p){
    var photos=(p.photos||[]).slice(0,2);
    if(photos.length<2){toast('This project needs a second photo to compare',1800);return;}
    var lbls=coverLabels(p);
    var labels=[lbls[0]||'Photo 1',lbls[1]||'Photo 2'];
    /* a narrow screen puts them one above the other, where each still gets the
       full width; side by side on a phone leaves two slivers */
    var stacked=(screenW()/(fontScale()/100))<560;
    var solo=-1;
    var ov=document.createElement('div');
    ov.className='lightbox cmp';
    ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
    ov.setAttribute('aria-label','Compare the two pictures'); ov.tabIndex=-1;
    var wasFocused=document.activeElement;
    function draw(){
      ov.innerHTML='<div class="cmp-bar">'+
          '<button class="cmp-btn" data-a="flip" type="button">'+(stacked?'⇔ Side by side':'⇕ One above the other')+'</button>'+
          '<button class="cmp-btn" data-a="close" type="button">✕ Close</button>'+
        '</div>'+
        '<div class="cmp-body'+(stacked?' stack':'')+(solo>=0?' has-solo':'')+'">'+
          photos.map(function(ph,i){
            return '<figure class="cmp-fig'+(solo===i?' solo':'')+'" data-i="'+i+'">'+
              '<img src="'+ph.d+'" alt="'+esc(labels[i])+'"'+(ph.flip?' style="transform:scaleX(-1)"':'')+'>'+
              '<figcaption class="cmp-lbl">'+esc(labels[i])+'</figcaption></figure>';
          }).join('')+
        '</div>'+
        '<div class="cmp-hint">'+(solo>=0?'Tap the picture to bring the other one back':'Tap a picture to see it on its own')+'</div>';
    }
    function destroy(){
      ov.remove();document.removeEventListener('keydown',onKey);document.body.style.overflow='';
      try{if(wasFocused&&wasFocused.focus)wasFocused.focus();}catch(e){}
    }
    function onKey(e){if(e.key==='Escape')destroy();}
    ov._destroy=destroy; /* so Back closes it, like the single-photo view */
    ov.addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('[data-a]'):null;
      if(b){
        if(b.getAttribute('data-a')==='close'){destroy();return;}
        stacked=!stacked; solo=-1; draw(); return;
      }
      var fig=e.target.closest?e.target.closest('.cmp-fig'):null;
      if(fig){solo=(solo>=0)?-1:parseInt(fig.getAttribute('data-i'),10);draw();return;}
      destroy(); /* the dark surround closes, as it always has */
    });
    document.addEventListener('keydown',onKey);
    document.body.style.overflow='hidden';
    draw();
    document.body.appendChild(ov);
    try{ov.focus();}catch(e){}
  }

  function afterAuth(){

    apiCall('GET','kv?select=k',null).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(function(rows){
      if(rows&&rows.length){ syncPhase='choose'; renderOverview(); }
      else { markSynced(); cloudPushAll(function(){renderOverview();toast('Signed in — this device is now synced ✓',1800);startSyncLoop();}); }

  function fmtBytes(n){
    if(n<1024)return n+' B';
    if(n<1024*1024)return (n/1024).toFixed(n<10240?1:0)+' KB';
    return (n/1048576).toFixed(2)+' MB';
  }
  function meterRow(label,used,cap){
    var pct=cap?Math.min(100,Math.round(used/cap*100)):0;
    var col=pct>=90?'#A8324B':(pct>=70?'#B98A2F':'var(--accent)');
    return '<div class="sm-row"><div class="sm-lbl"><span>'+label+'</span><span>'+fmtBytes(used)+
      (cap?' of '+fmtBytes(cap):'')+'</span></div>'+
      (cap?'<div class="sm-bar"><div class="sm-fill" style="width:'+pct+'%;background:'+col+'"></div></div>':'')+
      '</div>';
  }
  function renderStorageMeter(){
    var el=$('storMeter'); if(!el)return;
    var SLOT=5*1024*1024;
    var mainSize=JSON.stringify(strippedState()).length;
    var kind=STORE?STORE.kind:'none';
    var html='';
    if(kind==='idb'){
      var totalPhotos=0, rows='';
      state.paintings.forEach(function(p){
        if(!p.photos||!p.photos.length)return;
        var sz=JSON.stringify(p.photos).length; totalPhotos+=sz;
        rows+=meterRow(esc(p.name)+' — '+p.photos.length+' photo'+(p.photos.length===1?'':'s'),sz,0);
      });
      html+=meterRow('Lists &amp; settings',mainSize,0)+rows;
      html+='<div class="bk-note" id="quotaNote">Stored in this browser’s database — usually hundreds of MB available.</div>';
    } else if(kind==='ls'){
      var total=mainSize;
      state.paintings.forEach(function(p){if(p.photos&&p.photos.length)total+=JSON.stringify(p.photos).length;});
      html+=meterRow('Everything (shared browser storage)',total,SLOT);
      html+='<div class="bk-note">This browser only offers simple storage (~5 MB shared). Chrome, Edge or Firefox will give far more room.</div>';
    } else {
      html+='<div class="bk-note">Saving is unavailable here — use Backup below so nothing is lost.</div>';
    }
    html+='<div id="storBreak"></div>';
    el.innerHTML=html;
    renderStorageBreakdown();
    if(kind==='idb'&&navigator.storage&&navigator.storage.estimate){
      navigator.storage.estimate().then(function(est){
        var qn=$('quotaNote');
        if(qn&&est&&est.quota){
          qn.textContent='This browser gives the app about '+fmtBytes(est.quota)+' — '+
            fmtBytes(est.usage||0)+' in use. Plenty of room.'+
            (persisted===true
              ? ' The browser has agreed to keep this data through storage clean-ups ✓'
              : ' The browser has not promised to keep this data through storage clean-ups — a backup or cloud sync is your safety net.');
        }
      }).catch(function(){});
    }
  }

  /* ---------- what's using the space ----------
     Two questions, answered in the order they're worth asking. "Photos or
     words?" has a permanent answer — a single picture outweighs every word
     you will ever type — so it gets one line. "WHICH project, and which
     picture inside it?" is the one that can be acted on, so it gets the list.
     Worked out when the panel is opened: on a 40-project, 6.6 MB library it
     takes about 12 milliseconds, which is not worth a button to start it. */
  var storOpen=false, storSel=null, storMsg='';
  /* well clear of what a photo kept at the app's own size weighs (~240 KB), so
     "larger than it needs to be" means it, rather than nagging about every
     good photo */
  var BIG_PHOTO=700*1024;
  function photoBytes(ph){return ph?(((ph.d&&ph.d.length)||0)+((ph.t&&ph.t.length)||0)):0;}
  function storageRows(){
    var rows=state.paintings.map(function(p){
      var photos=(p.photos||[]).reduce(function(s,ph){return s+photoBytes(ph);},0);
      var whole=JSON.stringify(p).length;
      return {id:p.id,name:p.name,photos:photos,text:Math.max(0,whole-photos),total:whole,n:(p.photos||[]).length};
    });
    rows.sort(function(a,b){return b.total-a.total;});
    return rows;
  }
  function photoLabel(p,i){
    var ph=p.photos&&p.photos[i];
    if(ph&&ph.c)return ph.c;   /* a caption the user wrote beats a generic name */
    var l=coverLabels(p);
    return l[i]||('Photo '+(i+1));
  }
  function renderStorageBreakdown(){
    var el=$('storBreak'); if(!el)return;
    var head='<div class="section-lbl fsec-hd" id="storHd" role="button" tabindex="0" aria-expanded="'+(storOpen?'true':'false')+'" style="margin:10px 0 4px;">'+
      (storOpen?'▾':'▸')+' What’s using the space</div>';
    if(!storOpen){
      el.innerHTML=head+'<div class="bk-note" style="opacity:.7">Build '+esc(window.APP_VERSION||'unknown')+'</div>';
      wireStorageBreakdown(); return;
    }
    var rows=storageRows();
    var photos=0,text=0,pn=0,big=0;
    rows.forEach(function(r){photos+=r.photos;text+=r.text;pn+=r.n;});
    state.paintings.forEach(function(p){(p.photos||[]).forEach(function(ph){if(photoBytes(ph)>BIG_PHOTO)big++;});});
    var top=rows.length?rows[0].total:0;
    var h=head+
      '<div class="bk-note"><b>'+fmtBytes(photos)+'</b> in '+pn+' picture'+(pn===1?'':'s')+
        ', and <b>'+fmtBytes(text)+'</b> in everything else — names, colours, tags, notes, the lot'+
        (photos+text?(' ('+Math.max(0.1,text/(photos+text)*100).toFixed(1)+'% of it)'):'')+'.</div>';
    h+='<div class="stlist">';
    rows.forEach(function(r){
      var pct=top?Math.round(r.total/top*100):0;
      h+='<div class="strow'+(storSel===r.id?' open':'')+'" data-stp="'+esc(r.id)+'" role="button" tabindex="0" aria-expanded="'+(storSel===r.id?'true':'false')+'">'+
        '<span class="strow-n">'+(storSel===r.id?'▾':'▸')+' '+esc(r.name)+'</span>'+
        '<span class="strow-bar"><i style="width:'+pct+'%"></i></span>'+
        '<span class="strow-s">'+fmtBytes(r.total)+'</span></div>';
      if(storSel===r.id){
        var p=findPainting(r.id);
        h+='<div class="stphotos">';
        if(!p||!p.photos||!p.photos.length)h+='<div class="bk-note">No pictures — this one is only words.</div>';
        else p.photos.forEach(function(ph,i){
          var b=photoBytes(ph);
          h+='<div class="stphoto">'+
            '<img src="'+thumbSrc(ph)+'" alt="'+esc(photoLabel(p,i))+'">'+
            '<span class="stphoto-t"><b>'+esc(photoLabel(p,i))+'</b><br>'+fmtBytes(b)+(ph.ts?(' · added '+fmtDate(ph.ts)):'')+'</span>'+
            '<button class="pbtn" data-stopen="'+esc(r.id)+'|'+i+'" type="button">Open</button>'+
            (b>BIG_PHOTO?'<button class="pbtn" data-stshrink="'+esc(r.id)+'|'+i+'" type="button">↓ Make smaller</button>':'')+
            '</div>';
        });
        h+='</div>';
      }
    });
    h+='</div>';
    if(storMsg)h+='<div class="bk-note" style="color:var(--rd);font-weight:700;">'+esc(storMsg)+'</div>';
    h+='<div class="bk-note">'+(big
      ? ('<b>'+big+'</b> picture'+(big===1?' is':'s are')+' larger than this app ever needs — “↓ Make smaller” redraws one at the size the app itself uses. It cannot be undone, so it asks twice.')
      : 'No picture here is bigger than it needs to be. Photos are shrunk as they are added, so this stays true unless one arrives from an older backup.')+'</div>';
    h+='<div class="bk-note" style="opacity:.7">Build '+esc(window.APP_VERSION||'unknown')+'</div>';
    el.innerHTML=h;
    wireStorageBreakdown();
  }
  function wireStorageBreakdown(){
    var el=$('storBreak'); if(!el)return;
    if($('storHd'))$('storHd').addEventListener('click',function(){storOpen=!storOpen;renderStorageBreakdown();});
    el.querySelectorAll('[data-stp]').forEach(function(r){

  function shrinkPhoto(pid,i,btn){
    var p=findPainting(pid); if(!p||!p.photos)return;
    var ph=p.photos[i]; if(!ph||!ph.d)return;
    if(!twoTap('shrink'+pid+i,btn,'Tap again — this can’t be undone'))return;
    var before=ph.d.length;
    var blob=dataUrlToBlob(ph.d);
    if(!blob){toast('That picture couldn’t be read, so nothing was changed',2400);return;}
    /* the same road every added photo takes, with the same refusal to save a
       blank — so the worst case is that nothing happens */
    importImage(blob,PHOTO_MAX,PHOTO_Q,function(d){
      if(!d){toast('That picture couldn’t be redrawn on this device — it is unchanged',3000);return;}
      if(d.length>=before){toast('That one is already as small as it goes',2200);return;}
      ph.d=d; refreshThumb(ph,pid); savePhotos(pid); save();
      /* the saving goes on the panel, not in a toast: saving the file pops its
         own "Saved ✓" a moment later and would wipe the numbers off the screen */
      storMsg='“'+p.name+'” · '+photoLabel(p,i)+': '+fmtBytes(before)+' → '+fmtBytes(d.length)+
        ' — '+Math.round((1-d.length/before)*100)+'% smaller ✓';
      renderStorageMeter();
    });
  }

  /* ---------- photos ----------
     Phones fail at this in ways a PC never does. A big screenshot or camera photo
     can load far enough for its width and height to be known and still draw
     NOTHING onto a canvas — and a canvas that was never drawn on is transparent,
     which turns into solid BLACK the instant it is saved as a JPEG. That is the
     whole "my photo is just black" bug. So: decode through createImageBitmap
     where it exists (it copes with sizes the <img> route cannot), shrink in
     halving steps rather than one huge leap, check the result actually has
     something in it, and never save a blank. */
  /* How big a photo is kept. 520 was chosen when running out of room was the
     thing to fear; measured, that fear was misplaced — this browser offers the
     app gigabytes and a whole collection was using a few megabytes, while a
     phone screen is around 750 dots across, so a 520-wide photo was being
     stretched to fill it and the Compare view was showing the soft copy. At
     1200 the same test picture goes from 52 KB to 236 KB: four times the weight
     of a fraction of a percent of the room. Photos already saved keep the detail
     they were saved with — this only changes what happens from now on. */
  var PHOTO_MAX=1200, PHOTO_Q=0.80;
  /* ---- card thumbnails ----
     The list pages show covers at around 100–200 CSS pixels, but they were
     given the full 1200-wide photo to do it — forty projects meant tens of MB
     of decoded image being re-parsed on every filter tap, which is exactly what
     makes an older phone stutter. Each photo now carries a small copy (~15 KB)
     for the places that only need a glance; the full photo is still what opens
     in the lightbox, Compare, and the project page's big covers. */
  var THUMB_MAX=360, THUMB_Q=0.72, THUMB_WORTH=60*1024;
  function thumbSrc(ph){return (ph&&ph.t)||(ph&&ph.d)||'';}
  function makeThumb(d,cb){
    if(!d||d.length<THUMB_WORTH){cb('');return;}
    loadImg(d,function(img){
      if(!img){cb('');return;}
      var w=img.naturalWidth||img.width||0,h=img.naturalHeight||img.height||0;
      if(!w||!h||(w<=THUMB_MAX&&h<=THUMB_MAX)){cb('');return;}
      var cv=scaleTransparent(img,w,h,THUMB_MAX);
      if(canvasBlank(cv)){cb('');return;}
      var t=flattenToJpeg(cv,THUMB_Q);
      /* a thumbnail that isn't clearly smaller isn't earning its keep */
      cb(t.length<d.length*0.7?t:'');
    });
  }
  /* the photo just changed (crop, cut-out, shrink, undo) — its small copy is
     now a picture of the past, so it is redone from the new original */
  function refreshThumb(photo,pid,cb){
    delete photo.t;
    makeThumb(photo.d,function(t){
      if(t){photo.t=t;if(pid)savePhotos(pid);}
      cb&&cb();
    });
  }
  /* photos saved before thumbnails existed get theirs made once, quietly, a
     breath apart so an old phone never notices it happening */
  function migrateThumbs(){
    var queue=[];
    state.paintings.forEach(function(p){
      (p.photos||[]).forEach(function(ph){
        if(ph&&ph.d&&!ph.t&&ph.d.length>THUMB_WORTH)queue.push({pid:p.id,ph:ph});
      });
    });
    if(!queue.length)return;
    var i=0;
    function step(){
      if(i>=queue.length)return;
      var it=queue[i++];
      makeThumb(it.ph.d,function(t){
        if(t){it.ph.t=t;savePhotos(it.pid);}
        setTimeout(step,120);
      });
    }
    step();
  }
  var photoDiag=[];
  function noteDiag(rec){rec.when=nowTs();photoDiag.unshift(rec);if(photoDiag.length>8)photoDiag.pop();}
  /* A timeline that outlives the page. The detailed records above live in memory
     only, so if the phone throws the page away while the photo picker is open —
     which looks exactly like "nothing happened" — they vanish with it and the
     report comes back empty. These few lines are written to disk as each step
     happens, so a picked photo that never arrives still leaves its footprints,

  /* ---------- arrange-mode helpers ---------- */
  /* ax, ay and aw are ALL percentages of the page width, so an arrangement made
     on the PC keeps its shape on a phone: the whole composition scales together
     instead of the vertical offsets staying at a fixed pixel distance (which put
     photos over completely different content on a taller, narrower screen). */
  function arrLayout(photo,i,hostW,below){
    var W=hostW||360;
    /* `below` places new free photos under the view-mode stage instead of on top of it */
    var defY=below?(46+Math.floor(i/3)*24):((16+Math.floor(i/3)*150)/W*100);
    if(photo.aunit!=='w'){
      if(photo.ay==null)photo.ay=defY;
      else if(photo.aunit==='px')photo.ay=photo.ay/W*100;      /* px from the top */
      else photo.ay=(photo.ay/100*420)/W*100;                  /* very old in-box % */
      photo.aunit='w';
    }
    if(photo.ax==null)photo.ax=4+(i%3)*31;
    if(photo.ay==null)photo.ay=defY;
    if(photo.aw==null)photo.aw=28;
    if(photo.arot==null)photo.arot=0;
    return photo;
  }
  /* trim/knock out a plain background: flood-fill inwards from the edges, then crop to what's left */
  function cutOutBackground(photo,cb){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      if(!w||!h){cb(false);return;}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      var ctx=cv.getContext('2d');ctx.drawImage(img,0,0);
      var data;try{data=ctx.getImageData(0,0,w,h);}catch(e){cb(false);return;}
      var d=data.data,n=w*h;
      function at(x,y){var i=(y*w+x)*4;return [d[i],d[i+1],d[i+2]];}
      var cs=[at(0,0),at(w-1,0),at(0,h-1),at(w-1,h-1)],bg=[0,0,0];
      cs.forEach(function(c){bg[0]+=c[0];bg[1]+=c[1];bg[2]+=c[2];});
      bg=[bg[0]/4,bg[1]/4,bg[2]/4];
      var tol=62, seen=new Uint8Array(n), stack=[];
      function near(i){var r=d[i*4]-bg[0],g=d[i*4+1]-bg[1],b=d[i*4+2]-bg[2];return (r*r+g*g+b*b)<tol*tol;}
      for(var x=0;x<w;x++){stack.push(x);stack.push((h-1)*w+x);}
      for(var y=0;y<h;y++){stack.push(y*w);stack.push(y*w+w-1);}
      while(stack.length){
        var i=stack.pop();
        if(i<0||i>=n||seen[i])continue;
        if(!near(i))continue;
        seen[i]=1; d[i*4+3]=0;
        var xx=i%w, yy=(i-xx)/w;
        if(xx>0)stack.push(i-1);
        if(xx<w-1)stack.push(i+1);
        if(yy>0)stack.push(i-w);
        if(yy<h-1)stack.push(i+w);
      }
      var minX=w,minY=h,maxX=-1,maxY=-1;
      for(var j=0;j<n;j++){
        if(d[j*4+3]>10){var jx=j%w,jy=(j-jx)/w;
          if(jx<minX)minX=jx; if(jx>maxX)maxX=jx;
          if(jy<minY)minY=jy; if(jy>maxY)maxY=jy;}
      }
      if(maxX<0){cb(false);return;}
      ctx.putImageData(data,0,0);
      var cw=maxX-minX+1, chh=maxY-minY+1;
      var out=document.createElement('canvas');out.width=cw;out.height=chh;
      out.getContext('2d').drawImage(cv,minX,minY,cw,chh,0,0,cw,chh);
      photo.d=out.toDataURL('image/png');
      cb(true);
    };
    img.onerror=function(){cb(false);};
    img.src=photo.d;
  }

    var bar=document.createElement('div'); bar.style.cssText='display:flex;gap:8px;';

      var l=Math.min(sx,ex),t=Math.min(sy,ey),ww=Math.abs(ex-sx),hh=Math.abs(ey-sy);
      box.style.left=l+'px';box.style.top=t+'px';box.style.width=ww+'px';box.style.height=hh+'px';
    }

      var img2=new Image();

        var cv=document.createElement('canvas');

    });
  }

  /* The page has to be long enough to hold the photos AND to scroll clear of the
     tools bar. It was neither: the page's length was measured once when the
     layer was built, so a photo dragged down or made bigger grew past the end of
     the page and there was nothing left to scroll — it stayed pinned under the
     bar. And the room left for the bar was a fixed 210px guess, while the bar's
     real height depends on how the buttons wrap and how big your text is. */
  function fitArrLayer(){
    var layer=document.getElementById('arrLayer'); if(!layer)return;
    var host=layer.parentElement, pg=$('page');
    /* measure the page without the layer in it — an absolutely-placed layer
       counts towards its parent's height, so measuring with it would make each
       pass a little taller than the last, forever */
    layer.style.height='0px';
    var base=Math.max(host.scrollHeight,400);
    var lowest=0;
    layer.querySelectorAll('.arr-img').forEach(function(im){
      lowest=Math.max(lowest,im.offsetTop+im.offsetHeight);
    });
    /* Two different bottoms need clearing, and padding on the page only fixes one
       of them. The page's own padding holds the content clear of the bar — but a
       floating photo is positioned absolutely, so it lives outside the page's box
       entirely and the padding is nowhere near it. What extends the scrollable
       area past a photo is this layer's own height, so the room for the bar is
       added HERE, below the lowest photo. */
    var z=appZoom();
    var bar=document.querySelector('.arr-bar');
    var barH=(arrangeMode&&bar)?(bar.getBoundingClientRect().height/z):0;
    layer.style.height=Math.max(base,lowest+barH+24)+'px';
    var back=document.getElementById('arrLayerBack');
    if(back)back.style.height=layer.style.height;
    if(pg)pg.style.paddingBottom=barH?(barH+28)+'px':'';
  }
  function buildArrLayer(p){
    var pg=$('page'); if(!pg)return;
    var old=document.getElementById('arrLayer'); if(old)old.remove();
    var oldB=document.getElementById('arrLayerBack'); if(oldB)oldB.remove();
    pg.style.paddingBottom='';
    /* view mode anchors the Sold and Result covers in the stage, so only the
       third photo onwards is free-floating there */
    var viewMode=(p.edit===false);
    var startIdx=viewMode?2:0;
    /* a drawing shows every photo in its gallery, so nothing floats there */
    if(viewMode&&kindOf(p)==='drawing')return;
    if(viewMode){if(p.photos.length<=startIdx)return;}
    /* edit mode floats photos only while arranging — otherwise every photo is in
       the thumbnail strip, and showing both would duplicate each one */
    else if(!arrangeMode)return;
    /* anchor to the page BODY (not #page) so the sticky top bar growing or shrinking
       never shifts the photos relative to the content they were placed against */
    var host=document.getElementById('pageBody')||pg;
    host.style.position='relative';
    var layer=document.createElement('div');
    layer.id='arrLayer'; layer.className='arr-layer';
    layer.style.height=Math.max(host.scrollHeight,400)+'px';
    /* photos sent behind the page live in their own layer underneath it — but
       only once you've stopped arranging. While the tools are open everything is
       in front, because a photo under the page is a photo you can't take hold of. */
    var back=null;
    if(!arrangeMode&&p.photos.some(function(ph){return ph&&ph.back;})){
      back=document.createElement('div');
      back.id='arrLayerBack'; back.className='arr-layer behind';
      back.style.height=layer.style.height;
    }
    var hostW=host.clientWidth||pg.clientWidth||0;
    /* a hidden or not-yet-laid-out page reports zero width; building now would
       migrate the stored coordinates against a bogus width and wreck the layout,
       so wait for the next render/resize when the real width is known */

    /* hostW comes from the element's own box, which the zoom leaves alone, while
       a screen rectangle and the window width are both zoomed — so those two are
       brought back into the same units before they're compared with it */
    var z=appZoom();
    var hostLeft=host.getBoundingClientRect().left/z;
    var vw=(document.documentElement.clientWidth||hostW)/z;
    p.photos.forEach(function(photo,i){
      if(i<startIdx)return;
      arrLayout(photo,slot++,hostW,viewMode);
      var im=document.createElement('img');
      im.className='arr-img'+(arrangeMode&&i===arrSel?' sel':'')+(arrangeMode?'':(' locked'+(i===selPhoto?' sel':'')));
      im.setAttribute('data-i',i); im.src=photo.d; im.alt='';

         off-screen on a phone, so keep a strip of it visible — display only,
         the stored position is untouched */

      im.style.width=photo.aw+'%'; im.style.transform='rotate('+photo.arot+'deg)';

    });

    host.appendChild(layer);
    var placed=[].concat([].slice.call(layer.querySelectorAll('.arr-img')),
                         back?[].slice.call(back.querySelectorAll('.arr-img')):[]);

  function wireArrange(p,layer){

    function syncHandles(){

      if(!im||!hs.length)return;
      var L=im.offsetLeft,T=im.offsetTop,W=im.offsetWidth,H=im.offsetHeight;
      /* a handle hanging past a photo that sits flush against the window edge
         would push a horizontal scrollbar onto the page, so keep handles inside

        var c=CORNERS.filter(function(x){return x[0]===k;})[0]; if(!c)return;

      layer.appendChild(rt); wireHandle(rt,'rot');

    function wireHandle(el,kind){

          syncHandles(); fitArrLayer();

          im.removeEventListener('pointermove',move); im.removeEventListener('pointerup',up);

  /* ---------- add colours from a pasted list or a photographed chart ----------
     Kit charts are rows like "1  V  168": a row number, a symbol, then the DMC
     code. No DMC code is numerically below 150, so a bare number under 150 is a
     row number and is skipped silently rather than reported as unrecognised. */
  /* Only 454 DMC codes exist, so a number that isn't one of them can usually be
     repaired: text copied off a chart photo mixes up look-alike characters. */
  var CONFUSE={'O':'0','o':'0','D':'0','Q':'0','U':'0','I':'1','l':'1','i':'1','L':'1',
               'Z':'2','z':'2','E':'3','A':'4','S':'5','s':'5','G':'6','b':'6',
               'T':'7','B':'8','R':'8','g':'9','q':'9'};
  function digitize(t){return t.replace(/[A-Za-z]/g,function(c){return CONFUSE[c]||c;});}
  var DMCNUM=DMC.map(function(r){return r[0];}).filter(function(c){return /^\d+$/.test(c);});
  /* true when one insert, delete or substitution turns a into b */
  function within1(a,b){
    if(a===b)return true;
    var la=a.length,lb=b.length;
    if(Math.abs(la-lb)>1)return false;
    var i=0,j=0,diff=0;
    while(i<la&&j<lb){
      if(a.charAt(i)===b.charAt(j)){i++;j++;continue;}
      if(++diff>1)return false;
      if(la>lb)i++; else if(lb>la)j++; else {i++;j++;}
    }
    if(i<la||j<lb)diff++;
    return diff<=1;
  }
  function correctToken(t){
    /* 1. swap look-alike letters for digits — 38O9 -> 3809 */
    var d=digitize(t);
    if(d!==t){
      var k=DMCLOWER[d.toLowerCase()];
      if(k)return {code:k,how:'read'};
    }
    /* 2. otherwise accept a single-character slip, but only when exactly one
          real code is that close (no guessing between 3809 and 3808) */
    if(/^\d+$/.test(d)&&d.length>=3){
      var hits=[];
      for(var i=0;i<DMCNUM.length;i++){
        if(within1(d,DMCNUM[i])){hits.push(DMCNUM[i]);if(hits.length>1)break;}
      }
      if(hits.length===1)return {code:hits[0],how:'guess'};
    }
    return null;
  }
  function parsePasteText(raw,p){
    var toks=String(raw||'').split(/[^0-9A-Za-z]+/).filter(Boolean);
    var seen={},matched=[],unknown=[],fixes=[],ignored=0;
    function add(code,from,how){
      if(seen[code])return;
      seen[code]=1;
      matched.push({code:code,already:!!p.colors[code],on:!p.colors[code],from:from||'',how:how||''});
      if(from)fixes.push(from+' → '+code);
    }
    toks.forEach(function(t){
      var key=DMCLOWER[t.toLowerCase()];
      if(key){add(key);return;}
      /* a bare number under 150 is a chart row number, never a code — and never
         worth repairing, or row 16 would "become" 168 */
      if(/^\d+$/.test(t)&&parseInt(t,10)<150){ignored++;return;}
      if(/^[A-Za-z]+$/.test(t)){ignored++;return;}                 /* symbol or header word */
      var fix=correctToken(t);
      if(fix){add(fix.code,t,fix.how);return;}
      if(unknown.indexOf(t)===-1&&unknown.length<40)unknown.push(t);
    });
    return {matched:matched,unknown:unknown,fixes:fixes,ignored:ignored};
  }
  function setChartImage(file){
    if(!file)return;
    if(file.type&&!/^image\//.test(file.type)&&!/\.(jpe?g|png|gif|webp|heic|heif|bmp|avif)$/i.test(file.name||''))return;
    /* same careful path as photos — a chart that reads as black is useless */
    importImage(file,1100,0.85,function(d){
      if(!d){toast('That chart came out blank on this device — tap 🩺 Photo check',3800);return;}
      chartImg=d;   /* kept in memory only, never saved */
      fillPasteBox();
      toast('Chart added for reference ✓',1200);
    });
  }

  function fillPasteBox(){

      'To read them off a photo of the chart: on a phone use Google Lens or iPhone Live Text to select and copy the numbers; '+

    if(!pasteReview){
      h+='<div class="bk-btns" style="margin-top:8px;">'+

        '<button class="chipbtn" id="pasteCancel" type="button">Cancel</button></div>';

    var ta=$('pasteText');
