<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F2F5">
<title>Diamond Painting Colors</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DP Colors">
<style>html,body{margin:0;background:#F3F2F5;}</style>
<script>
/* The chosen theme lives in the app's database, which loads a moment after the
   page appears — so a dark-mode page used to flash light on every start. This
   hint is written on every theme change and read here, before first paint. */
try{
  if(localStorage.getItem('dpTheme')==='dark'){
    var _st=document.createElement('style'); _st.id='themeBoot';
    _st.textContent='html,body,.dp-app{background:#16141B !important;}';
    document.head.appendChild(_st);
    var _mt=document.querySelector('meta[name="theme-color"]');
    if(_mt)_mt.setAttribute('content','#16141B');
  }
}catch(e){}
</script>
</head>
<body>
<style>
  :root{
    --bg:#F3F2F5; --panel:#FFFFFF; --ink:#26222E; --muted:#7A7486;
    --line:#E4E1EA; --accent:#5B3FA8; --accent-soft:#EFEAFB;
    --sq:#2E6FBF; --sq-soft:#E7F0FB;
    --rd:#2F9E63; --rd-soft:#E6F6EE;
    --od:#B0398F; --od-soft:#F9E9F4;
    --unk:#8A8494; --unk-soft:#EEEDF1;
    --star:#B98A2F; --star-soft:#F8EFDC;
  }
  .dp-app.dark{
    --bg:#16141B; --panel:#221F2A; --ink:#ECE9F2; --muted:#9E98AC;
    --line:#332F3D; --accent:#B49BF2; --accent-soft:#2E2646;
    --sq:#6FA8E6; --sq-soft:#1E2A3A;
    --rd:#5FC98C; --rd-soft:#16301F;
    --od:#E084C4; --od-soft:#33172B;
    --unk:#A79FB4; --unk-soft:#2A2733;
    --star:#E0B65F; --star-soft:#332A16;
  }
  .dp-app.dark img.ovthumb,.dp-app.dark .photo-grid img{filter:brightness(.94);}
  .dp-app{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg); min-height:100vh; padding:14px 12px 60px;}
  .dp-app *{box-sizing:border-box;}
  .wrap{max-width:900px;margin:0 auto;}
  .dp-title{font-size:20px;font-weight:800;letter-spacing:.2px;margin:2px 2px 10px;display:flex;align-items:center;gap:8px;}
  .dp-title .gem{width:16px;height:16px;background:linear-gradient(135deg,#8f6fe0 0%,#5B3FA8 55%,#3c2a75 100%);
    transform:rotate(45deg);border-radius:4px;
    box-shadow:inset -2px -2px 0 rgba(0,0,0,.18), inset 2px 2px 0 rgba(255,255,255,.35);}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;}
  .tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
    padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .tab .cnt{color:var(--muted);font-weight:600;margin-left:6px;font-size:12px;}
  .tab.active{border-color:var(--accent);background:var(--accent);color:#fff;}
  .tab.active .cnt{color:#E4DBFA;}
  .tab.add{border-style:dashed;color:var(--accent);background:transparent;font-weight:700;}
  .tab.home,.tab.find,.tab.paints{font-weight:700;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .search{flex:1 1 200px;display:flex;align-items:center;background:var(--panel);border:1.5px solid var(--line);
    border-radius:12px;padding:9px 12px;gap:8px;}
  .search input{border:none;outline:none;font-size:15px;flex:1;background:transparent;color:var(--ink);}
  .chipbtn{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;
    font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);}
  .chipbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .chipbtn.danger{color:#A8324B;}
  .chipbtn.confirm{background:#A8324B !important;border-color:#A8324B !important;color:#fff !important;}
  .renamer{display:none;gap:8px;align-items:center;margin-bottom:10px;}
  .renamer.show{display:flex;}
  .renamer input{flex:1;border:1.5px solid var(--accent);border-radius:12px;padding:9px 12px;font-size:15px;outline:none;min-width:0;}
  .typerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
  .typerow .lbl{font-size:13px;color:var(--muted);font-weight:600;}
  .tbtn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;
    font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .tbtn.sq.on{background:var(--sq);border-color:var(--sq);color:#fff;}
  .tbtn.rd.on{background:var(--rd);border-color:var(--rd);color:#fff;}
  .tbtn.od.on{background:var(--od);border-color:var(--od);color:#fff;}
  .tbtn.any.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .fbtn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;
    font-size:13px;font-weight:700;cursor:pointer;}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;}
  .badge.sq{background:var(--sq-soft);color:var(--sq);}
  .badge.rd{background:var(--rd-soft);color:var(--rd);}
  .badge.od{background:var(--od-soft);color:var(--od);}
  .badge.unk{background:var(--unk-soft);color:var(--unk);}
  .badge.star{background:var(--star-soft);color:var(--star);}
  .fin-tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:800;margin-right:4px;}
  .meta{color:var(--muted);font-size:13px;padding:0 2px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px;}
  .card{display:flex;align-items:center;gap:9px;background:var(--panel);border:1.5px solid var(--line);
    border-radius:12px;padding:8px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;position:relative;}
  .card:active{transform:scale(.985);}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset;background:var(--accent-soft);}
  .card.open{border-color:var(--ink);}
  .drill{width:34px;height:34px;border-radius:8px;flex:0 0 auto;border:1px solid rgba(0,0,0,.14);
    background-image:linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 45%,rgba(0,0,0,.12) 100%);pointer-events:none;}
  .drill.spec{display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.35);}
  .ctext{min-width:0;pointer-events:none;}
  .code{font-weight:800;font-size:14px;line-height:1.1;}
  .cname{font-size:11.5px;color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .tick{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--accent);
    color:#fff;font-size:12px;line-height:18px;text-align:center;display:none;pointer-events:none;}
  .card.sel .tick{display:block;}
  .pcount{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:var(--accent);
    color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;padding:0 5px;pointer-events:none;}
  .pcount.zero{background:var(--unk-soft);color:var(--unk);}
  .delx{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#A8324B;color:#fff;
    border:2px solid var(--panel);font-size:12px;font-weight:800;line-height:18px;text-align:center;cursor:pointer;z-index:3;}
  .photo-grid .delx{width:24px;height:24px;line-height:20px;top:-8px;right:-8px;}
  .expander{grid-column:1/-1;background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;padding:10px;}
  .exp-head{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;}
  .exp-list{display:flex;flex-direction:column;gap:6px;}
  .exp-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;}
  .exp-item:active{transform:scale(.99);}
  .exp-name{font-weight:800;font-size:14px;margin-right:auto;}
  .empty{margin:30px auto;text-align:center;color:var(--muted);font-size:15px;max-width:420px;}
  .toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:6px 14px;border-radius:999px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;z-index:50;}
  .toast.show{opacity:.92;}
  .ovlist{display:flex;flex-direction:column;gap:8px;}
  .ovcard{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px;
    cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .ovcard:active{transform:scale(.99);}
  .ovtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ovname{font-weight:800;font-size:16px;margin-right:auto;}
  .ovsub{color:var(--muted);font-size:13px;margin-top:3px;}
  .ovfins{margin-top:6px;}
  .ovswatches{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap;align-items:center;}
  .ovthumb{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--line);}
  .ovtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .ovtag{background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;}
  .ovbody{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px;}
  .ovinfo{flex:1 1 150px;min-width:0;}
  .ovphotos{display:flex;gap:7px;flex-wrap:wrap;flex:0 0 auto;}
  .ovphoto{position:relative;flex:0 0 auto;}
  .ovphoto img{display:block;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--unk-soft);width:128px;height:96px;}
  .ovphotos.frame-portrait .ovphoto img{width:96px;height:124px;}
  .ovphotos.frame-square .ovphoto img{width:108px;height:108px;}
  .ovphotos.frame-round .ovphoto img{width:108px;height:108px;border-radius:50%;}
  .ovphoto-lbl{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:800;letter-spacing:.3px;padding:2px 8px;border-radius:999px;}
  .ovcard.stripe{padding-left:16px;}
  .ovcard.stripe::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:14px 0 0 14px;background:var(--stripe,transparent);}
  .ovprog{height:7px;border-radius:999px;background:var(--unk-soft);overflow:hidden;margin-top:9px;}
  .ovprog>i{display:block;height:100%;border-radius:999px;background:var(--rd);}
  .ovprog-lbl{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px;}
  .ovthumbc{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--line);display:none;flex:0 0 auto;}
  .ovcard.compact{padding-top:9px;padding-bottom:9px;}
  .ovcard.compact .ovthumbc{display:block;}
  .ovcard.compact .ovbody{display:none;}
  .acc-sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;}
  .acc-sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink);}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px;cursor:zoom-out;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;}
  .undobar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;display:flex;gap:12px;align-items:center;z-index:90;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:92%;}
  .undobar button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:800;cursor:pointer;font-size:13px;}
  .paint-sticky{position:sticky;top:0;z-index:50;background:var(--bg);padding-bottom:6px;box-shadow:0 6px 10px -8px rgba(0,0,0,.35);}
  .paint-head{padding:6px 0 4px;display:flex;align-items:center;gap:8px;}
  .photo-tools{border-top:1px solid var(--line);padding-top:6px;}
  .pt-row{display:flex;gap:10px;align-items:flex-start;}
  .pt-btns{flex:1 1 auto;min-width:0;}
  .photo-tools .photo-preview{max-width:104px;margin-top:0;flex:0 0 auto;}
  .photo-tools .photo-btns{margin-top:4px;}
  .pins{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 6px;}
  .pin{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;padding:2px 8px 2px 3px;font-size:11.5px;font-weight:800;cursor:pointer;background:var(--panel);}
  .pin .dot{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}
  .selbox{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;}
  .selbox.on{background:var(--accent);border-color:var(--accent);}
  .ovcard.picked{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset;}
  /* ---- arrange mode ---- */
  .arr-layer{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:30;}
  .arr-img{position:absolute;display:block;cursor:grab;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.25);
    user-select:none;-webkit-user-drag:none;pointer-events:auto;touch-action:none;}
  .arr-img.sel{outline:3px solid var(--accent);outline-offset:2px;}
  .arr-img.locked{cursor:pointer;}
  .arr-handle{position:absolute;width:26px;height:26px;border-radius:7px;background:var(--accent);border:2.5px solid #fff;
    box-shadow:0 2px 7px rgba(0,0,0,.45);z-index:40;touch-action:none;pointer-events:auto;cursor:nwse-resize;}
  .arr-handle.rot{background:var(--star);border-radius:50%;cursor:grab;}
  .arr-hint{font-size:11px;color:var(--muted);margin-top:5px;}
  .arr-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);border-top:1.5px solid var(--line);
    padding:8px 12px 10px;box-shadow:0 -4px 18px rgba(0,0,0,.22);max-height:44vh;overflow:auto;}
  .arr-bar .arr-hint{margin-top:6px;}
  .arr-on{outline:2px dashed var(--accent);outline-offset:4px;border-radius:12px;}
  .cropbox{position:absolute;border:2px dashed #fff;background:rgba(91,63,168,.25);pointer-events:none;}
  .cropwrap{position:relative;display:inline-block;max-width:100%;touch-action:none;}
  .cropwrap img{max-width:100%;max-height:56vh;display:block;border-radius:8px;}
  .mini{width:16px;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.14);
    background-image:linear-gradient(135deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 50%,rgba(0,0,0,.1) 100%);}
  .mini.more{background:var(--unk-soft);color:var(--unk);font-size:9px;font-weight:800;width:auto;padding:0 5px;
    line-height:16px;text-align:center;border-radius:5px;}
  .finrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
  .finrow .lbl{font-size:13px;color:var(--muted);font-weight:600;}
  .finbox{border:1.5px solid var(--line);border-radius:12px;background:var(--panel);padding:10px;margin-bottom:8px;}
  .fb-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .fb-lbl{font-size:13px;font-weight:800;margin-right:auto;}
  .fb-edit{border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;}
  .fb-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;margin-bottom:8px;}
  .fb-addrow{display:flex;gap:7px;}
  .fb-addrow input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;outline:none;min-width:0;}
  .fb-addrow input:focus{border-color:var(--accent);}
  .fb-hint{font-size:11px;color:var(--muted);margin-top:5px;}
  .section-lbl{font-size:13px;font-weight:700;color:var(--muted);margin:12px 2px 7px;}
  .backup{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:6px;}
  .bk-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .backup textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12px;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--panel);outline:none;resize:vertical;}
  .backup textarea:focus{border-color:var(--accent);}
  .bk-note{font-size:12px;color:var(--muted);margin-top:6px;}
  /* painting header: photos left, details right */
  .phead{display:flex;gap:12px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;
    padding:12px;margin-bottom:10px;align-items:flex-start;}
  .photos{flex:0 1 42%;min-width:96px;}
  .photo-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .pg-item{position:relative;}
  .pg-lbl{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.62);color:#fff;font-size:9px;font-weight:800;letter-spacing:.3px;padding:1px 6px;border-radius:999px;pointer-events:none;z-index:1;}
  .photo-grid img{border-radius:9px;object-fit:cover;border:2px solid var(--line);cursor:pointer;display:block;}
  .photo-grid img.psel{border-color:var(--accent);}
  .photo-s0{width:56px;height:56px;}
  .photo-s1{width:96px;height:96px;}
  .photo-s2{width:160px;height:160px;}
  .photo-s3{width:240px;height:240px;}
  .photo-btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;position:relative;z-index:35;}
  .pbtn{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:5px 9px;
    font-size:13px;font-weight:700;cursor:pointer;}
  .pbtn.danger{color:#A8324B;}
  .pbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .photo-preview{position:relative;margin-top:8px;max-width:260px;}
  .photo-preview img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:11px;border:1.5px solid var(--accent);background:var(--unk-soft);display:block;}
  .photo-preview.frame-portrait img{aspect-ratio:3/4;}
  .photo-preview.frame-square img{aspect-ratio:1;}
  .photo-preview.frame-round img{aspect-ratio:1;border-radius:50%;}
  .pv-lbl{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;pointer-events:none;}
  .photo-hint{font-size:11px;color:var(--muted);margin-top:5px;}
  .pdetails{flex:1;min-width:0;}
  .pd-name{font-size:18px;font-weight:800;line-height:1.2;margin-bottom:8px;overflow-wrap:anywhere;}
  .pd-row{margin-bottom:9px;}
  .pd-lbl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;}
  .selchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .selchip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;
    font-size:13px;font-weight:700;cursor:pointer;position:relative;}
  .selchip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .addinline{display:flex;gap:6px;align-items:center;}
  .addinline input{border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;outline:none;width:120px;}
  .addinline input:focus{border-color:var(--accent);}
  .codeinput{border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;font-size:14px;font-weight:600;
    outline:none;width:100%;max-width:260px;}
  .codeinput:focus{border-color:var(--accent);}
  .rating-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .rating-row input{border:1.5px solid var(--line);border-radius:9px;padding:6px 9px;font-size:15px;font-weight:800;
    width:74px;outline:none;text-align:center;}
  .rating-row input:focus{border-color:var(--accent);}
  .ovsort{display:flex;gap:8px;align-items:center;margin-bottom:9px;flex-wrap:wrap;}
  .sm-row{margin-bottom:9px;}
  .sm-lbl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;margin-bottom:4px;}
  .sm-lbl span:last-child{color:var(--muted);font-weight:600;white-space:nowrap;}
  .sm-bar{height:8px;border-radius:999px;background:var(--unk-soft);overflow:hidden;}
  .sm-fill{height:100%;border-radius:999px;min-width:2px;}
  .renamer input,.codeinput,.rating-row input,.addinline input,.fb-addrow input{background:var(--panel);color:var(--ink);}
  /* buttons don't inherit text color — set it so they stay readable in dark mode
     (more specific rules like .pbtn.danger, .selchip.on and inline styles still win) */
  .tbtn,.fbtn,.pbtn,.selchip{color:var(--ink);}
  /* ---- view mode (read-only, compact) ---- */
  .vw-list{display:flex;flex-direction:column;gap:4px;margin:8px 0;}
  .vw-row{display:flex;gap:10px;font-size:13.5px;align-items:baseline;}
  .vw-lbl{color:var(--muted);font-weight:700;flex:0 0 78px;}
  .vw-val{font-weight:600;overflow-wrap:anywhere;min-width:0;}
  .grid.compact{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));}
  .grid.compact .card{padding:6px;}
  .card.ro{cursor:default;}
  .card.ro:active{transform:none;}
  .vw-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
  .vw-empty{color:var(--muted);font-size:13px;margin:0 2px 8px;}
  /* view mode stage: Sold cover on the left, details in the middle, Result on the
     right. Nothing here changes between arranging and done, so the page can't
     shift underneath the photos. */
  .vw-stage{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
  .vw-side{flex:1 1 130px;min-width:0;position:relative;}
  .vw-card{flex:2.2 1 280px;min-width:0;background:var(--panel);border:1.5px solid var(--line);
    border-radius:14px;padding:12px;}
  .vw-side img{width:100%;display:block;border-radius:12px;border:1.5px solid var(--line);
    background:var(--unk-soft);cursor:zoom-in;box-shadow:0 2px 12px rgba(0,0,0,.18);}
  .vw-side.frame-landscape img{aspect-ratio:4/3;}
  .vw-side.frame-portrait img{aspect-ratio:3/4;}
  .vw-side.frame-square img{aspect-ratio:1;}
  .vw-side.frame-round img{aspect-ratio:1;border-radius:50%;}
  /* drawings: one big picture with the rest in a gallery underneath */
  .vw-hero{flex:1.4 1 300px;min-width:0;}
  .vw-hero img{width:100%;display:block;max-height:440px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--unk-soft);cursor:zoom-in;box-shadow:0 2px 14px rgba(0,0,0,.2);}
  .vw-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;}
  .vw-gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);
    background:var(--unk-soft);cursor:zoom-in;display:block;}
  /* phones: the two covers share the top row at a usable size, details below */
  @media (max-width:640px){
    .vw-stage{flex-wrap:wrap;}
    .vw-side{flex:1 1 calc(50% - 6px);}
    .vw-card{flex:1 1 100%;order:1;}
    /* edit mode: photo strip gets the full width instead of a 42% column, so
       both covers are visible side by side rather than squeezed into a sliver */
    .phead{flex-wrap:wrap;}
    .photos{flex:1 1 100%;}
  }

  function claudeStore(){

  function idbStore(){
    return new Promise(function(res,rej){
      if(!window.indexedDB){rej(new Error('no idb'));return;}
      var req=window.indexedDB.open('dpTracker',1);
      req.onupgradeneeded=function(){req.result.createObjectStore('kv');};
      req.onerror=function(){rej(req.error);};
      req.onsuccess=function(){
        var db=req.result;
        function tx(mode,fn){
          return new Promise(function(res2,rej2){
            var t=db.transaction('kv',mode), st=t.objectStore('kv');
            var r=fn(st);
            r.onsuccess=function(){res2(r.result);};
            r.onerror=function(){rej2(r.error);};
          });
        }
        res({
          kind:'idb',
          get:function(k){return tx('readonly',function(st){return st.get(k);}).then(function(v){return v==null?null:{value:v};});},
          set:function(k,v){return tx('readwrite',function(st){return st.put(v,k);});},
          del:function(k){return tx('readwrite',function(st){return st.delete(k);});}
        });
      };
    });

  /* ---------- local backups (device-only snapshots) ---------- */
  var BKINDEX='dpBackupsV1';
  function bkStore(){return LOCAL||STORE;}
  function listBackups(cb){
    var st=bkStore(); if(!st){cb([]);return;}
    st.get(BKINDEX).then(function(r){
      var arr=[]; try{if(r&&r.value)arr=JSON.parse(r.value)||[];}catch(e){}
      cb(arr);
    },function(){cb([]);});
  }
  /* auto: true for the daily/weekly timer, 'safety' for the automatic snapshot
     taken just before a restore replaces everything */
  function saveBackup(withPhotos,cb,auto){
    var st=bkStore(); if(!st){if(!auto)toast('Backups are not available here',1800);cb&&cb();return;}
    var data=JSON.stringify(withPhotos?state:strippedState());
    var id=uid('bk'), ts=nowTs();
    var entry={id:id,ts:ts,photos:!!withPhotos,size:data.length,count:state.paintings.length,auto:auto===true,safety:auto==='safety'};
    listBackups(function(arr){
      arr.unshift(entry);
      var removed=arr.slice(20); arr=arr.slice(0,20);
      st.set('dpBk_'+id,data).then(function(){
        st.set(BKINDEX,JSON.stringify(arr)).then(function(){
          removed.forEach(function(e){try{st.del('dpBk_'+e.id);}catch(_){}});
          if(!auto)toast('Backup saved ✓',1200); cb&&cb();
        },function(){if(!auto)toast('Could not save backup',1800);cb&&cb();});
      },function(){if(!auto)toast('Could not save backup — storage may be full',2200);cb&&cb();});
    });
  }
  function maybeAutoBackup(cb){
    if(!state.autoBackup||state.autoBackup==='off'){cb&&cb();return;}
    var interval=state.autoBackup==='weekly'?7*86400000:86400000;
    var last=0; try{last=parseInt(localStorage.getItem('dpAutoBkTs')||'0',10)||0;}catch(e){}
    var now=nowTs();
    if(now-last<interval){cb&&cb();return;}
    try{localStorage.setItem('dpAutoBkTs',String(now));}catch(e){}
    saveBackup(false,function(){cb&&cb();},true);
  }
  function deleteBackup(id,cb){
    var st=bkStore(); if(!st){cb&&cb();return;}
    listBackups(function(arr){
      arr=arr.filter(function(e){return e.id!==id;});
      st.set(BKINDEX,JSON.stringify(arr)).then(function(){try{st.del('dpBk_'+id);}catch(_){}cb&&cb();},function(){cb&&cb();});
    });
  }
  /* replace all data with a restored backup: clean up photo keys of paintings
     that no longer exist, re-read stored photos for "no photos" backups, and
     reset the undo history so Ctrl+Z can't mix old and new data */
  function applyRestored(s){
    var oldIds=state.paintings.map(function(p){return p.id;});
    state=normalize(s);
    var keep={}; state.paintings.forEach(function(p){keep[p.id]=1;});
    oldIds.forEach(function(id){if(!keep[id]){deletePhotosKey(id);deletePaintKey(id);}});
    trash=[]; selectedIds={}; resetTransient();
    render(); save();
    state.paintings.forEach(function(p){if(p.photos&&p.photos.length)savePhotos(p.id);});
    reloadMissingPhotos(function(changed){if(changed)render();historyInit();});
    toast('Restored ✓ — '+state.paintings.length+' project'+(state.paintings.length===1?'':'s'),1600);
  }
  function restoreBackup(id,cb){
    var st=bkStore(); if(!st){cb&&cb();return;}
    st.get('dpBk_'+id).then(function(r){
      try{
        var s=JSON.parse(r.value);
        if(!s||!s.paintings||!s.paintings.length)throw new Error('bad');
        s.view='paintings';
        /* escape hatch: snapshot what's here now, so even a wrong restore can be undone */
        saveBackup(true,function(){applyRestored(s);cb&&cb();},'safety');
        return;
      }catch(e){toast('That backup could not be read',2000);}
      cb&&cb();
    },function(){toast('That backup could not be read',2000);cb&&cb();});
  }
  function statsHtml(){

  /* one row per project, semicolon-separated with a UTF-8 marker, which is what
     Excel in European locales opens straight into columns */
  function csvField(v){
    v=String(v==null?'':v);
    if(/[;"\r\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  function exportCsv(){
    var head=['Name','Kind','Status','Progress %','Rating','Price','Size (cm)','Seller','Kit code','Diamond type','Started','Finished','Tags','Media','Colours','Colour numbers','Notes'];
    var lines=[head.join(';')];
    state.paintings.forEach(function(p){
      var codes=Object.keys(p.colors||{});
      lines.push([
        p.name||'', KINDMAP[kindOf(p)].label,
        (p.status&&STATUSMAP[p.status])?STATUSMAP[p.status].label:'',
        p.progress||0,
        (p.rating===null||p.rating===undefined||p.rating==='')?'':p.rating,
        p.price||'', p.size||'', p.seller||'', p.code||'',
        (p.type&&TYPES[p.type])?TYPES[p.type].label:'',
        p.started||'', p.finished||'',
        Object.keys(p.tags||{}).join(', '),
        Object.keys(p.media||{}).join(', '),
        codes.length, codes.join(' '),
        p.notes||''
      ].map(csvField).join(';'));
    });
    var bom=String.fromCharCode(0xFEFF);   /* UTF-8 marker so Excel reads accents correctly */
    var blob=new Blob([bom+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='diamond-painting-projects-'+(todayStr()||'today')+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    toast('CSV saved ✓ — opens in Excel or Google Sheets',1800);
  }

  /* ---------- paintings gallery ---------- */
  function photoStyle(photo){
    var fit=photo.fit||'cover';
    var px=(photo.posX==null?50:photo.posX);
    var py=(photo.posY==null?50:photo.posY);
    return 'object-fit:'+fit+';object-position:'+px+'% '+py+'%;'+(photo.flip?'transform:scaleX(-1);':'');

  function paintingCardHtml(p){

  function filteredPaintings(){
    var q=(pQuery||'').trim().toLowerCase();
    var f=state.pSearchField||'all';
    var list=state.paintings.slice();
    if(state.pKind&&state.pKind!=='all')list=list.filter(function(p){return kindOf(p)===state.pKind;});
    if(q){
      list=list.filter(function(p){
        if(f==='name')   return (p.name||'').toLowerCase().indexOf(q)!==-1;
        if(f==='diamond')return Object.keys(p.colors||{}).some(function(c){return c.toLowerCase().indexOf(q)!==-1;});
        if(f==='seller') return (p.seller||'').toLowerCase().indexOf(q)!==-1;
        if(f==='code')   return (p.code||'').toLowerCase().indexOf(q)!==-1;
        if(f==='tag')    return Object.keys(p.tags||{}).some(function(t){return t.toLowerCase().indexOf(q)!==-1;});
        if(f==='media')  return Object.keys(p.media||{}).some(function(t){return t.toLowerCase().indexOf(q)!==-1;});
        var st=(p.status&&STATUSMAP[p.status])?STATUSMAP[p.status].label:'';
        var hay=(p.name||'')+' '+(p.seller||'')+' '+(p.code||'')+' '+(p.size||'')+' '+st+' '+KINDMAP[kindOf(p)].label+' '+
          Object.keys(p.tags||{}).join(' ')+' '+Object.keys(p.media||{}).join(' ')+' '+Object.keys(p.colors||{}).join(' ');
        return hay.toLowerCase().indexOf(q)!==-1;
      });
    }
    if(state.ovSort==='rating'){
      list.sort(function(a,b){
        var ra=(a.rating===null||a.rating===undefined||a.rating==='')?-1:Number(a.rating);
        var rb=(b.rating===null||b.rating===undefined||b.rating==='')?-1:Number(b.rating);
        return rb-ra;
      });
    } else if(state.ovSort==='edited'){
      list.sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0);});
    } else if(state.ovSort==='name'){
      list.sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
    } else if(state.ovSort==='price'){
      var pn=function(p){var n=parsePrice(p.price);return isNaN(n)?-1:n;};
      list.sort(function(a,b){return pn(b)-pn(a);});
    }
    return list;
  }

      [['square','■ Square'],['round','● Round'],['odd','✦ Odd'],[null,'Type not set']].forEach(function(t){
        var items=list.filter(function(p){return (p.type||null)===t[0];});
        if(items.length)groups.push({label:t[1],items:items});
      });
    } else if(state.pGroup==='size'){
      var seen={};
      state.sizes.forEach(function(sz){
        var items=list.filter(function(p){return p.size===sz;});
        if(items.length){groups.push({label:esc(sz),items:items});seen[sz]=1;}
      });
      var extras={};
      list.forEach(function(p){if(p.size&&!seen[p.size])extras[p.size]=1;});
      Object.keys(extras).forEach(function(sz){
        groups.push({label:esc(sz),items:list.filter(function(p){return p.size===sz;})});
      });
      var noSize=list.filter(function(p){return !p.size;});
      if(noSize.length)groups.push({label:'No size set',items:noSize});
    } else if(state.pGroup==='seller'){
      var seenS={};
      state.sellers.forEach(function(s){
        var items=list.filter(function(p){return p.seller===s;});
        if(items.length){groups.push({label:esc(s),items:items});seenS[s]=1;}
      });
      var extraS={};
      list.forEach(function(p){if(p.seller&&!seenS[p.seller])extraS[p.seller]=1;});
      Object.keys(extraS).forEach(function(s){groups.push({label:esc(s),items:list.filter(function(p){return p.seller===s;})});});
      var noSel=list.filter(function(p){return !p.seller;});
      if(noSel.length)groups.push({label:'No seller',items:noSel});
    } else if(state.pGroup==='status'){
      STATUSES.forEach(function(s){
        var items=list.filter(function(p){return p.status===s.id;});
        if(items.length)groups.push({label:s.label,items:items});
      });
      var noSt=list.filter(function(p){return !p.status;});
      if(noSt.length)groups.push({label:'No status',items:noSt});
    } else if(state.pGroup==='finish'){
      FINISHES.forEach(function(f){
        var items=list.filter(function(p){return p.finishes&&p.finishes[f.id];});
        if(items.length)groups.push({label:esc(f.label),items:items});
      });
      var noFin=list.filter(function(p){return !p.finishes||!Object.keys(p.finishes).length;});
      if(noFin.length)groups.push({label:'No special diamonds',items:noFin});
    }
    var out='';
    groups.forEach(function(g){
      var collapsed=!!collapsedGroups[g.label];
      out+='<div class="section-lbl grp-hd" data-grp="'+encodeURIComponent(g.label)+'" style="cursor:pointer;user-select:none;">'+(collapsed?'▸':'▾')+' '+g.label+' <span style="color:var(--muted);font-weight:700;">'+g.items.length+'</span></div>';
      if(!collapsed)out+='<div class="ovlist">'+g.items.map(paintingCardHtml).join('')+'</div>';
    });
    return out;
  }

  function openLightbox(src){
    var lb=document.createElement('div'); lb.className='lightbox';

    function destroy(){lb.remove();document.removeEventListener('keydown',onKey);document.body.style.overflow='';}

  /* ---------- photos ----------
     Phones fail at this in ways a PC never does. A big screenshot or camera photo
     can load far enough for its width and height to be known and still draw
     NOTHING onto a canvas — and a canvas that was never drawn on is transparent,
     which turns into solid BLACK the instant it is saved as a JPEG. That is the
     whole "my photo is just black" bug. So: decode through createImageBitmap
     where it exists (it copes with sizes the <img> route cannot), shrink in
     halving steps rather than one huge leap, check the result actually has
     something in it, and never save a blank. */
  var photoDiag=[];
  function noteDiag(rec){rec.when=nowTs();photoDiag.unshift(rec);if(photoDiag.length>8)photoDiag.pop();}
  /* The picked file is read ONCE. Phone pickers hand over files backed by a
     one-shot stream, so anything that re-reads the file later (a retry, the
     rescue decoder) gets "could not be decoded" even though the bytes were fine
     the first time. Everything below works from these bytes instead. */
  function readFileAsDataUrl(file,cb){
    var rd=new FileReader();
    rd.onload=function(){cb(String(rd.result||''),'');};
    rd.onerror=function(){cb('','the file could not be read');};

        if(xx>0)stack.push(i-1);
        if(xx<w-1)stack.push(i+1);
        if(yy>0)stack.push(i-w);
        if(yy<h-1)stack.push(i+w);
      }
      var minX=w,minY=h,maxX=-1,maxY=-1;
      for(var j=0;j<n;j++){
        if(d[j*4+3]>10){var jx=j%w,jy=(j-jx)/w;
          if(jx<minX)minX=jx; if(jx>maxX)maxX=jx;
          if(jy<minY)minY=jy; if(jy>maxY)maxY=jy;}
      }
      if(maxX<0){cb(false);return;}
      ctx.putImageData(data,0,0);
      var cw=maxX-minX+1, chh=maxY-minY+1;
      var out=document.createElement('canvas');out.width=cw;out.height=chh;
      out.getContext('2d').drawImage(cv,minX,minY,cw,chh,0,0,cw,chh);
      photo.d=out.toDataURL('image/png');
      cb(true);
    };
    img.onerror=function(){cb(false);};
    img.src=photo.d;
  }

  function openCrop(photo,cb){

    var hint=document.createElement('div'); hint.style.cssText='color:#fff;font-size:12.5px;font-weight:700;';

    var bar=document.createElement('div'); bar.style.cssText='display:flex;gap:8px;';

    var cancel=document.createElement('button'); cancel.className='chipbtn'; cancel.textContent='Cancel';
    bar.appendChild(apply); bar.appendChild(cancel);
    ov.appendChild(hint); ov.appendChild(wrap); ov.appendChild(bar);
    document.body.appendChild(ov);
    var sx=0,sy=0,ex=0,ey=0,drawing=false;
    function upd(){
      var l=Math.min(sx,ex),t=Math.min(sy,ey),ww=Math.abs(ex-sx),hh=Math.abs(ey-sy);
      box.style.left=l+'px';box.style.top=t+'px';box.style.width=ww+'px';box.style.height=hh+'px';
    }
    wrap.addEventListener('pointerdown',function(e){
      var r=im.getBoundingClientRect(); drawing=true;
      sx=e.clientX-r.left; sy=e.clientY-r.top; ex=sx; ey=sy;
      box.style.display='block'; upd();
      try{wrap.setPointerCapture(e.pointerId);}catch(_){}
    });
    wrap.addEventListener('pointermove',function(e){
      if(!drawing)return; var r=im.getBoundingClientRect();
      ex=e.clientX-r.left; ey=e.clientY-r.top; upd();
    });
    wrap.addEventListener('pointerup',function(e){drawing=false;try{wrap.releasePointerCapture(e.pointerId);}catch(_){}});
    cancel.addEventListener('click',function(){ov.remove();cb(false);});
    apply.addEventListener('click',function(){
      var r=im.getBoundingClientRect();
      var l=Math.min(sx,ex),t=Math.min(sy,ey),ww=Math.abs(ex-sx),hh=Math.abs(ey-sy);
      if(ww<8||hh<8){ov.remove();cb(false);return;}
      var scale=im.naturalWidth/r.width;
      var img2=new Image();
      img2.onload=function(){
        var cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(ww*scale)); cv.height=Math.max(1,Math.round(hh*scale));
        cv.getContext('2d').drawImage(img2,Math.round(l*scale),Math.round(t*scale),cv.width,cv.height,0,0,cv.width,cv.height);
        /* a cut-out photo is a PNG with see-through edges: saving it as JPEG would
           turn all of that black, so PNGs stay PNGs and everything else lands on white */
        photo.d=/^data:image\/png/i.test(photo.d)?cv.toDataURL('image/png'):flattenToJpeg(cv,0.85);
        ov.remove(); cb(true);
      };
      img2.onerror=function(){ov.remove();cb(false);};
      img2.src=photo.d;
    });
  }

       the thumbnail strip, and showing both would duplicate each one */

       migrate the stored coordinates against a bogus width and wreck the layout,

         off-screen on a phone, so keep a strip of it visible — display only,
         the stored position is untouched */

      var L=im.offsetLeft,T=im.offsetTop,W=im.offsetWidth,H=im.offsetHeight;

    function wireHandle(el,kind){
      el.addEventListener('pointerdown',function(e){
        e.preventDefault(); e.stopPropagation();

          syncHandles();
        }
        function up(ev){
          try{im.releasePointerCapture(ev.pointerId);}catch(_){}

  /* ---------- add colours from a pasted list or a photographed chart ----------
     Kit charts are rows like "1  V  168": a row number, a symbol, then the DMC
     code. No DMC code is numerically below 150, so a bare number under 150 is a
     row number and is skipped silently rather than reported as unrecognised. */
  /* Only 454 DMC codes exist, so a number that isn't one of them can usually be
     repaired: text copied off a chart photo mixes up look-alike characters. */
  var CONFUSE={'O':'0','o':'0','D':'0','Q':'0','U':'0','I':'1','l':'1','i':'1','L':'1',
               'Z':'2','z':'2','E':'3','A':'4','S':'5','s':'5','G':'6','b':'6',
               'T':'7','B':'8','R':'8','g':'9','q':'9'};
  function digitize(t){return t.replace(/[A-Za-z]/g,function(c){return CONFUSE[c]||c;});}
  var DMCNUM=DMC.map(function(r){return r[0];}).filter(function(c){return /^\d+$/.test(c);});
  /* true when one insert, delete or substitution turns a into b */
  function within1(a,b){
    if(a===b)return true;
    var la=a.length,lb=b.length;
    if(Math.abs(la-lb)>1)return false;
    var i=0,j=0,diff=0;
    while(i<la&&j<lb){
      if(a.charAt(i)===b.charAt(j)){i++;j++;continue;}
      if(++diff>1)return false;
      if(la>lb)i++; else if(lb>la)j++; else {i++;j++;}
    }
    if(i<la||j<lb)diff++;
    return diff<=1;
  }
  function correctToken(t){
    /* 1. swap look-alike letters for digits — 38O9 -> 3809 */
    var d=digitize(t);
    if(d!==t){
      var k=DMCLOWER[d.toLowerCase()];
      if(k)return {code:k,how:'read'};
    }
    /* 2. otherwise accept a single-character slip, but only when exactly one
          real code is that close (no guessing between 3809 and 3808) */
    if(/^\d+$/.test(d)&&d.length>=3){
      var hits=[];
      for(var i=0;i<DMCNUM.length;i++){
        if(within1(d,DMCNUM[i])){hits.push(DMCNUM[i]);if(hits.length>1)break;}
      }
      if(hits.length===1)return {code:hits[0],how:'guess'};
    }
    return null;
  }
  function parsePasteText(raw,p){
    var toks=String(raw||'').split(/[^0-9A-Za-z]+/).filter(Boolean);
    var seen={},matched=[],unknown=[],fixes=[],ignored=0;
    function add(code,from,how){
      if(seen[code])return;
      seen[code]=1;
      matched.push({code:code,already:!!p.colors[code],on:!p.colors[code],from:from||'',how:how||''});
      if(from)fixes.push(from+' → '+code);
    }
    toks.forEach(function(t){
      var key=DMCLOWER[t.toLowerCase()];
      if(key){add(key);return;}
      /* a bare number under 150 is a chart row number, never a code — and never
         worth repairing, or row 16 would "become" 168 */
      if(/^\d+$/.test(t)&&parseInt(t,10)<150){ignored++;return;}
      if(/^[A-Za-z]+$/.test(t)){ignored++;return;}                 /* symbol or header word */
      var fix=correctToken(t);
      if(fix){add(fix.code,t,fix.how);return;}
      if(unknown.indexOf(t)===-1&&unknown.length<40)unknown.push(t);
    });
    return {matched:matched,unknown:unknown,fixes:fixes,ignored:ignored};
  }
  function setChartImage(file){

    /* same careful path as photos — a chart that reads as black is useless */
    importImage(file,1100,0.85,function(d){
      if(!d){toast('That chart came out blank on this device — tap 🩺 Photo check',3800);return;}
      chartImg=d;   /* kept in memory only, never saved */
      fillPasteBox();
      toast('Chart added for reference ✓',1200);
    });
  }

            (x.from?' style="color:var(--star);font-weight:700;"':'')+'>'+sub+'</div></div>'+
          '<div class="tick">✓</div></div>';
      }).join('')+'</div>';
    } else {
      h+='<div class="vw-empty" style="margin-top:8px;">No DMC numbers found in that text.</div>';
    }
    if(pasteReview.unknown.length)
      h+='<div class="bk-note" style="margin-top:8px;">Not recognised: '+pasteReview.unknown.map(esc).join(', ')+'</div>';
    h+='<div class="bk-btns" style="margin-top:8px;">'+
      '<button class="chipbtn" id="pasteConfirm" type="button"'+(picked?' style="background:var(--accent);border-color:var(--accent);color:#fff;"':' disabled style="opacity:.5"')+'>'+
        'Add '+picked+' colour'+(picked===1?'':'s')+'</button>'+
      '<button class="chipbtn" id="pasteBack" type="button">← Edit the text</button>'+
      '<button class="chipbtn" id="pasteCancel" type="button">Cancel</button></div>';
    return h;
  }
  function fillPasteBox(){
    var box=$('pasteBox'); if(!box)return;
    var p=active();
    var h='<div class="bk-note">Paste the colour numbers from your kit — commas, spaces or new lines all work. '+
      'To read them off a photo of the chart: on a phone use Google Lens or iPhone Live Text to select and copy the numbers; '+
      'on Windows 11 use Snipping Tool → Text actions. Then paste here — nothing is added until you confirm.</div>'+
      '<textarea id="pasteText" rows="3" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;background:var(--panel);color:var(--ink);" placeholder="e.g. 321, 310 700 3801 White — or a whole chart: 1 V 168  2 B 310 …">'+esc(pasteTextVal)+'</textarea>'+
      '<div class="bk-btns" style="margin-top:6px;">'+
        '<button class="chipbtn" id="chartAdd" type="button">🖼 '+(chartImg?'Replace':'Add')+' chart photo</button>'+
        (chartImg?'<button class="chipbtn danger" id="chartClear" type="button">✕ Remove chart</button>':'')+
        '<span class="bk-note" style="align-self:center;margin:0;">for reference while you check — not saved to the painting</span>'+
      '</div>';
    if(chartImg)
      h+='<img id="chartImgEl" src="'+chartImg+'" alt="colour chart" style="margin-top:8px;max-width:100%;max-height:280px;border-radius:10px;border:1.5px solid var(--line);cursor:zoom-in;display:block;">';
    if(!pasteReview){
      h+='<div class="bk-btns" style="margin-top:8px;">'+
        '<button class="chipbtn" id="pasteCheck" type="button" style="background:var(--accent);border-color:var(--accent);color:#fff;">Check these numbers</button>'+
        '<button class="chipbtn" id="pasteCancel" type="button">Cancel</button></div>';
    } else h+=pasteReviewHtml();
    box.innerHTML=h;

    var ta=$('pasteText');
    if(ta)ta.addEventListener('input',function(e){pasteTextVal=e.target.value;});
    if($('chartAdd'))$('chartAdd').addEventListener('click',function(){chartPick=true;$('fileInput').click();});
    if($('chartClear'))$('chartClear').addEventListener('click',function(){chartImg=null;fillPasteBox();});
    if($('chartImgEl'))$('chartImgEl').addEventListener('click',function(){openLightbox(chartImg);});
    if($('pasteCheck'))$('pasteCheck').addEventListener('click',function(){
      pasteReview=parsePasteText(pasteTextVal,p);
      fillPasteBox();
    });
    if($('pasteBack'))$('pasteBack').addEventListener('click',function(){pasteReview=null;fillPasteBox();});
    box.querySelectorAll('[data-rev]').forEach(function(c){
      c.addEventListener('click',function(){
        var x=pasteReview.matched[parseInt(c.getAttribute('data-rev'),10)];
        if(!x||x.already)return;
        x.on=!x.on; fillPasteBox();
      });
    });
    if($('pasteConfirm'))$('pasteConfirm').addEventListener('click',function(){
      var added=0;
      pasteReview.matched.forEach(function(x){
        if(x.on&&!p.colors[x.code]){p.colors[x.code]=1;added++;}
      });
      if(!added){toast('Nothing ticked',1200);return;}
      showPaste=false; pasteReview=null; pasteTextVal=''; chartImg=null;
      renderPainting(); renderTabs(); saveEdit();
      toast('Added '+added+' colour'+(added===1?'':'s')+' ✓',1600);
    });
    box.querySelectorAll('#pasteCancel').forEach(function(b){
      b.addEventListener('click',function(){
        showPaste=false; pasteReview=null; pasteTextVal=''; chartImg=null;
        renderPainting();
      });
    });
  }

    var notesHtml=p.notes

        '<span class="vw-val" style="white-space:pre-wrap;">'+esc(p.notes)+'</span></div>' : '';

    /* the big picture for a drawing, with every other photo in a gallery below */
    function heroStyle(photo){
      var fit=photo.fit||'contain';
      var px=(photo.posX==null?50:photo.posX),py=(photo.posY==null?50:photo.posY);
      return 'object-fit:'+fit+';object-position:'+px+'% '+py+'%;'+(photo.flip?'transform:scaleX(-1);':'');
    }
    var heroHtml=(isDraw&&p.photos[0])
      ? '<div class="vw-hero"><img data-i="0" src="'+p.photos[0].d+'" alt="" style="'+heroStyle(p.photos[0])+'"></div>' : '';
    var galleryHtml='';
    if(isDraw&&p.photos.length>1){
      galleryHtml='<div class="section-lbl">Photos ('+p.photos.length+')</div><div class="vw-gallery">'+

        }).join('')+'</div>';
    }

    var sel=isDiamond(p)?DMC.filter(function(r){return p.colors[r[0]];}):[];
    var colHtml='';
    if(isDiamond(p)){
      colHtml='<div class="section-lbl">Colours ('+sel.length+')</div>'+(sel.length
        ? '<div class="grid compact">'+sel.map(function(r){
            return '<div class="card ro"><div class="drill" style="background-color:'+r[2]+'"></div>'+
              '<div class="ctext"><div class="code">'+r[0]+'</div><div class="cname">'+esc(r[1])+'</div></div></div>';
          }).join('')+'</div>'
        : '<div class="vw-empty">No colours marked yet — switch to edit mode to add them.</div>');
    } else if(kd==='pbn'&&(p.palette||[]).length){
      colHtml='<div class="section-lbl">Colours in this kit ('+p.palette.length+')</div>'+
        '<div class="grid compact">'+p.palette.map(function(en,i){
          return '<div class="card ro"><div class="drill" style="background-color:'+esc(en.color||'#cccccc')+'"></div>'+
            '<div class="ctext"><div class="code">'+esc(en.label||('Colour '+(i+1)))+'</div>'+
            '<div class="cname">'+esc(en.color||'')+'</div></div></div>';
        }).join('')+'</div>';
    }

    var specHtml='';
    if(isDiamond(p))FINISHES.forEach(function(f){
      if(!(f.id in p.spec))return;
      var chosen=(state.specials[f.id]||[]).filter(function(en){return p.spec[f.id][en.id];});
      if(!chosen.length)return;
      specHtml+='<div class="section-lbl" style="color:'+f.fg+'">'+f.label+' diamonds ('+chosen.length+')</div>'+
        '<div class="grid compact">'+chosen.map(function(en){
          return '<div class="card ro">'+specCardHtml(f.id,en,'')+'</div>';
        }).join('')+'</div>';
    });

    pg.innerHTML=
      '<div class="paint-sticky">'+
        '<div class="paint-head">'+
          '<button class="chipbtn" id="backPaints" type="button" style="font-weight:700;">← All</button>'+
          '<span style="font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto;">'+esc(p.name)+'</span>'+
          (!isDraw&&p.photos.length>2?('<button class="chipbtn'+(arrangeMode?' on':'')+'" id="arrEnter2" type="button">'+(arrangeMode?'✓ Done':'⇱ Move images')+'</button>'):'')+
          '<button class="chipbtn" id="modeToggle" type="button" title="Switch to edit mode">📖🖋 Edit</button>'+
        '</div>'+
      '</div>'+
      '<div id="pageBody">'+
        '<div class="vw-stage">'+
          (isDraw?heroHtml:sideHtml(0,'Sold'))+

            '<div class="pd-name">'+esc(p.name)+'</div>'+

            (fins?'<div class="ovfins">'+fins+'</div>':'')+
            (rows?'<div class="vw-list">'+rows+'</div>':'')+
            mediaHtml+
            (tagKeys.length?('<div class="ovtags">'+tagKeys.map(function(t){return '<span class="ovtag">'+esc(t)+'</span>';}).join('')+'</div>'):'')+
            prog+notesHtml+
          '</div>'+
          (isDraw?'':sideHtml(1,'Result'))+
        '</div>'+
        galleryHtml+colHtml+specHtml+

      /* the arrange bar is position:fixed, so keeping it outside #pageBody means
         the page flow is byte-for-byte identical whether arranging or not */
      (arrangeMode?arrangeUiHtml(p):'');

    $('backPaints').addEventListener('click',function(){navTo('paintings');});
    $('modeToggle').addEventListener('click',function(){
      if(arrangeMode)arrangeMode=false;
      p.edit=true; renderPainting(); save();

    if($('arrEnter2'))$('arrEnter2').addEventListener('click',function(){
      if(arrangeMode)exitArrange(); else enterArrange();
    });
    pg.querySelectorAll('.vw-side img,.vw-hero img,.vw-gallery img').forEach(function(im){
      im.addEventListener('click',function(){openLightbox(im.src);});
    });
    buildArrLayer(p);
  }

  /* ---------- painting page ---------- */
  function renderPainting(){
    var p=active();
    /* belt and braces: a record arriving from an old backup or an older device
       mustn't be able to blank the page on a missing field */
    if(!p.media)p.media={};
    if(!p.palette)p.palette=[];
    if(p.edit===false){renderPaintingView(p);return;}
    var pg=$('page');

    /* Photos block. Edit mode ALWAYS shows every photo as a thumbnail, even for an
       arranged project — otherwise the only way to reach a photo is to tap it on
       the floating layer, which is undiscoverable and can be off-screen on a phone.

       the tools bar. The free layout is shown while arranging and in view mode. */

    var ph='<div class="photo-grid"'+(arrangeMode?' style="visibility:hidden"':'')+'>';
    p.photos.forEach(function(photo,i){

    pg.querySelectorAll('[data-spec]').forEach(function(c){
      c.addEventListener('click',function(e){
        if(e.target&&e.target.getAttribute&&e.target.getAttribute('data-del'))return;
        var f=c.getAttribute('data-spec'), eid=c.getAttribute('data-eid');
        if(p.spec[f][eid])delete p.spec[f][eid]; else p.spec[f][eid]=1;
        renderPainting(); saveEdit();
      });
    });
    pg.querySelectorAll('[data-del]').forEach(function(x){
      x.addEventListener('click',function(e){
        e.stopPropagation();
        var pair=x.getAttribute('data-del').split(':');
        var f=pair[0], eid=pair[1];
        if(!twoTap('del'+eid,null)){toast('Tap ✕ again to remove it from every painting',1600);return;}
        state.specials[f]=(state.specials[f]||[]).filter(function(en){return en.id!==eid;});
        state.paintings.forEach(function(pp){if(pp.spec&&pp.spec[f])delete pp.spec[f][eid];});
        renderPainting(); saveEdit();
        toast('Removed from library',1100);
      });
    });
    pg.querySelectorAll('[data-edit]').forEach(function(b){
      b.addEventListener('click',function(){
        var f=b.getAttribute('data-edit');
        editFin[f]=!editFin[f];
        renderPainting();
      });
    });
    pg.querySelectorAll('[data-addbtn]').forEach(function(b){
      b.addEventListener('click',function(){
        var f=b.getAttribute('data-addbtn');
        var inp=pg.querySelector('input[data-addspec="'+f+'"]');
        var colInp=pg.querySelector('input[data-addcolor="'+f+'"]');
        var v=inp.value.trim();
        if(!v)return;
        if(!state.specials[f])state.specials[f]=[];
        var entry={id:uid('s'),text:v,color:(colInp?colInp.value:'')};
        state.specials[f].push(entry);
        p.spec[f][entry.id]=1;
        renderPainting(); saveEdit();
      });
    });
    pg.querySelectorAll('input[data-addspec]').forEach(function(inp){
      inp.addEventListener('keydown',function(e){
        if(e.key==='Enter'){
          var f=inp.getAttribute('data-addspec');
          pg.querySelector('[data-addbtn="'+f+'"]').click();
        }
      });
      /* if the typed code matches a DMC number, preview its real colour */
      inp.addEventListener('input',function(){
        var f=inp.getAttribute('data-addspec');
        var code=(inp.value||'').trim().split(/\s+/)[0];
        var colInp=pg.querySelector('input[data-addcolor="'+f+'"]');
        if(colInp&&DMCMAP[code])colInp.value=DMCMAP[code][2];
      });
    });

    /* delete painting */
    $('del').addEventListener('click',function(){
      if(!twoTap('delpaint',$('del'),'Tap again to delete'))return;
      var doomed=active();
      var doomedIdx=state.paintings.indexOf(doomed);
      deletePhotosKey(doomed.id); deletePaintKey(doomed.id);
      state.paintings=state.paintings.filter(function(x){return x.id!==doomed.id;});
      if(!state.paintings.length)state.paintings=[newPainting('Project 1')];
      state.active=state.paintings[0].id; state.view='paintings';
      resetTransient(); render(); save(); pushHistory(); replaceNav();
      trash.unshift({p:doomed,idx:doomedIdx}); if(trash.length>20)trash.pop();
      showUndo(doomed, doomedIdx);
    });
    renderGrid();
    if(showPaste)fillPasteBox();
    buildArrLayer(p);
  }
  function renderTabsOnly(){renderTabs();}

  function refreshPins(){
    var pinsEl=$('pins'); if(!pinsEl)return;
    var p=active();
    var selCodes=DMC.filter(function(r){return p.colors[r[0]];});
    if(!selCodes.length){pinsEl.innerHTML='';return;}
    pinsEl.innerHTML='<span class="pd-lbl" style="margin:0 4px 0 0;align-self:center;">Selected '+selCodes.length+':</span>'+
      selCodes.map(function(r){return '<span class="pin" data-code="'+r[0]+'"><span class="dot" style="background:'+r[2]+'"></span>'+esc(r[0])+' ✕</span>';}).join('');
    pinsEl.querySelectorAll('.pin').forEach(function(pn){pn.addEventListener('click',function(){
      delete active().colors[pn.getAttribute('data-code')]; updateMeta(); renderTabs(); renderGrid(); saveEdit();
    });});
  }
  function renderGrid(){
    var g=$('grid'); if(!g)return;
    var p=active(); var q=query.toLowerCase();
    var usedSet=usedColorSet();
    var shown=0, html='';
    DMC.forEach(function(row){
      var code=row[0], name=row[1], hex=row[2];
      var sel=!!p.colors[code];
      if(state.onlySel&&!sel)return;
      if(q&&code.toLowerCase().indexOf(q)===-1&&name.toLowerCase().indexOf(q)===-1)return;
      if(colorFamily&&FAMOF[code]!==colorFamily)return;
      shown++;
      /* the basket only says something new on colours this project doesn't use —
         on the ones it does it would be on every single selected card */
      var basket=(!sel&&hasLeftovers(code,usedSet))?' <span title="You have leftovers of this colour">🧺</span>':'';
      html+='<div class="card'+(sel?' sel':'')+'" data-code="'+code+'">'+
        '<div class="drill" style="background-color:'+hex+'"></div>'+
        '<div class="ctext"><div class="code">'+code+basket+'</div><div class="cname">'+esc(name)+'</div></div>'+
        '<div class="tick">✓</div></div>';
    });
    g.innerHTML=html;
    /* one delegated listener instead of one per card */
    g.onclick=function(e){
      var t=e.target;
      var c=(t&&t.closest)?t.closest('.card'):null;
      if(!c)return;
      var code=c.getAttribute('data-code'); if(!code)return;
      var pp=active();
      if(pp.colors[code]){delete pp.colors[code]; c.classList.remove('sel');}
      else {pp.colors[code]=1; c.classList.add('sel');}
      updateMeta(); renderTabs(); refreshPins(); saveEdit();
    };
    updateMeta(shown);
    refreshPins();
  }
  function updateMeta(shown){
    var g=$('grid'); if(!g)return;
    var p=active(); var n=Object.keys(p.colors).length;
    if(typeof shown==='undefined')shown=g.children.length;
    var cEl=$('count'); if(!cEl)return;
    cEl.textContent=p.name+': '+n+' color'+(n===1?'':'s')+' · showing '+shown+' of '+DMC.length;
    var e=$('emptyMsg');
    if(shown===0){
      e.style.display='block';
      e.textContent=(state.onlySel&&n===0)
        ? 'No colors marked for this painting yet. Turn off “Selected only” and tap the colors it uses.'
        : 'No colors match that search.';
    } else e.style.display='none';
    $('hint').textContent=state.onlySel?'':'Tap a color to mark it';
  }

  /* ---------- find page ---------- */
  function typeOk(p){return findType==='any'||p.type===findType;}
  function paintingsWith(code){
    return state.paintings.filter(function(p){return typeOk(p)&&!!p.colors[code];});
  }
  function paintingsWithSize(sz){
    return state.paintings.filter(function(p){return typeOk(p)&&p.size===sz;});
  }
  function paintingsWithSpec(f,eid){
    return state.paintings.filter(function(p){return typeOk(p)&&p.spec&&p.spec[f]&&!!p.spec[f][eid];});
  }
  function sortByRating(list){
    return list.slice().sort(function(a,b){
      var ra=(a.rating===null||a.rating===undefined||a.rating==='')?-1:Number(a.rating);
      var rb=(b.rating===null||b.rating===undefined||b.rating==='')?-1:Number(b.rating);
      return rb-ra;
    });
  }
  function expanderEl(headHtml,owners){
    var ex=document.createElement('div');
    ex.className='expander';
    ex.innerHTML='<div class="exp-head">'+headHtml+'</div>'+(owners.length?'<div class="exp-list"></div>':'');
    var listEl=ex.querySelector('.exp-list');
    sortByRating(owners).forEach(function(p){
      var it=document.createElement('div');
      it.className='exp-item';
      it.innerHTML='<span class="exp-name">'+esc(p.name)+'</span>'+ratingBadge(p)+badgeHtml(p.type);
      it.addEventListener('click',function(ev){
        ev.stopPropagation();
        navTo('paint',p.id);
      });
      listEl.appendChild(it);
    });
    return ex;
  }

  /* "Check a kit list": paste a kit's colour numbers and see, before buying,
     what you already own — nothing is added anywhere, it's just a report */
  function fillFindPasteBox(){
    var box=$('fPasteBox'); if(!box)return;
    var h='<div class="bk-note">Paste a kit’s colour numbers — commas, spaces or whole chart rows all work. '+
      'Nothing is added anywhere; you just get a report of what you already have.</div>'+
      '<textarea id="fPasteText" rows="3" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;background:var(--panel);color:var(--ink);" placeholder="e.g. 321, 310 700 3801 White — or a whole chart: 1 V 168  2 B 310 …">'+esc(findPasteText)+'</textarea>'+
      '<div class="bk-btns" style="margin-top:8px;">'+
        '<button class="chipbtn" id="fPasteCheck" type="button" style="background:var(--accent);border-color:var(--accent);color:#fff;">Check this kit</button>'+
        '<button class="chipbtn" id="fPasteClose" type="button">Close</button></div>';
    if(findPasteReview){
      var m=findPasteReview.matched;
      var usedSet=usedColorSet();
      var groups={fresh:[],stash:[],owned:[]};
      m.forEach(function(x){
        var owners=paintingsWith(x.code);
        var it={x:x,owners:owners.length};
        if(hasLeftovers(x.code,usedSet))groups.stash.push(it);
        else if(owners.length)groups.owned.push(it);
        else groups.fresh.push(it);
      });
      var fixed=findPasteReview.fixes||[];
      h+='<div class="bk-note" style="margin-top:10px;"><b>'+m.length+'</b> DMC number'+(m.length===1?'':'s')+' recognised · '+
        '🧺 '+groups.stash.length+' in your leftovers · '+groups.owned.length+' in your paintings · '+
        groups.fresh.length+' new to you'+
        (fixed.length?(' · '+fixed.length+' repaired'):'')+
        (findPasteReview.ignored?(' · '+findPasteReview.ignored+' row number'+(findPasteReview.ignored===1?'':'s')+'/symbol'+(findPasteReview.ignored===1?'':'s')+' skipped'):'')+'</div>';
      if(fixed.length)
        h+='<div class="bk-note" style="margin-top:6px;color:var(--star);font-weight:700;">⚠ Repaired misreads: '+
          fixed.map(esc).join(' · ')+' — check these against the kit’s chart.</div>';
      function cardsHtml(list){
        return '<div class="grid compact" style="margin-top:6px;">'+list.map(function(it){
          var row=DMCMAP[it.x.code];
          var sub=it.x.from?('⚠ read “'+esc(it.x.from)+'”'):esc(row[1]);
          return '<div class="card ro" style="'+(it.x.from?'border-color:var(--star);':'')+'">'+
            '<div class="drill" style="background-color:'+row[2]+'"></div>'+
            '<div class="ctext"><div class="code">'+row[0]+(hasLeftovers(row[0],usedSet)?' 🧺':'')+'</div><div class="cname"'+
              (it.x.from?' style="color:var(--star);font-weight:700;"':'')+'>'+sub+'</div></div>'+
            '<div class="pcount'+(it.owners?'':' zero')+'">'+it.owners+'</div></div>';
        }).join('')+'</div>';
      }
      if(findType!=='any')
        h+='<div class="bk-note" style="margin-top:4px;">Painting counts respect the '+TYPES[findType].sym+' '+TYPES[findType].label.toLowerCase()+' filter above — switch it to All to count every painting.</div>';
      if(groups.fresh.length)h+='<div class="section-lbl">🆕 New to you ('+groups.fresh.length+')</div>'+cardsHtml(groups.fresh);
      if(groups.stash.length)h+='<div class="section-lbl">🧺 In your leftovers ('+groups.stash.length+')</div>'+cardsHtml(groups.stash);
      if(groups.owned.length)h+='<div class="section-lbl">In your projects, but you marked them used up ('+groups.owned.length+')</div>'+cardsHtml(groups.owned);
      if(!m.length)h+='<div class="vw-empty" style="margin-top:8px;">No DMC numbers found in that text.</div>';
      if(findPasteReview.unknown.length)
        h+='<div class="bk-note" style="margin-top:8px;">Not recognised: '+findPasteReview.unknown.map(esc).join(', ')+'</div>';
    }
    box.innerHTML=h;
    var ta=$('fPasteText');
    if(ta)ta.addEventListener('input',function(e){findPasteText=e.target.value;});
    $('fPasteCheck').addEventListener('click',function(){
      findPasteReview=parsePasteText(findPasteText,{colors:{}});
      fillFindPasteBox();
    });
    $('fPasteClose').addEventListener('click',function(){
      findPaste=false; findPasteReview=null; findPasteText='';
      renderFind();
    });
  }

  function renderFindLists(){
    var q=findQuery.toLowerCase();
    var fs=$('fspecials'); fs.innerHTML='';

    /* "Leftovers only" is about colours, so the other sections step aside */
    var sizesShown=findStash?[]:state.sizes.filter(function(sz){
      return !q||sz.toLowerCase().indexOf(q)!==-1;
    });
    if(sizesShown.length){
      var slbl=document.createElement('div');
      slbl.className='section-lbl'; slbl.textContent='Sizes (cm)';
      fs.appendChild(slbl);
      var sgrid=document.createElement('div'); sgrid.className='grid';
      sizesShown.forEach(function(sz){
        var owners=paintingsWithSize(sz);
        var c=document.createElement('div');
        c.className='card'+(expandedSize===sz?' open':'');
        c.innerHTML='<div class="drill spec" style="background-color:var(--ink);font-size:11px;">▭</div>'+
          '<div class="ctext"><div class="code">'+esc(sz)+'</div><div class="cname">size</div></div>'+
          '<div class="pcount'+(owners.length?'':' zero')+'">'+owners.length+'</div>';
        c.addEventListener('click',function(){
          expandedSize=(expandedSize===sz)?null:sz; expandedColor=null; expandedSpec=null; expandedMedia=null;
          renderFindLists();
        });
        sgrid.appendChild(c);
        if(expandedSize===sz){
          var typeTxt=(findType!=='any')?(' ('+TYPES[findType].sym+' '+TYPES[findType].label.toLowerCase()+' only)'):'';
          var head=owners.length
            ? esc(sz)+' cm: '+owners.length+' project'+(owners.length===1?'':'s')+typeTxt+':'
            : 'No projects are '+esc(sz)+' cm'+typeTxt+'.';
          sgrid.appendChild(expanderEl(head,owners));
        }
      });
      fs.appendChild(sgrid);
    }

    /* media & tools — spans paint-by-number and drawings, so the diamond-type
       filter above doesn't apply to it */
    var mediaShown=findStash?[]:state.media.filter(function(m){return !q||m.toLowerCase().indexOf(q)!==-1;})
      .filter(function(m){return state.paintings.some(function(p){return p.media&&p.media[m];});});
    if(mediaShown.length){
      var mlbl=document.createElement('div');
      mlbl.className='section-lbl'; mlbl.textContent='Media & tools';
      fs.appendChild(mlbl);
      var mgrid=document.createElement('div'); mgrid.className='grid';
      mediaShown.forEach(function(m){
        var owners=state.paintings.filter(function(p){return p.media&&p.media[m];});
        var c=document.createElement('div');
        c.className='card'+(expandedMedia===m?' open':'');
        c.innerHTML='<div class="drill spec" style="background-color:var(--accent);font-size:12px;">🖌</div>'+
          '<div class="ctext"><div class="code">'+esc(m)+'</div><div class="cname">media</div></div>'+
          '<div class="pcount'+(owners.length?'':' zero')+'">'+owners.length+'</div>';
        c.addEventListener('click',function(){
          expandedMedia=(expandedMedia===m)?null:m; expandedColor=null; expandedSpec=null; expandedSize=null;
          renderFindLists();
        });
        mgrid.appendChild(c);
        if(expandedMedia===m){
          var head=esc(m)+' — '+owners.length+' project'+(owners.length===1?'':'s')+':';
          mgrid.appendChild(expanderEl(head,owners));
        }
      });
      fs.appendChild(mgrid);
    }

    /* specials sections */
    FINISHES.forEach(function(f){
      var lib=findStash?[]:(state.specials[f.id]||[]).filter(function(en){
        return !q||en.text.toLowerCase().indexOf(q)!==-1;
      });
      if(!lib.length)return;
      var lbl=document.createElement('div');
      lbl.className='section-lbl'; lbl.style.color=f.fg;
      lbl.textContent=f.label+' special diamonds';
      fs.appendChild(lbl);
      var grid=document.createElement('div'); grid.className='grid';
      lib.forEach(function(entry){
        var owners=paintingsWithSpec(f.id,entry.id);
        var kid=f.id+'|'+entry.id;
        var c=document.createElement('div');
        c.className='card'+(expandedSpec===kid?' open':'');
        c.innerHTML=specCardHtml(f.id,entry,'<div class="pcount'+(owners.length?'':' zero')+'">'+owners.length+'</div>');
        c.addEventListener('click',function(){
          expandedSpec=(expandedSpec===kid)?null:kid; expandedColor=null; expandedSize=null;
          renderFindLists();
        });
        grid.appendChild(c);
        if(expandedSpec===kid){
          var typeTxt=(findType!=='any')?(' ('+TYPES[findType].sym+' '+TYPES[findType].label.toLowerCase()+' only)'):'';
          var head=owners.length
            ? esc(entry.text)+' ('+f.label+') is in '+owners.length+' painting'+(owners.length===1?'':'s')+typeTxt+':'
            : esc(entry.text)+' ('+f.label+') isn’t in any of your paintings'+typeTxt+'.';
          grid.appendChild(expanderEl(head,owners));
        }
      });
      fs.appendChild(grid);
    });

    /* colors grid — one pass over the paintings builds a code -> owners map,
       instead of re-scanning every painting for every one of the 454 colors */
    var g=$('fgrid'); g.innerHTML='';
    var ownersByCode={};
    state.paintings.forEach(function(p){
      if(!typeOk(p))return;
      Object.keys(p.colors||{}).forEach(function(c){(ownersByCode[c]=ownersByCode[c]||[]).push(p);});
    });
    var usedSet=usedColorSet();
    var shown=0; var frag=document.createDocumentFragment();
    DMC.forEach(function(row){
      var code=row[0], name=row[1], hex=row[2];
      if(q&&code.toLowerCase().indexOf(q)===-1&&name.toLowerCase().indexOf(q)===-1)return;
      var got=hasLeftovers(code,usedSet);
      if(findStash&&!got)return;
      shown++;
      var owners=ownersByCode[code]||[];
      var c=document.createElement('div');
      c.className='card'+(expandedColor===code?' open':'');
      c.setAttribute('data-code',code);
      c.innerHTML='<div class="drill" style="background-color:'+hex+'"></div>'+
        '<div class="ctext"><div class="code">'+code+(got?' <span title="You have leftovers of this colour">🧺</span>':'')+'</div><div class="cname">'+esc(name)+'</div></div>'+
        '<div class="pcount'+(owners.length?'':' zero')+'">'+owners.length+'</div>';
      frag.appendChild(c);
      if(expandedColor===code){
        var typeTxt=(findType!=='any')?(' ('+TYPES[findType].sym+' '+TYPES[findType].label.toLowerCase()+' only)'):'';
        var head=owners.length
          ? code+' '+esc(name)+' is in '+owners.length+' painting'+(owners.length===1?'':'s')+typeTxt+':'
          : code+' '+esc(name)+' isn’t in any of your paintings'+typeTxt+'.';
        var ex=expanderEl(head,owners);
        var sb=document.createElement('button');
        sb.type='button';
        sb.className='chipbtn'+(got?' on':'');
        sb.style.marginTop='8px';
        var byDefault=(state.stash[code]===undefined);
        sb.textContent=got
          ? (byDefault?'🧺 In your leftovers (it’s in your projects) — tap if used up':'🧺 In your leftovers — tap if used up')
          : (byDefault?'🧺 I have leftovers of this':'🧺 Marked used up — tap if you have some again');
        sb.addEventListener('click',function(ev){
          ev.stopPropagation();
          toggleLeftovers(code);
          save(); pushHistory(); renderFindLists();
        });
        ex.appendChild(sb);
        frag.appendChild(ex);
      }
    });
    g.appendChild(frag);
    g.onclick=function(e){
      var t=e.target;
      var c=(t&&t.closest)?t.closest('.card'):null;
      if(!c)return;
      var code=c.getAttribute('data-code'); if(!code)return;
      expandedColor=(expandedColor===code)?null:code; expandedSpec=null; expandedSize=null;
      renderFindLists();
    };
    var inAny=0;
    Object.keys(ownersByCode).forEach(function(k){if(DMCMAP[k])inAny++;});
    var inStash=0;
    DMC.forEach(function(r){if(hasLeftovers(r[0],usedSet))inStash++;});
    $('fmeta').textContent='Showing '+shown+' of '+DMC.length+' colors · '+inAny+' are in your paintings'+
      (findType!=='any'?' ('+TYPES[findType].label.toLowerCase()+')':'')+
      (inStash?' · 🧺 '+inStash+' in your leftovers':'');
    var e=$('femptyMsg');
    if(shown===0&&(findStash||!$('fspecials').children.length)){
      e.style.display='block';
      e.textContent=findStash
        ? (inStash?'No leftover colours match that search.':'No leftovers yet — colours used in your projects count automatically, or tap a colour and say you have some.')
        : 'Nothing matches that search.';
    }
    else e.style.display='none';
  }

  /* ---------- root ---------- */
  function applyTheme(){
    var app=$('app'); if(app)app.classList.toggle('dark',!!state.dark);
    try{localStorage.setItem('dpTheme',state.dark?'dark':'light');}catch(e){}
    /* the boot hint has done its job — its !important would otherwise override
       switching back to light mode */
    var boot=document.getElementById('themeBoot'); if(boot)boot.remove();
    try{
      var a=ACCENTMAP[state.accent]||ACCENTMAP.violet;
      if(app){app.style.setProperty('--accent',a.accent);app.style.setProperty('--accent-soft',state.dark?a.dsoft:a.soft);}
      document.documentElement.style.background=state.dark?'#16141B':'#F3F2F5';
      if(document.body)document.body.style.background=state.dark?'#16141B':'#F3F2F5';
      var mt=document.querySelector('meta[name="theme-color"]'); if(mt)mt.setAttribute('content',state.dark?'#16141B':'#F3F2F5');
    }catch(e){}
  }
  function render(){
    applyTheme();
    var pgEl=$('page'); if(pgEl)pgEl.style.paddingBottom='';
    renderTabs();
    if(state.view==='overview')renderOverview();
    else if(state.view==='paintings')renderPaintings();
    else if(state.view==='find')renderFind();
    else renderPainting();
  }

  $('fileInput').addEventListener('change',function(e){
    var files=e.target.files||[];
    if(chartPick){chartPick=false;if(files[0])setChartImage(files[0]);e.target.value='';return;}
    var pid=active().id;
    for(var i=0;i<files.length;i++)addImageFile(files[i],pid);
    e.target.value='';
  });

  /* keyboard: Ctrl/Cmd+Z = undo, Ctrl/Cmd+Shift+Z or Ctrl+Y = redo */
  document.addEventListener('keydown',function(e){
    if(!(e.ctrlKey||e.metaKey))return;
    var k=(e.key||'').toLowerCase();
    var ae=document.activeElement;
    if(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&k==='z')return; /* let inputs do their own undo */
    if(k==='z'&&!e.shiftKey){e.preventDefault();doUndo();}
    else if((k==='z'&&e.shiftKey)||k==='y'){e.preventDefault();doRedo();}
  });

  /* pull newer cloud changes when the tab regains focus;
     push any batched photo uploads before the tab goes away */
  document.addEventListener('visibilitychange',function(){if(document.hidden)flushCloud();else syncNow();});
  window.addEventListener('focus',function(){syncNow();});
  window.addEventListener('online',function(){syncNow();});
  window.addEventListener('pagehide',function(){flushCloud();});

  /* keep arranged photos in place when the window is resized or rotated */
  var resizeT=null;
  window.addEventListener('resize',function(){
    if(state.view!=='paint')return;
    clearTimeout(resizeT);
    resizeT=setTimeout(function(){
      var p=active();
      if(p&&(p.arranged||arrangeMode))buildArrLayer(p);
    },200);
  });

  load(function(){render();replaceNav();});
})();
</script>

<script>
  /* installable + offline app (PWA) */
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>

</body>
</html>
