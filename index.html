    if($('chartAdd'))$('chartAdd').addEventListener('click',function(){chartPick=true;$('fileInput').click();});
    if($('chartClear'))$('chartClear').addEventListener('click',function(){chartImg=null;fillPasteBox();});
    if($('chartImgEl'))$('chartImgEl').addEventListener('click',function(){openLightbox(chartImg);});
    if($('pasteCheck'))$('pasteCheck').addEventListener('click',function(){
      pasteReview=parsePasteText(pasteTextVal,p);
      fillPasteBox();
    });
    if($('pasteBack'))$('pasteBack').addEventListener('click',function(){pasteReview=null;fillPasteBox();});
    box.querySelectorAll('[data-rev]').forEach(function(c){
      c.addEventListener('click',function(){
        var x=pasteReview.matched[parseInt(c.getAttribute('data-rev'),10)];
        if(!x||x.already)return;
        x.on=!x.on; fillPasteBox();
      });
    });
    if($('pasteConfirm'))$('pasteConfirm').addEventListener('click',function(){
      var added=0;
      pasteReview.matched.forEach(function(x){
        if(x.on&&!p.colors[x.code]){p.colors[x.code]=1;added++;}
      });
      if(!added){toast('Nothing ticked',1200);return;}
      showPaste=false; pasteReview=null; pasteTextVal=''; chartImg=null;
      renderPainting(); renderTabs(); saveEdit();
      toast('Added '+added+' colour'+(added===1?'':'s')+' ✓',1600);
    });
    box.querySelectorAll('#pasteCancel').forEach(function(b){
      b.addEventListener('click',function(){
        showPaste=false; pasteReview=null; pasteTextVal=''; chartImg=null;
        renderPainting();
      });

  /* ---------- painting page: view mode ----------
     Everything the painting actually has, laid out neatly and read-only.
     Empty fields are left out entirely. Photos can still be moved. */
  function viewRow(lbl,val){
    return val?('<div class="vw-row"><span class="vw-lbl">'+lbl+'</span><span class="vw-val">'+val+'</span></div>'):'';
  }
  function renderPaintingView(p){
    var pg=$('page');
    /* the first two photos are anchored: Sold on the left, Result on the right.
       Everything from the third on floats freely (see buildArrLayer). */
    var frame='frame-'+(p.frame||'landscape');
    function sideHtml(i,label){
      var photo=p.photos[i]; if(!photo)return '';
      return '<div class="vw-side '+frame+'"><span class="pg-lbl">'+label+'</span>'+
        '<img data-i="'+i+'" src="'+photo.d+'" alt="'+esc(label)+' picture" style="'+photoStyle(photo)+'"></div>';
    }
    var tagKeys=Object.keys(p.tags||{});
    var fins=finTagsHtml(p);
    /* the same rule as the list: a full-width bar reading 100% under a project
       already badged “Finished” said the same thing twice, loudly */
    var pv=progHtml(p);
    var prog=pv?('<div class="ovprogrow">'+pv+'</div>'):'';
    var kd=kindOf(p), isDraw=(kd==='drawing');
    var rows=(kd!=='drawing'?viewRow('Kit code',esc(p.code||'')):'')+
      viewRow('Size',p.size?(esc(p.size)+' cm'):'')+
      (kd!=='drawing'?viewRow('Price',esc(p.price||'')):'')+
      (kd!=='drawing'?viewRow('Seller',esc(p.seller||'')):'')+
      viewRow('Started',esc(p.started||''))+
      viewRow('Finished',esc(p.finished||''));
    var med=Object.keys(p.media||{});
    var mediaHtml=(usesMedia(p)&&med.length)
      ? '<div class="ovtags">'+med.map(function(m){return '<span class="ovtag">'+esc(m)+'</span>';}).join('')+'</div>' : '';
    var notesHtml=p.notes
      ? '<div class="vw-row" style="display:block;margin-top:8px;"><span class="vw-lbl" style="display:block;">Notes</span>'+
        '<span class="vw-val" style="white-space:pre-wrap;">'+esc(p.notes)+'</span></div>' : '';

    /* the big picture for a drawing, with every other photo in a gallery below */
    function heroStyle(photo){
      var fit=photo.fit||'contain';
      var px=(photo.posX==null?50:photo.posX),py=(photo.posY==null?50:photo.posY);
      return 'object-fit:'+fit+';object-position:'+px+'% '+py+'%;'+(photo.flip?'transform:scaleX(-1);':'');

    var galleryHtml='';

            (ph.c?'<span class="vw-gcap">'+esc(ph.c)+'</span>':'')+

        ? '<div class="grid compact">'+sel.map(function(r){

              '<div class="ctext"><div class="code">'+r[0]+'</div><div class="cname">'+esc(r[1])+'</div></div></div>';
          }).join('')+'</div>'

    } else if(kd==='pbn'&&(p.palette||[]).length){

            '<div class="ctext"><div class="code">'+esc(en.label||('Colour '+(i+1)))+'</div>'+
            '<div class="cname">'+esc(en.color||'')+'</div></div></div>';
        }).join('')+'</div>';

      if(!(f.id in p.spec))return;

      if(!chosen.length)return;

          '<button class="chipbtn" id="shareBtn" type="button" title="Turn this project into one picture to share">📤 Share</button>'+
          (p.photos.length>1?'<button class="chipbtn" id="cmpBtn" type="button" title="See both pictures enlarged, side by side">⇔ Compare</button>':'')+
          (!isDraw&&p.photos.length>2?('<button class="chipbtn'+(arrangeMode?' on':'')+'" id="arrEnter2" type="button">'+(arrangeMode?'✓ Done':'⇱ Move images')+'</button>'):'')+

        var i=parseInt(im.getAttribute('data-i'),10);
        var ph=(i>=0&&p.photos[i])?p.photos[i]:null;
        openLightbox(ph?ph.d:im.src,ph?(ph.c||''):'');

  /* ---------- painting page ---------- */
  function renderPainting(){
    var p=active();
    /* belt and braces: a record arriving from an old backup or an older device
       mustn't be able to blank the page on a missing field */
    if(!p.media)p.media={};
    if(!p.palette)p.palette=[];
    if(p.edit===false){renderPaintingView(p);return;}
    var pg=$('page');

    /* Photos block. Edit mode ALWAYS shows every photo as a thumbnail, even for an
       arranged project — otherwise the only way to reach a photo is to tap it on
       the floating layer, which is undiscoverable and can be off-screen on a phone.
       Each thumbnail carries its own ✕ so removing one doesn't depend on finding
       the tools bar. The free layout is shown while arranging and in view mode. */
    var lbls=coverLabels(p);
    var ph='<div class="photo-grid"'+(arrangeMode?' style="visibility:hidden"':'')+'>';
    p.photos.forEach(function(photo,i){
      var lbl=(lbls[i]?'<span class="pg-lbl">'+lbls[i]+'</span>':'');
      ph+='<div class="pg-item">'+lbl+
        '<img class="photo-s'+(photo.s||1)+(i===selPhoto?' psel':'')+'" data-i="'+i+'" src="'+thumbSrc(photo)+'" alt="'+esc(photoLabel(p,i))+'" role="button" tabindex="0" style="'+photoStyle(photo)+'">'+
        '<div class="delx" data-photox="'+i+'" role="button" tabindex="0" title="Remove this photo" aria-label="Remove this photo">✕</div></div>';
    });
    ph+='</div>';
    ph+='<div class="photo-btns"><button class="pbtn" id="phAdd" type="button">＋ Add photo</button>'+
      (p.photos.length>1?'<button class="pbtn" id="cmpBtn" type="button" title="See both pictures enlarged, side by side">⇔ Compare</button>':'')+
      (p.photos.length?('<button class="pbtn'+(arrangeMode?' on':'')+'" id="arrEnter" type="button">'+(arrangeMode?'✓ Done arranging':'⇱ Arrange &amp; edit')+'</button>'):'')+
      '<button class="pbtn" id="phCheck" type="button" title="Why did a photo come out black or refuse to load?">🩺 Photo check</button></div>';
    ph+='<div class="photo-hint">'+(p.photos.length
      ? ('Tap a photo for its tools in the bar at the top, or its <b>✕</b> to remove it. '+
         (kindOf(p)==='drawing'
           ? 'The 1st photo is the big one on the project page; the rest become its gallery.'
           : 'The 1st photo shows as “Sold”, the 2nd as “Result” on the cards.')+
         ' Use ⇱ Arrange &amp; edit to place photos freely anywhere on this page.')
      : 'Add photos — on PC you can also paste (Ctrl+V) a copied image.'+(kindOf(p)==='drawing'
           ? ' The first becomes the big picture, the rest a gallery.'
           : ' The first two become the “Sold” and “Result” pictures on cards.'))+'</div>';
    if(arrangeMode)ph+=arrangeUiHtml(p); /* fixed bottom bar — takes no space in the flow */

    /* Photo tools + card frame live in the sticky top bar, so photos placed on the
       page can never cover them (and they never cover your photos either). */
    var toolsHtml='';
    if(!arrangeMode&&p.photos.length){
      toolsHtml+='<div class="photo-tools">';
      if(selPhoto>=0&&selPhoto<p.photos.length){
        var selP=p.photos[selPhoto];
        var isCover=((selP.fit||'cover')!=='contain');
        toolsHtml+='<div class="pt-row">'+
          '<div class="photo-preview frame-'+(p.frame||'landscape')+'"><span class="pv-lbl">Card</span><img src="'+thumbSrc(selP)+'" alt="How this photo sits on the card" style="'+photoStyle(selP)+'"></div>'+
          '<div class="pt-btns">'+
            '<div class="photo-btns">'+
              '<button class="pbtn'+(isCover?' on':'')+'" id="phFit" type="button">'+(isCover?'▣ Fill (crop)':'▤ Whole image')+'</button>'+
              '<button class="pbtn'+(selP.flip?' on':'')+'" id="phFlip" type="button">⇄ Flip</button>'+
              (isCover?('<button class="pbtn" id="phPanL" type="button" aria-label="Show more of the left side">←</button>'+
                        '<button class="pbtn" id="phPanU" type="button" aria-label="Show more of the top">↑</button>'+
                        '<button class="pbtn" id="phPanD" type="button" aria-label="Show more of the bottom">↓</button>'+
                        '<button class="pbtn" id="phPanR" type="button" aria-label="Show more of the right side">→</button>'):'')+

              '<button class="pbtn" id="phBigger" type="button">＋ Bigger</button>'+
            '</div>'+
            '<div class="photo-btns">'+
              '<button class="pbtn" id="phSold" type="button">★ Sold (1st)</button>'+
              '<button class="pbtn" id="phResult" type="button">★ Result (2nd)</button>'+
              '<button class="pbtn" id="phLeft" type="button" aria-label="Move this photo earlier">◀ order</button>'+
              '<button class="pbtn" id="phRight" type="button" aria-label="Move this photo later">order ▶</button>'+
              '<button class="pbtn danger" id="phDel" type="button">✕ remove</button>'+

            '</div>'+
            (selP.ts?'<div class="photo-hint" style="margin-top:2px;">Added '+fmtDate(selP.ts)+(selP.c?'':' — a caption shows on the project page’s gallery and when the photo opens big')+'</div>':'')+
          '</div>'+
        '</div>';
      }
      toolsHtml+='<div class="ovsort" style="margin-top:4px;"><span class="pd-lbl" style="margin:0">Card frame:</span>'+
        '<button class="chipbtn'+(p.frame==='landscape'?' on':'')+'" data-frame="landscape" type="button">▭ Landscape</button>'+
        '<button class="chipbtn'+(p.frame==='portrait'?' on':'')+'" data-frame="portrait" type="button">▯ Portrait</button>'+
        '<button class="chipbtn'+(p.frame==='square'?' on':'')+'" data-frame="square" type="button">◻ Square</button>'+
        '<button class="chipbtn'+(p.frame==='round'?' on':'')+'" data-frame="round" type="button">◯ Round</button>'+
      '</div>';
      toolsHtml+='</div>';
    }

    var kd=kindOf(p);
    /* kind selector — switching only shows/hides sections, nothing is discarded */
    var kindChips=KINDS.map(function(k){
      return '<button class="selchip'+(kd===k.id?' on':'')+'" data-setkind="'+k.id+'" type="button">'+k.sym+' '+k.label+'</button>';
    }).join('');

    /* size / seller / tag chips — in "edit list" mode tapping a chip removes it */
    function listEditBtn(key,has){
      return has?(' <button class="fb-edit" data-editlist="'+key+'" type="button">'+(editLists[key]?'done':'edit list')+'</button>'):'';

    /* the good ones first, the bad ones under them, and the words that are only

    var tgEdit=!!editLists.tag, tagChips='';
    var GROUPS=[[1,'Good ＋1 each','tg-pos'],[-1,'Bad −1 each','tg-neg'],[0,'Just describing (no effect)','tg-plain']];
    GROUPS.forEach(function(g){
      var list=state.tags.filter(function(tg){return tagSign(tg)===g[0];});
      if(!list.length&&!(tgEdit&&g[0]===0))return;
      tagChips+='<div class="tg-row"><span class="tg-lbl '+g[2]+'">'+g[1]+'</span>';
      list.forEach(function(tg){
        var on=!!p.tags[tg];
        tagChips+='<button class="selchip '+g[2]+(on&&!tgEdit?' on':'')+'" data-tag="'+esc(tg)+'" type="button">'+
          (tgEdit?'<span class="tg-x" data-rmtag="'+esc(tg)+'">✕</span> ':'')+esc(tg)+'</button>';
      });
      tagChips+='</div>';
    });
    tagChips+='<div class="tg-row"><span class="addinline"><input id="newTag" type="text" maxlength="40" placeholder="＋ new tag"><button class="pbtn" id="addTag" type="button">Add</button></span>'+
      (tgEdit?'<span class="fb-hint" style="flex:1 1 100%;margin-top:4px;">Tap a tag to move it: describing → good ＋ → bad − → describing. Tap its ✕ to remove it from the list and from every project.</span>':'')+'</div>';

    /* media & tools — shared by paint-by-number and drawings */
    var mdEdit=!!editLists.media, mediaChips='';
    state.media.forEach(function(m){
      var on=!!p.media[m];
      mediaChips+='<button class="selchip'+(on&&!mdEdit?' on':'')+'" data-media="'+esc(m)+'" type="button"'+(mdEdit?rmStyle:'')+'>'+(mdEdit?'✕ ':'')+esc(m)+'</button>';
    });
    mediaChips+='<span class="addinline"><input id="newMedia" type="text" maxlength="40" placeholder="＋ new medium"><button class="pbtn" id="addMedia" type="button">Add</button></span>';

    /* paint-by-number palette: pots have no standard code, so colours are picked by eye */
    var paletteHtml='';
    if(kd==='pbn'){
      var sw=(p.palette||[]).map(function(en,i){
        return '<div class="card ro" style="padding:6px;">'+
          '<div class="drill" style="background-color:'+esc(en.color||'#cccccc')+'"></div>'+
          '<div class="ctext"><div class="code">'+esc(en.label||('Colour '+(i+1)))+'</div>'+

      }).join('');
      paletteHtml='<div class="finbox">'+
        '<div class="fb-top"><span class="fb-lbl">Colours in this kit'+((p.palette||[]).length?(' ('+p.palette.length+')'):'')+'</span></div>'+
        (sw?'<div class="fb-chips">'+sw+'</div>':'')+
        '<div class="fb-addrow">'+
          '<input type="text" id="palLabel" maxlength="40" placeholder="e.g. 7 — dark green">'+
          '<input type="color" id="palColor" value="#7BAC94" title="Pick the colour by eye" style="width:40px;height:38px;flex:0 0 auto;padding:2px;border:1.5px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;">'+
          '<button class="pbtn" id="palAdd" type="button">Add</button>'+
        '</div>'+
        '<div class="fb-hint">Paint-by-number pots have no standard colour code, so match the colour by eye and label it however the kit numbers them. This palette belongs to this project only.</div>'+
        '</div>';
    }

    var notesRow='<div class="pd-row"><div class="pd-lbl">Notes</div>'+
      '<textarea id="notesInput" rows="2" placeholder="Anything worth remembering…" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--panel);color:var(--ink);outline:none;resize:vertical;">'+esc(p.notes||'')+'</textarea></div>';

    /* status chips */
    var statusChips='';
    STATUSES.forEach(function(s){
      var on=(p.status===s.id);
      statusChips+='<button class="selchip'+(on?' on':'')+'" data-status="'+s.id+'" type="button" style="'+(on?('background:'+s.fg+';border-color:'+s.fg+';color:#fff;'):('color:'+s.fg+';'))+'">'+s.label+'</button>';
    });
    var dateInputs='<label class="datefield">Started <input id="startedDate" type="date" value="'+esc(p.started||'')+'"></label>'+
      '<label class="datefield">Finished <input id="finishedDate" type="date" value="'+esc(p.finished||'')+'"></label>';

    /* finish chips */
    var finChips='';
    FINISHES.forEach(function(f){
      var on=(f.id in p.spec);
      finChips+='<button class="fbtn" data-f="'+f.id+'" type="button" style="'+
        (on?('background:'+f.fg+';border-color:'+f.fg+';color:#fff;'):('color:'+f.fg+';'))+'">'+f.label+'</button>';
    });

    /* finish boxes: shared library chips + add input */
    var finBoxes='';
    FINISHES.forEach(function(f){
      if(!(f.id in p.spec))return;
      var lib=state.specials[f.id]||[];
      var chips='';
      lib.forEach(function(entry){
        var on=!!p.spec[f.id][entry.id];
        chips+='<div class="card'+(on?' sel':'')+'" data-spec="'+f.id+'" data-eid="'+entry.id+'" role="button" tabindex="0" aria-pressed="'+(on?'true':'false')+'" aria-label="'+esc(entry.text)+'" style="padding:6px;">'+
          specCardHtml(f.id,entry,'<div class="tick">✓</div>'+(editFin[f.id]?'<div class="delx" data-del="'+f.id+':'+entry.id+'" role="button" tabindex="0" title="Remove from library" aria-label="Remove from library">✕</div>':''))+
          '</div>';
      });
      finBoxes+='<div class="finbox">'+
        '<div class="fb-top"><span class="fb-lbl" style="color:'+f.fg+'">'+f.label+' diamonds</span>'+
        (lib.length?'<button class="fb-edit" data-edit="'+f.id+'" type="button">'+(editFin[f.id]?'done':'edit list')+'</button>':'')+
        '</div>'+
        (chips?'<div class="fb-chips">'+chips+'</div>':'')+
        '<div class="fb-addrow"><input type="text" data-addspec="'+f.id+'" maxlength="60" placeholder="e.g. 550 Blue">'+
        '<input type="color" data-addcolor="'+f.id+'" value="'+f.fg+'" title="Pick this diamond’s colour" style="width:40px;height:38px;flex:0 0 auto;padding:2px;border:1.5px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;">'+
        '<button class="pbtn" data-addbtn="'+f.id+'" type="button">Add</button></div>'+
        '<div class="fb-hint">Type a number + name, pick its colour, and Add — it becomes a tap-to-select diamond here, in every other painting’s '+f.label+' list, and in Find.'+
        (p.finishes[f.id]?' Old note: “'+esc(p.finishes[f.id])+'”':'')+'</div>'+
        '</div>';
    });

    pg.innerHTML=
      '<div class="paint-sticky">'+
        '<div class="paint-head">'+
          '<button class="chipbtn" id="backPaints" type="button" style="font-weight:700;">← All</button>'+
          '<span style="font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto;">'+esc(p.name)+'</span>'+
          (p.arranged&&!arrangeMode?'<button class="chipbtn" id="arrEnter2" type="button" title="Arrange &amp; edit photos">⇱ Arrange</button>':'')+
          '<button class="chipbtn" id="modeToggle" type="button" title="Switch to view mode">👁 View</button>'+
          '<button class="chipbtn" id="undoBtn2" type="button" title="Undo" aria-label="Undo">↶</button>'+
          '<button class="chipbtn" id="redoBtn2" type="button" title="Redo" aria-label="Redo">↷</button>'+
        '</div>'+
        toolsHtml+
      '</div>'+
      '<div id="pageBody">'+
      '<div class="phead">'+
        '<div class="photos">'+ph+'</div>'+
        '<div class="pdetails">'+
          '<div class="pd-name">'+esc(p.name)+'</div>'+
          '<div class="pd-row"><div class="pd-lbl">Kind of project</div><div class="selchips">'+kindChips+'</div></div>'+
          '<div class="pd-row"><div class="pd-lbl">Status</div><div class="selchips">'+statusChips+'</div></div>'+
          (kd!=='drawing'?('<div class="pd-row"><div class="pd-lbl">Kit code</div>'+
            '<input class="codeinput" id="kitCode" type="text" maxlength="60" placeholder="e.g. DP-4471, seller\u2019s article nr\u2026" value="'+esc(p.code||'')+'"></div>'):'')+
          '<div class="pd-row"><div class="pd-lbl">Size (cm)'+listEditBtn('size',state.sizes.length)+'</div><div class="selchips">'+sizeChips+'</div></div>'+
          '<div class="pd-row"><div class="pd-lbl">Rating (0–10)</div>'+
            '<div class="rating-row"><input id="rating" type="number" min="0" max="10" step="0.1" inputmode="decimal" placeholder="'+
              (autoRating(p)===null?'—':String(autoRating(p)))+'" value="'+(p.ratingOwn&&p.rating!==null?p.rating:'')+'">'+
              '<span id="ratingBadge">'+ratingBadge(p)+'</span>'+

          (kd!=='drawing'?('<div class="pd-row"><div class="pd-lbl">Price</div><input class="codeinput" id="priceInput" type="text" maxlength="20" placeholder="e.g. €25 or 25" value="'+esc(p.price||'')+'"></div>'):'')+
          '<div class="pd-row"><div class="pd-lbl">Dates</div><div class="selchips" style="gap:10px;">'+dateInputs+'</div></div>'+
          (kd!=='drawing'?('<div class="pd-row"><div class="pd-lbl">Seller'+listEditBtn('seller',state.sellers.length)+'</div><div class="selchips">'+sellerChips+'</div></div>'):'')+
          (usesMedia(p)?('<div class="pd-row"><div class="pd-lbl">Media &amp; tools'+listEditBtn('media',state.media.length)+'</div><div class="selchips">'+mediaChips+'</div></div>'):'')+
          '<div class="pd-row"><div class="pd-lbl">Tags'+listEditBtn('tag',state.tags.length)+'</div><div class="selchips">'+tagChips+'</div></div>'+
          notesRow+
        '</div>'+
      '</div>'+
      '<div class="toolbar">'+
        '<label class="search">🔎<input id="q" type="text" inputmode="search" placeholder="Search number or name…" value="'+esc(query)+'"></label>'+
        (isDiamond(p)?('<button class="chipbtn'+(state.onlySel?' on':'')+'" id="onlySel" type="button">Selected only</button>'+
        '<button class="chipbtn" id="pasteList" type="button">＋ Paste list</button>'+
        '<button class="chipbtn" id="copyColors" type="button">⧉ Copy colours</button>'):'')+
        '<button class="chipbtn" id="rename" type="button">Rename</button>'+

        '<button class="chipbtn" id="moveDown" type="button" title="Move later in the list" aria-label="Move later in the list">↓</button>'+
        '<button class="chipbtn danger" id="del" type="button">Delete</button>'+
      '</div>'+

        '<button class="chipbtn" id="renameCancel" type="button">Cancel</button>'+
      '</div>'+
      paletteHtml+
      (isDiamond(p)?(
        '<div class="typerow"><span class="lbl">Diamond type:</span>'+
          '<button class="tbtn sq'+(p.type==='square'?' on':'')+'" data-t="square" type="button">■ Square</button>'+

        finBoxes+
        (showPaste?'<div class="backup" id="pasteBox"></div>':'')+
        '<div class="ovsort" style="margin-top:2px;"><span class="pd-lbl" style="margin:0">Colours:</span>'+
          '<button class="chipbtn'+(colorFamily===''?' on':'')+'" data-fam="" type="button">All</button>'+
          COLOR_FAMILIES.map(function(fm){return '<button class="chipbtn'+(colorFamily===fm?' on':'')+'" data-fam="'+fm+'" type="button">'+fm+'</button>';}).join('')+
        '</div>'+
        '<div class="pins" id="pins"></div>'+
        '<div class="meta"><span id="count"></span><span id="hint"></span></div>'+
        '<div class="grid" id="grid"></div>'+
        '<div class="empty" id="emptyMsg" style="display:none"></div>'
      ):'')+
      '</div>';

    $('backPaints').addEventListener('click',function(){navTo('paintings');});

    if($('redoBtn2'))$('redoBtn2').addEventListener('click',doRedo);

    pg.querySelectorAll('[data-frame]').forEach(function(b){
      b.addEventListener('click',function(){p.frame=b.getAttribute('data-frame');renderPainting();saveEdit();});
    });

    /* progress + price */
    if($('progRange'))$('progRange').addEventListener('input',function(e){
      p.progress=parseInt(e.target.value,10)||0;
      var pv=$('progVal');if(pv)pv.textContent=p.progress+'%';
      e.target.style.setProperty('--fill',p.progress+'%');
      saveEdit();
    });
    if($('priceInput'))$('priceInput').addEventListener('input',function(e){p.price=e.target.value;saveEdit();});
    /* reorder in list */
    if($('moveUp'))$('moveUp').addEventListener('click',function(){var i=state.paintings.indexOf(p);if(i>0){state.paintings.splice(i,1);state.paintings.splice(i-1,0,p);save();pushHistory();toast('Moved earlier ✓',900);}else toast('Already first',900);});

  function refreshPins(){

    pinsEl.querySelectorAll('.pin').forEach(function(pn){pn.addEventListener('click',function(){
      delete active().colors[pn.getAttribute('data-code')]; updateMeta(); renderTabs(); renderGrid(); saveEdit();
    });});
  }
  function renderGrid(){
    var g=$('grid'); if(!g)return;
    var p=active(); var q=query.toLowerCase();
    var usedSet=usedColorSet();
    var shown=0, html='';
    DMC.forEach(function(row){
      var code=row[0], name=row[1], hex=row[2];
      var sel=!!p.colors[code];
      if(state.onlySel&&!sel)return;
      if(q&&code.toLowerCase().indexOf(q)===-1&&name.toLowerCase().indexOf(q)===-1)return;
      if(colorFamily&&FAMOF[code]!==colorFamily)return;
      shown++;
      /* the basket only says something new on colours this project doesn't use —
         on the ones it does it would be on every single selected card */
      var basket=sel?'':stashIcon(stashLevel(code,usedSet),true);
      html+='<div class="card'+(sel?' sel':'')+'" data-code="'+code+'" role="button" tabindex="0" aria-pressed="'+(sel?'true':'false')+'" aria-label="'+code+' '+esc(name)+'">'+
        '<div class="drill" style="background-color:'+hex+'"></div>'+
        '<div class="ctext"><div class="code">'+code+basket+'</div><div class="cname">'+esc(name)+'</div></div>'+
        '<div class="tick">✓</div></div>';
    });
    g.innerHTML=html;
    /* one delegated listener instead of one per card */
    g.onclick=function(e){
      var t=e.target;
      var c=(t&&t.closest)?t.closest('.card'):null;
      if(!c)return;
      var code=c.getAttribute('data-code'); if(!code)return;
      var pp=active();
      if(pp.colors[code]){delete pp.colors[code]; c.classList.remove('sel');}
      else {pp.colors[code]=1; c.classList.add('sel');}
      c.setAttribute('aria-pressed',pp.colors[code]?'true':'false');
      updateMeta(); renderTabs(); refreshPins(); saveEdit();
    };
    updateMeta(shown);
    refreshPins();
  }
  function updateMeta(shown){
    var g=$('grid'); if(!g)return;
    var p=active(); var n=Object.keys(p.colors).length;
    if(typeof shown==='undefined')shown=g.children.length;
    var cEl=$('count'); if(!cEl)return;
    cEl.textContent=p.name+': '+n+' color'+(n===1?'':'s')+' · showing '+shown+' of '+DMC.length;
    var e=$('emptyMsg');
    if(shown===0){
      e.style.display='block';
      e.textContent=(state.onlySel&&n===0)
        ? 'No colors marked for this painting yet. Turn off “Selected only” and tap the colors it uses.'
        : 'No colors match that search.';
    } else e.style.display='none';
    $('hint').textContent=state.onlySel?'':'Tap a color to mark it';
  }

  /* ---------- find page ---------- */
  function typeOk(p){return findType==='any'||p.type===findType;}
  function paintingsWith(code){
    return state.paintings.filter(function(p){return typeOk(p)&&!!p.colors[code];});
  }
  function paintingsWithSize(sz){
    return state.paintings.filter(function(p){return typeOk(p)&&p.size===sz;});
  }
  function paintingsWithSpec(f,eid){
    return state.paintings.filter(function(p){return typeOk(p)&&p.spec&&p.spec[f]&&!!p.spec[f][eid];});
  }
  function sortByRating(list){
    return list.slice().sort(function(a,b){
      var ra=ratingOf(a); ra=(ra===null||isNaN(ra))?-1:ra;
      var rb=ratingOf(b); rb=(rb===null||isNaN(rb))?-1:rb;
      return rb-ra;
    });
  }
  /* a tappable div announces itself as a button and lets a keyboard reach it */
  function asButton(el,label,expanded){
    el.setAttribute('role','button'); el.tabIndex=0;
    if(label)el.setAttribute('aria-label',label);
    if(expanded!==undefined)el.setAttribute('aria-expanded',expanded?'true':'false');
  }
  function expanderEl(headHtml,owners){
    var ex=document.createElement('div');
    ex.className='expander';
    ex.innerHTML='<div class="exp-head">'+headHtml+'</div>'+(owners.length?'<div class="exp-list"></div>':'');
    var listEl=ex.querySelector('.exp-list');
    sortByRating(owners).forEach(function(p){
      var it=document.createElement('div');
      it.className='exp-item';
      it.innerHTML='<span class="exp-name">'+esc(p.name)+'</span>'+ratingBadge(p)+badgeHtml(p.type);
      asButton(it,'Open '+p.name);
      it.addEventListener('click',function(ev){
        ev.stopPropagation();
        navTo('paint',p.id);
      });
      listEl.appendChild(it);
    });
    return ex;
  }

  function renderFind(){
    var pg=$('page');
    /* The shapes used to sit in a row of their own above the search box, labelled
       "Diamond type:", and were so easy to walk past that they were forgotten
       entirely. They belong with the search box, because narrowing by shape is
       the same act as searching, and they are toggles now: tap ■ for square
       only, tap it again for all three. */
    pg.innerHTML=
      '<div class="toolbar"><label class="search">🔎<input id="fq" type="text" inputmode="search" placeholder="Search a number, name, size or tag…" value="'+esc(findQuery)+'"></label>'+
        '<span class="fshapes">'+
          '<button class="tbtn sq'+(findType==='square'?' on':'')+'" data-t="square" type="button" title="Count square-drill projects only" aria-label="Count square-drill projects only" aria-pressed="'+(findType==='square')+'">■</button>'+
          '<button class="tbtn rd'+(findType==='round'?' on':'')+'" data-t="round" type="button" title="Count round-drill projects only" aria-label="Count round-drill projects only" aria-pressed="'+(findType==='round')+'">●</button>'+
          '<button class="tbtn od'+(findType==='odd'?' on':'')+'" data-t="odd" type="button" title="Count odd-drill projects only" aria-label="Count odd-drill projects only" aria-pressed="'+(findType==='odd')+'">✦</button>'+
        '</span>'+
        '<button class="chipbtn'+(findStash?' on':'')+'" id="fStash" type="button" title="Show only colours you have leftovers of">🧺 Leftovers only</button>'+
        '<button class="chipbtn'+(findPaste?' on':'')+'" id="fPaste" type="button" title="Paste a kit’s colour list and see what you already have">🧾 Check a kit list</button>'+
      '</div>'+
      (findType!=='any'?('<div class="fbanner" id="fClear">Counting <b>'+TYPES[findType].sym+' '+esc(TYPES[findType].label.toLowerCase())+
        '</b> projects only — tap to count them all again</div>'):'')+
      (findPaste?'<div class="backup" id="fPasteBox" style="margin-bottom:10px;"></div>':'')+
      '<div class="jumpbar" id="fjump"></div>'+
      '<div class="meta"><span id="fmeta"></span><span>Tap anything to see which paintings have it</span></div>'+
      '<div id="fspecials"></div>'+
      '<div id="fcolorsec"></div>'+
      '<div class="empty" id="femptyMsg" style="display:none"></div>';
    pg.querySelectorAll('.tbtn').forEach(function(b){
      b.addEventListener('click',function(){
        var t=b.getAttribute('data-t');
        findType=(findType===t)?'any':t;   /* the same shape again means all of them */
        renderFind();
      });
    });
    if($('fClear'))$('fClear').addEventListener('click',function(){findType='any';renderFind();});
    $('fStash').addEventListener('click',function(){findStash=!findStash;renderFind();});
    $('fPaste').addEventListener('click',function(){
      findPaste=!findPaste;
      if(!findPaste){findPasteReview=null;findPasteText='';}
      renderFind();
    });
    /* rebuilding 454 colour cards on every keystroke makes typing feel sticky
       on an old phone — a shared breath after the last key is invisible */
    var fqT=null;
    $('fq').addEventListener('input',function(e){
      findQuery=e.target.value;
      clearTimeout(fqT); fqT=setTimeout(renderFindLists,150);
    });
    if(findPaste)fillFindPasteBox();
    renderFindLists();
  }

  /* "Check a kit list": paste a kit's colour numbers and see, before buying,
     what you already own — nothing is added anywhere, it's just a report */
  function fillFindPasteBox(){
    var box=$('fPasteBox'); if(!box)return;
    var h='<div class="bk-note">Paste a kit’s colour numbers — commas, spaces or whole chart rows all work. '+
      'Nothing is added anywhere; you just get a report of what you already have.</div>'+
      '<textarea id="fPasteText" rows="3" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;background:var(--panel);color:var(--ink);" placeholder="e.g. 321, 310 700 3801 White — or a whole chart: 1 V 168  2 B 310 …">'+esc(findPasteText)+'</textarea>'+
      '<div class="bk-btns" style="margin-top:8px;">'+
        '<button class="chipbtn" id="fPasteCheck" type="button" style="background:var(--accent);border-color:var(--accent);color:#fff;">Check this kit</button>'+
        '<button class="chipbtn" id="fPasteClose" type="button">Close</button></div>';
    if(findPasteReview){
      var m=findPasteReview.matched;
      var usedSet=usedColorSet();
      var groups={fresh:[],stash:[],owned:[]};
      m.forEach(function(x){
        var owners=paintingsWith(x.code);
        var it={x:x,owners:owners.length};
        if(hasLeftovers(x.code,usedSet))groups.stash.push(it);
        else if(owners.length)groups.owned.push(it);
        else groups.fresh.push(it);
      });
      var fixed=findPasteReview.fixes||[];
      h+='<div class="bk-note" style="margin-top:10px;"><b>'+m.length+'</b> DMC number'+(m.length===1?'':'s')+' recognised · '+
        '🧺 '+groups.stash.length+' in your leftovers · '+groups.owned.length+' in your paintings · '+
        groups.fresh.length+' new to you'+
        (fixed.length?(' · '+fixed.length+' repaired'):'')+
        (findPasteReview.ignored?(' · '+findPasteReview.ignored+' row number'+(findPasteReview.ignored===1?'':'s')+'/symbol'+(findPasteReview.ignored===1?'':'s')+' skipped'):'')+'</div>';
      if(fixed.length)
        h+='<div class="bk-note" style="margin-top:6px;color:var(--star);font-weight:700;">⚠ Repaired misreads: '+
          fixed.map(esc).join(' · ')+' — check these against the kit’s chart.</div>';
      function cardsHtml(list){
        return '<div class="grid compact" style="margin-top:6px;">'+list.map(function(it){
          var row=DMCMAP[it.x.code];
          var sub=it.x.from?('⚠ read “'+esc(it.x.from)+'”'):esc(row[1]);
          return '<div class="card ro" style="'+(it.x.from?'border-color:var(--star);':'')+'">'+
            '<div class="drill" style="background-color:'+row[2]+'"></div>'+
            '<div class="ctext"><div class="code">'+row[0]+stashIcon(stashLevel(row[0],usedSet),true)+'</div><div class="cname"'+
              (it.x.from?' style="color:var(--star);font-weight:700;"':'')+'>'+sub+'</div></div>'+
            '<div class="pcount'+(it.owners?'':' zero')+'">'+it.owners+'</div></div>';
        }).join('')+'</div>';
      }
      if(findType!=='any')
        h+='<div class="bk-note" style="margin-top:4px;">Painting counts respect the '+TYPES[findType].sym+' '+TYPES[findType].label.toLowerCase()+' filter above — switch it to All to count every painting.</div>';
      if(groups.fresh.length)h+='<div class="section-lbl">🆕 New to you ('+groups.fresh.length+')</div>'+cardsHtml(groups.fresh);
      if(groups.stash.length)h+='<div class="section-lbl">🧺 In your leftovers ('+groups.stash.length+')</div>'+cardsHtml(groups.stash);
      if(groups.owned.length)h+='<div class="section-lbl">In your projects, but you marked them used up ('+groups.owned.length+')</div>'+cardsHtml(groups.owned);
      if(!m.length)h+='<div class="vw-empty" style="margin-top:8px;">No DMC numbers found in that text.</div>';
      if(findPasteReview.unknown.length)
        h+='<div class="bk-note" style="margin-top:8px;">Not recognised: '+findPasteReview.unknown.map(esc).join(', ')+'</div>';
    }
    box.innerHTML=h;
    var ta=$('fPasteText');
    if(ta)ta.addEventListener('input',function(e){findPasteText=e.target.value;});
    $('fPasteCheck').addEventListener('click',function(){
      findPasteReview=parsePasteText(findPasteText,{colors:{}});
      fillFindPasteBox();
    });
    $('fPasteClose').addEventListener('click',function(){
      findPaste=false; findPasteReview=null; findPasteText='';
      renderFind();
    });
  }

  /* The Find page is one long ribbon: sizes, media, every kind of special
     diamond, and then 454 colours. Reaching the colours meant scrolling past all
     of it, and reaching the sizes again meant scrolling back. Each heading now
     folds its own section away and the bar at the top jumps straight to one. */
  function findClosed(key){return !!(state.findClosed&&state.findClosed[key]);}
  function toggleFindSection(key,forceOpen){
    if(!state.findClosed)state.findClosed={};
    if(forceOpen)delete state.findClosed[key];
    else if(state.findClosed[key])delete state.findClosed[key];
    else state.findClosed[key]=1;
    save();
  }
  function findHead(key,label,count,color){
    return '<div class="section-lbl fsec-hd" data-sec="'+esc(key)+'" role="button" tabindex="0" aria-expanded="'+(findClosed(key)?'false':'true')+'"'+(color?' style="color:'+color+'"':'')+'>'+
      (findClosed(key)?'▸':'▾')+' '+label+' <span class="fsec-n">'+count+'</span></div>';
  }
  function renderFindLists(){
    var q=findQuery.toLowerCase();
    var fs=$('fspecials'); fs.innerHTML='';
    var secs=[]; /* what the jump bar will offer, in the order they appear */

    /* "Leftovers only" is about colours, so the other sections step aside */
    var sizesShown=findStash?[]:state.sizes.filter(function(sz){
      return !q||sz.toLowerCase().indexOf(q)!==-1;
    });
    if(sizesShown.length){
      secs.push({key:'sizes',label:'Sizes',n:sizesShown.length});
      var slbl=document.createElement('div');
      slbl.innerHTML=findHead('sizes','Sizes (cm)',sizesShown.length);
      fs.appendChild(slbl.firstChild);
      var sgrid=document.createElement('div'); sgrid.className='grid';
      sgrid.id='sec-sizes';
      if(findClosed('sizes'))sgrid.style.display='none';
      sizesShown.forEach(function(sz){
        var owners=paintingsWithSize(sz);
        var c=document.createElement('div');
        c.className='card'+(expandedSize===sz?' open':'');
        asButton(c,sz+' cm — '+owners.length+' projects',expandedSize===sz);
        c.innerHTML='<div class="drill spec" style="background-color:var(--ink);font-size:11px;">▭</div>'+
          '<div class="ctext"><div class="code">'+esc(sz)+'</div><div class="cname">size</div></div>'+
          '<div class="pcount'+(owners.length?'':' zero')+'">'+owners.length+'</div>';
        c.addEventListener('click',function(){
          expandedSize=(expandedSize===sz)?null:sz; expandedColor=null; expandedSpec=null; expandedMedia=null;
          renderFindLists();
        });
        sgrid.appendChild(c);
        if(expandedSize===sz){
          var typeTxt=(findType!=='any')?(' ('+TYPES[findType].sym+' '+TYPES[findType].label.toLowerCase()+' only)'):'';
          var head=owners.length
            ? esc(sz)+' cm: '+owners.length+' project'+(owners.length===1?'':'s')+typeTxt+':'
            : 'No projects are '+esc(sz)+' cm'+typeTxt+'.';
          sgrid.appendChild(expanderEl(head,owners));
        }
      });
      fs.appendChild(sgrid);
    }

    /* tags — "which of mine were good?" is the same kind of question as "which
       are 30×40?", and it was the one thing you couldn't ask here. A tag belongs
       to any kind of project, so the drill-shape filter doesn't apply to it. */
    var tagsShown=findStash?[]:state.tags.filter(function(t){return !q||t.toLowerCase().indexOf(q)!==-1;})
      .filter(function(t){return state.paintings.some(function(p){return p.tags&&p.tags[t];});});
    if(tagsShown.length){
      secs.push({key:'tags',label:'Tags',n:tagsShown.length});
      var tlbl=document.createElement('div');
      tlbl.innerHTML=findHead('tags','Tags',tagsShown.length);
      fs.appendChild(tlbl.firstChild);
      var tgrid=document.createElement('div'); tgrid.className='grid';
      tgrid.id='sec-tags';
      if(findClosed('tags'))tgrid.style.display='none';
      tagsShown.forEach(function(tg){
        var owners=state.paintings.filter(function(p){return p.tags&&p.tags[tg];});
        var sgn=tagSign(tg);
        var c=document.createElement('div');
        c.className='card'+(expandedTag===tg?' open':'');
        asButton(c,'Tag '+tg+' — '+owners.length+' projects',expandedTag===tg);
        c.innerHTML='<div class="drill spec" style="background-color:'+(sgn===1?'var(--rd)':(sgn===-1?'var(--bad)':'var(--unk)'))+
            ';font-size:12px;">'+(sgn===1?'＋':(sgn===-1?'−':'·'))+'</div>'+
          '<div class="ctext"><div class="code">'+esc(tg)+'</div><div class="cname">'+
            (sgn===1?'good tag':(sgn===-1?'bad tag':'describing'))+'</div></div>'+
          '<div class="pcount'+(owners.length?'':' zero')+'">'+owners.length+'</div>';
        c.addEventListener('click',function(){
          expandedTag=(expandedTag===tg)?null:tg; expandedColor=null; expandedSpec=null; expandedSize=null; expandedMedia=null;
          renderFindLists();
        });
        tgrid.appendChild(c);
        if(expandedTag===tg){
          var head=esc(tg)+' — '+owners.length+' project'+(owners.length===1?'':'s')+':';
          tgrid.appendChild(expanderEl(head,owners));
        }
      });
      fs.appendChild(tgrid);
    }

    /* media & tools — spans paint-by-number and drawings, so the diamond-type
       filter above doesn't apply to it */
    var mediaShown=findStash?[]:state.media.filter(function(m){return !q||m.toLowerCase().indexOf(q)!==-1;})
      .filter(function(m){return state.paintings.some(function(p){return p.media&&p.media[m];});});
    if(mediaShown.length){
      secs.push({key:'media',label:'Media',n:mediaShown.length});
      var mlbl=document.createElement('div');
      mlbl.innerHTML=findHead('media','Media &amp; tools',mediaShown.length);
      fs.appendChild(mlbl.firstChild);
      var mgrid=document.createElement('div'); mgrid.className='grid';
      mgrid.id='sec-media';
      if(findClosed('media'))mgrid.style.display='none';
      mediaShown.forEach(function(m){
        var owners=state.paintings.filter(function(p){return p.media&&p.media[m];});
        var c=document.createElement('div');
        c.className='card'+(expandedMedia===m?' open':'');
        asButton(c,m+' — '+owners.length+' projects',expandedMedia===m);
        c.innerHTML='<div class="drill spec" style="background-color:var(--accent);font-size:12px;">🖌</div>'+
          '<div class="ctext"><div class="code">'+esc(m)+'</div><div class="cname">media</div></div>'+
          '<div class="pcount'+(owners.length?'':' zero')+'">'+owners.length+'</div>';
        c.addEventListener('click',function(){
          expandedMedia=(expandedMedia===m)?null:m; expandedColor=null; expandedSpec=null; expandedSize=null;
          renderFindLists();
        });
        mgrid.appendChild(c);
        if(expandedMedia===m){
          var head=esc(m)+' — '+owners.length+' project'+(owners.length===1?'':'s')+':';
          mgrid.appendChild(expanderEl(head,owners));
        }
      });
      fs.appendChild(mgrid);
    }

    /* specials sections */
    FINISHES.forEach(function(f){
      var lib=findStash?[]:(state.specials[f.id]||[]).filter(function(en){
        return !q||en.text.toLowerCase().indexOf(q)!==-1;
      });
      if(!lib.length)return;
      var skey='fin-'+f.id;
      secs.push({key:skey,label:f.label,n:lib.length,color:f.fg});
      var lbl=document.createElement('div');
      lbl.innerHTML=findHead(skey,esc(f.label)+' special diamonds',lib.length,f.fg);
      fs.appendChild(lbl.firstChild);
      var grid=document.createElement('div'); grid.className='grid';
      grid.id='sec-'+skey;
      if(findClosed(skey))grid.style.display='none';
      lib.forEach(function(entry){
        var owners=paintingsWithSpec(f.id,entry.id);
        var kid=f.id+'|'+entry.id;
        var c=document.createElement('div');
        c.className='card'+(expandedSpec===kid?' open':'');
        asButton(c,entry.text+' ('+f.label+') — '+owners.length+' paintings',expandedSpec===kid);
        c.innerHTML=specCardHtml(f.id,entry,'<div class="pcount'+(owners.length?'':' zero')+'">'+owners.length+'</div>');
        c.addEventListener('click',function(){
          expandedSpec=(expandedSpec===kid)?null:kid; expandedColor=null; expandedSize=null;
          renderFindLists();
        });
        grid.appendChild(c);
        if(expandedSpec===kid){
          var typeTxt=(findType!=='any')?(' ('+TYPES[findType].sym+' '+TYPES[findType].label.toLowerCase()+' only)'):'';
          var head=owners.length
            ? esc(entry.text)+' ('+f.label+') is in '+owners.length+' painting'+(owners.length===1?'':'s')+typeTxt+':'
            : esc(entry.text)+' ('+f.label+') isn’t in any of your paintings'+typeTxt+'.';
          grid.appendChild(expanderEl(head,owners));
        }
      });
      fs.appendChild(grid);
    });

    /* colors grid — one pass over the paintings builds a code -> owners map,
       instead of re-scanning every painting for every one of the 454 colors */
    var csec=$('fcolorsec'); csec.innerHTML='';
    var g=document.createElement('div'); g.className='grid'; g.id='fgrid';
    var ownersByCode={};
    state.paintings.forEach(function(p){
      if(!typeOk(p))return;
      Object.keys(p.colors||{}).forEach(function(c){(ownersByCode[c]=ownersByCode[c]||[]).push(p);});
    });
    var usedSet=usedColorSet();
    var shown=0; var frag=document.createDocumentFragment();
    DMC.forEach(function(row){
      var code=row[0], name=row[1], hex=row[2];
      if(q&&code.toLowerCase().indexOf(q)===-1&&name.toLowerCase().indexOf(q)===-1)return;
      var lvl=stashLevel(code,usedSet), got=lvl!=='out';
      if(findStash&&!got)return;
      shown++;
      var owners=ownersByCode[code]||[];
      var c=document.createElement('div');
      c.className='card'+(expandedColor===code?' open':'');
      c.setAttribute('data-code',code);
      asButton(c,code+' '+name+' — in '+owners.length+' paintings',expandedColor===code);
      c.innerHTML='<div class="drill" style="background-color:'+hex+'"></div>'+
        '<div class="ctext"><div class="code">'+code+stashIcon(lvl,true)+'</div><div class="cname">'+esc(name)+'</div></div>'+
        '<div class="pcount'+(owners.length?'':' zero')+'">'+owners.length+'</div>';
      frag.appendChild(c);
      if(expandedColor===code){
        var typeTxt=(findType!=='any')?(' ('+TYPES[findType].sym+' '+TYPES[findType].label.toLowerCase()+' only)'):'';
        var head=owners.length
          ? code+' '+esc(name)+' is in '+owners.length+' painting'+(owners.length===1?'':'s')+typeTxt+':'
          : code+' '+esc(name)+' isn’t in any of your paintings'+typeTxt+'.';
        var ex=expanderEl(head,owners);
        /* have / running low / used up — the third state is the one that
           answers "should I order more of this before the next kit?" */
        var byDefault=(state.stash[code]===undefined);
        var row=document.createElement('div');
        row.className='bk-btns'; row.style.marginTop='8px'; row.style.alignItems='center';
        row.innerHTML='<span class="pd-lbl" style="margin:0;">Leftovers:</span>'+
          [['have','🧺 Have some'],['low','⏳ Running low'],['out','∅ None left']].map(function(o){
            return '<button type="button" class="chipbtn'+(lvl===o[0]?' on':'')+'" data-stash="'+o[0]+'">'+o[1]+'</button>';
          }).join('')+
          (byDefault&&owners.length?'<span class="bk-note" style="margin:0;">(counted automatically — it’s in your projects)</span>':'');
        row.querySelectorAll('[data-stash]').forEach(function(btn){
          btn.addEventListener('click',function(ev){
            ev.stopPropagation();
            setLeftovers(code,btn.getAttribute('data-stash'));
            save(); pushHistory(); renderFindLists();
          });
        });
        ex.appendChild(row);
        frag.appendChild(ex);
      }
    });
    g.appendChild(frag);
    g.onclick=function(e){
      var t=e.target;
      var c=(t&&t.closest)?t.closest('.card'):null;
      if(!c)return;
      var code=c.getAttribute('data-code'); if(!code)return;
      expandedColor=(expandedColor===code)?null:code; expandedSpec=null; expandedSize=null;
      renderFindLists();
    };
    if(shown){
      secs.push({key:'colors',label:'All colours',n:shown});
      var chd=document.createElement('div');
      chd.innerHTML=findHead('colors','All colours',shown);
      csec.appendChild(chd.firstChild);
      g.style.display=findClosed('colors')?'none':'';
      csec.appendChild(g);
    }

    /* the jump bar, built from the sections that actually exist right now — a
       search that hides the specials shouldn't leave dead links behind */
    var jb=$('fjump');
    if(jb){
      jb.innerHTML=secs.length>1
        ? '<span class="pd-lbl" style="margin:0">Jump to:</span>'+secs.map(function(s){
            return '<button class="jbtn" data-jump="'+esc(s.key)+'"'+(s.color?' style="color:'+s.color+'"':'')+
              ' type="button">'+esc(s.label)+' <span class="fsec-n">'+s.n+'</span></button>';
          }).join('')
        : '';
      jb.querySelectorAll('[data-jump]').forEach(function(b){
        b.addEventListener('click',function(){
          var key=b.getAttribute('data-jump');
          if(findClosed(key)){toggleFindSection(key,true);renderFindLists();}
          var hd=$('page').querySelector('.fsec-hd[data-sec="'+key+'"]');
          if(!hd)return;
          /* a plain jump, not a glide: smooth scrolling is quietly ignored in
             several situations and a jump that sometimes doesn't happen is worse
             than one that always does. The heading lights up instead, so the eye
             lands on the right place after the page moves under it. */
          hd.scrollIntoView({block:'start'});
          hd.classList.add('flash');
          setTimeout(function(){hd.classList.remove('flash');},1100);
        });
      });
    }
    $('page').querySelectorAll('.fsec-hd').forEach(function(h){
      h.addEventListener('click',function(){
        toggleFindSection(h.getAttribute('data-sec'));
        renderFindLists();
      });
    });
    var inAny=0;
    Object.keys(ownersByCode).forEach(function(k){if(DMCMAP[k])inAny++;});
    var inStash=0,lowN=0;
    DMC.forEach(function(r){var lv=stashLevel(r[0],usedSet);if(lv!=='out'){inStash++;if(lv==='low')lowN++;}});
    $('fmeta').textContent='Showing '+shown+' of '+DMC.length+' colors · '+inAny+' are in your paintings'+
      (findType!=='any'?' ('+TYPES[findType].label.toLowerCase()+')':'')+
      (inStash?' · 🧺 '+inStash+' in your leftovers'+(lowN?' (⏳ '+lowN+' running low)':''):'');
    var e=$('femptyMsg');
    if(shown===0&&(findStash||!$('fspecials').children.length)){
      e.style.display='block';
      e.textContent=findStash
        ? (inStash?'No leftover colours match that search.':'No leftovers yet — colours used in your projects count automatically, or tap a colour and say you have some.')
        : 'Nothing matches that search.';
    }
    else e.style.display='none';
  }

  /* ---------- text size & phone/full view ----------
     Bigger text is done by zooming the whole app, so buttons, photos and spacing
     grow with the words instead of the words outgrowing their boxes.
     The catch: zoom scales the page but NOT the width the CSS thinks it has. At
     150% on a 412px phone the layout still believes it has 412px when it really
     has 275, and columns meant for a monitor come back and overlap. So the width
     is worked out here, after the zoom, and the phone rules key off this
     attribute rather than off a plain @media width. */
  /* clientWidth first: it leaves out a desktop scrollbar, which innerWidth counts
     as usable room it isn't */
  function screenW(){try{return document.documentElement.clientWidth||window.innerWidth||900;}catch(e){return 900;}}
  function fontScale(){return SIZE.scale||100;}
  function loadSizePref(){
    try{
      var s=parseInt(localStorage.getItem('dpSize')||'',10);
      if(s>=80&&s<=220)SIZE.scale=Math.round(s/5)*5;
      var l=localStorage.getItem('dpLayout');
      if(l==='phone'||l==='full')SIZE.layout=l;
    }catch(e){}
    /* never chosen on this device? A phone starts a step up, a monitor at 100 —
       and the number is on screen either way, so it can be dragged from there */
    if(SIZE.scale==null)SIZE.scale=(screenW()<700?115:100);
    saveSizePref(); /* so the very next start can apply it before the first paint */
  }
  function saveSizePref(){
    try{localStorage.setItem('dpSize',String(SIZE.scale));localStorage.setItem('dpLayout',SIZE.layout);}catch(e){}
  }
  /* measured, not assumed: an element's own box is in unzoomed units while the
     rectangle it draws on screen is zoomed, and the ratio between them is the
     zoom actually in force. The photo-arranging maths needs it to convert. */
  function appZoom(){
    try{
      var a=$('app'); if(!a||!a.offsetWidth)return 1;
      var z=a.getBoundingClientRect().width/a.offsetWidth;
      return (z>0.05&&z<20)?z:1;
    }catch(e){return 1;}
  }
  function widthClass(){
    if(SIZE.layout==='phone')return 'tiny';
    if(SIZE.layout==='full')return 'wide';
    var eff=screenW()/(fontScale()/100);
    return eff<380?'micro':eff<560?'tiny':eff<780?'narrow':'wide';
  }
  function applySize(){
    var app=$('app'); if(!app)return;
    var f=fontScale();
    app.style.zoom=(f===100?'':String(f/100));
    app.setAttribute('data-vw',widthClass());
    /* the boot hint has done its job — the real setting is on the element now */
    var b=document.getElementById('sizeBoot'); if(b)b.remove();
  }
  function setFontScale(v){
    SIZE.scale=Math.max(80,Math.min(220,Math.round(v/5)*5));
    applySize(); saveSizePref();
    var n=$('szNow'); if(n)n.textContent=SIZE.scale+'%';
    /* turning the text up can itself push the layout into the narrow shape, so the
       phone/full button is refreshed in place — rebuilding it would yank the very
       button being held down out from under the finger */
    var m=$('szMode');
    if(m){var ph=(widthClass()!=='wide');m.classList.toggle('on',ph);m.textContent=ph?'📱':'🖥';}
    var s=$('fsRange'); if(s){s.value=SIZE.scale;s.style.setProperty('--fill',((SIZE.scale-80)/140*100)+'%');}
    var sv=$('fsVal'); if(sv)sv.textContent=SIZE.scale+'%';
  }
  /* the same little cluster on every tab, so it is never hunted for */
  function renderSizeCtl(){
    var el=$('sizeCtl'); if(!el)return;
    var phone=(widthClass()!=='wide');
    el.innerHTML='<button class="szbtn" id="szDown" type="button" title="Smaller text" aria-label="Smaller text">A−</button>'+
      '<span class="sznow" id="szNow">'+fontScale()+'%</span>'+
      '<button class="szbtn" id="szUp" type="button" title="Bigger text" aria-label="Bigger text">A+</button>'+
      '<button class="szbtn'+(phone?' on':'')+'" id="szMode" type="button" title="'+
        (phone?'Switch to the full, wide layout':'Switch to the narrow phone layout')+'" aria-label="'+
        (phone?'Switch to the full, wide layout':'Switch to the narrow phone layout')+'">'+(phone?'📱':'🖥')+'</button>';
    $('szDown').addEventListener('click',function(){setFontScale(fontScale()-10);});
    $('szUp').addEventListener('click',function(){setFontScale(fontScale()+10);});
    $('szMode').addEventListener('click',function(){
      var nowPhone=(widthClass()!=='wide');
      SIZE.layout=nowPhone?'full':'phone';
      applySize(); saveSizePref(); render();
      toast(nowPhone?'Full, wide layout 🖥':'Narrow phone layout 📱',1500);
    });
  }
  window.addEventListener('resize',function(){if(SIZE.layout==='auto')applySize();});

  /* ---------- something behind the app ----------
     The layer lives outside the app's own box, so the text-size zoom can't
     stretch it, and behind everything, so nothing has to be see-through to let
     it show. Cards stay solid: a background you can read words through is a
     background that makes the words harder to read. */
  var BACKGROUNDS=[
    {id:'none',  label:'Plain',       hint:'Just the page colour.'},
    {id:'drills',label:'Drills',      hint:'A field of tiny drills, the colour of your accent.'},
    {id:'wash',  label:'Soft wash',   hint:'A quiet gradient from your accent colour.'},
    {id:'photo', label:'Your picture',hint:'One of your own photos, blurred right back so it can’t compete with the page.'}
  ];
  function bgMode(){
    var m=state.bg;
    return BACKGROUNDS.some(function(b){return b.id===m;})?m:'none';
  }
  function firstPhotoRef(){
    for(var i=0;i<state.paintings.length;i++){
      var p=state.paintings[i];
      if(p.photos&&p.photos.length)return {pid:p.id,i:0,phid:p.photos[0].id||''};
    }
    return null;
  }
  function bgPhotoData(){
    var r=state.bgPhoto; if(!r)return '';
    var p=findPainting(r.pid); if(!p||!p.photos)return '';
    var ph=null;
    /* by the photo's own name first — reordering or deleting photos must not
       quietly swap the background for a different picture */
    if(r.phid)for(var i=0;i<p.photos.length;i++)if(p.photos[i].id===r.phid){ph=p.photos[i];break;}
    if(!ph)ph=p.photos[r.i||0];
    /* blurred right back and stretched across the screen — the small copy is
       made for exactly this kind of glance */
    return thumbSrc(ph);
  }
  function applyBackground(){
    var mode=bgMode();
    var el=document.getElementById('bgArt');
    var app=$('app');
    if(mode==='none'){
      if(el)el.remove();
      if(app)app.style.background='';
      return;
    }
    if(!el){
      el=document.createElement('div'); el.id='bgArt';
      document.body.insertBefore(el,document.body.firstChild);
    }
    /* the app's own fill would sit on top of the layer and hide it */
    if(app)app.style.background='transparent';
    var acc=(ACCENTMAP[state.accent]||ACCENTMAP.violet).accent;
    el.className='bg-'+mode;
    el.style.backgroundImage='';
    if(mode==='drills'){
      var dot=state.dark?'rgba(255,255,255,.10)':'rgba(0,0,0,.07)';
      el.style.backgroundImage='radial-gradient('+dot+' 1.6px, transparent 1.7px)';
      el.style.backgroundSize='18px 18px';
      el.style.backgroundColor='';
    } else if(mode==='wash'){
      el.style.backgroundImage='linear-gradient(160deg,'+acc+' 0%, transparent 46%), '+
        'radial-gradient(circle at 88% 8%, '+acc+' 0%, transparent 38%)';
      el.style.backgroundSize='';
      el.style.backgroundColor='';
    } else {
      var d=bgPhotoData();
      if(!d){state.bg='none';applyBackground();return;}
      el.style.backgroundImage='url("'+d+'")';
      el.style.backgroundSize='cover';
      el.style.backgroundColor='';
    }
  }

  /* ---------- root ---------- */
  function applyTheme(){
    var app=$('app'); if(app)app.classList.toggle('dark',!!state.dark);
    try{localStorage.setItem('dpTheme',state.dark?'dark':'light');}catch(e){}
    /* the boot hint has done its job — its !important would otherwise override
       switching back to light mode */
    var boot=document.getElementById('themeBoot'); if(boot)boot.remove();
    try{
      var a=ACCENTMAP[state.accent]||ACCENTMAP.violet;
      if(app){app.style.setProperty('--accent',a.accent);app.style.setProperty('--accent-soft',state.dark?a.dsoft:a.soft);}
      document.documentElement.style.background=state.dark?'#16141B':'#F3F2F5';
      if(document.body)document.body.style.background=state.dark?'#16141B':'#F3F2F5';
      var mt=document.querySelector('meta[name="theme-color"]'); if(mt)mt.setAttribute('content',state.dark?'#16141B':'#F3F2F5');
    }catch(e){}
  }
  function render(){
    applyTheme();
    applyBackground();
    applySize();
    renderSizeCtl();
    var pgEl=$('page'); if(pgEl)pgEl.style.paddingBottom='';
    renderTabs();
    if(state.view==='overview')renderOverview();
    else if(state.view==='paintings')renderPaintings();
    else if(state.view==='find')renderFind();
    else if(state.view==='settings')renderSettings();
    else renderPainting();
  }

  /* ---------- when the app itself breaks ----------
     The worst failure this app can have is a blank page with all the data still
     inside it: one bad record from an old backup or an odd device, one thrown
     error mid-render, and the user is locked out of their own collection. So a
     render that throws lands here instead — a plain page that says what broke
     and, more importantly, hands over the backup code so nothing is trapped. */
  var crashing=false;
  function showCrash(err){
    if(crashing)return;   /* the crash page must not be able to crash-loop */
    crashing=true;
    try{if(window.console&&console.error)console.error(err);}catch(e){}
    var pg=$('page')||document.body;
    var msg=String((err&&err.message)||err||'unknown error');
    var code='';
    try{code=JSON.stringify(strippedState());}catch(e){}
    pg.innerHTML=
      '<div class="backup" style="margin-top:10px;">'+
        '<div style="font-weight:800;font-size:16px;margin-bottom:6px;">Something went wrong showing this page</div>'+
        '<div class="bk-note">The app hit an error it didn’t expect: <b>'+esc(msg)+'</b></div>'+
        '<div class="bk-note" style="margin-top:6px;">Your projects are still saved on this device. Before anything else, save the backup below somewhere safe — then try again.</div>'+
        '<div class="bk-btns" style="margin-top:10px;">'+
          '<button class="chipbtn" id="crashRetry" type="button" style="color:#fff;background:var(--accent);border-color:var(--accent);">↻ Try again</button>'+
          '<button class="chipbtn" id="crashFile" type="button">⬇ Download backup file</button>'+
        '</div>'+
        '<textarea id="crashCode" rows="5" readonly style="margin-top:10px;"></textarea>'+
        '<div class="bk-note" id="crashNote">'+(code?'This code is your whole collection except photos — copy it anywhere (notes app, email to yourself).':'Reading the saved data…')+'</div>'+
      '</div>';
    function fillCode(v){var ta=$('crashCode');if(ta)ta.value=v||'';}
    if(code)fillCode(code);
    else if(LOCAL){
      /* the in-memory state is what broke — read the stored copy directly */
      LOCAL.get(KEY).then(function(r){
        fillCode((r&&r.value)||'');
        var n=$('crashNote'); if(n)n.textContent=(r&&r.value)?'This is the saved copy straight from storage — copy it anywhere safe.':'Nothing could be read from storage on this device.';
      },function(){});
    }
    if($('crashRetry'))$('crashRetry').addEventListener('click',function(){
      crashing=false;
      render();
    });
    if($('crashFile'))$('crashFile').addEventListener('click',function(){
      var v=($('crashCode')&&$('crashCode').value)||code;
      try{var full=JSON.stringify(state);if(full&&full.length>v.length)v=full;}catch(e){}
      if(!v){toast('Nothing to download yet',1600);return;}
      var blob=new Blob([v],{type:'application/json'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='diamond-painting-rescue-'+(todayStr()||'today')+'.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    });
  }
  function guarded(fn){
    return function(){
      try{return fn.apply(this,arguments);}
      catch(err){showCrash(err);}
    };
  }
  render=guarded(render);
  renderPainting=guarded(renderPainting);
  renderPaintings=guarded(renderPaintings);
  renderFind=guarded(renderFind);
  renderOverview=guarded(renderOverview);
  renderSettings=guarded(renderSettings);

  $('fileInput').addEventListener('change',function(e){
    var files=e.target.files||[];
    plog('picker returned '+files.length+' file'+(files.length===1?'':'s'),
      files[0]?((files[0].name||'?')+' · '+(files[0].type||'no type')+' · '+fmtBytes(files[0].size||0)):'');
    if(chartPick){chartPick=false;if(files[0])setChartImage(files[0]);e.target.value='';return;}
    var pid=active().id;
    for(var i=0;i<files.length;i++)addImageFile(files[i],pid);
    e.target.value='';
  });

  /* Most of the tappable things on these pages are not real <button>s — colour
     cards, project cards, fold-away headings. They carry role="button" and a
     tabindex so a keyboard can reach them, and this one listener makes Enter
     and Space press whatever the focus is on. */
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    var t=e.target;
    if(t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.tagName!=='BUTTON'&&t.tagName!=='INPUT'){
      e.preventDefault();
      t.click();
    }
  });

  /* keyboard: Ctrl/Cmd+Z = undo, Ctrl/Cmd+Shift+Z or Ctrl+Y = redo */
  document.addEventListener('keydown',function(e){
    if(!(e.ctrlKey||e.metaKey))return;
    var k=(e.key||'').toLowerCase();
    var ae=document.activeElement;
    if(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&k==='z')return; /* let inputs do their own undo */
    if(k==='z'&&!e.shiftKey){e.preventDefault();doUndo();}
    else if((k==='z'&&e.shiftKey)||k==='y'){e.preventDefault();doRedo();}
  });

  /* pull newer cloud changes when the tab regains focus;
     write any pending local saves and push batched photo uploads before the
     tab goes away — pagehide is the last reliable moment on a phone */
  document.addEventListener('visibilitychange',function(){if(document.hidden){flushPendingSaves();flushCloud();}else syncNow();});
  window.addEventListener('focus',function(){syncNow();});
  window.addEventListener('online',function(){syncNow();});
  window.addEventListener('pagehide',function(){flushPendingSaves();flushCloud();});

  /* keep arranged photos in place when the window is resized or rotated */
  var resizeT=null;
  window.addEventListener('resize',function(){
    if(state.view!=='paint')return;
    clearTimeout(resizeT);
    resizeT=setTimeout(function(){
      var p=active();
      if(p&&(p.arranged||arrangeMode))buildArrLayer(p);
    },200);
  });

  plog('app started','');
  loadSizePref();
  load(function(){
    render();replaceNav();
    /* housekeeping that can wait until the app has settled on screen */
    setTimeout(migrateThumbs,2500);
    setTimeout(maybeBackupNudge,4000);
  });
})();
</script>

<script>
  /* installable + offline app (PWA) */
  /* the build stamp rides along in the worker's address: a new build is a new
     address, so the browser must fetch the new worker — and the worker names
     its cache after the stamp, so a new build can never serve stale files */
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js?v='+encodeURIComponent(window.APP_VERSION||'dev')).catch(function(){});
    });
  }
</script>

</body>
</html>
